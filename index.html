function botSay(kind, force){
  if(!S || S.auto || S.sim || S.fast || S.pvp) return;
  const now = Date.now();
  if(!force && (now - (S.lastSay || 0) < 3500 || Math.random() > .45)) return;
  const L = (LINES[S.p[1].di] || LINES[0])[kind]; const c = centerOf('h:1'); if(!L || !c) return;
  S.lastSay = now;
  const d = addFx('say ' + (c.x > innerWidth / 2 ? 'l' : 'r'), c.x, c.y); d.textContent = pick(L); setTimeout(() => d.remove(), 2300);
}

/* ---------- local progress: stats, alt-art found, tutorial done ---------- */
function loadJ(k, d){ try{ return JSON.parse(localStorage.getItem(k) || 'null') || d; }catch(e){ return d; } }
function saveJ(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function markAltSeen(id){ const a = loadJ('lao-legend-alts', []); if(!a.includes(id)){ a.push(id); saveJ('lao-legend-alts', a); } }
function recordGame(won){
  const st = loadJ('lao-legend-stats', {played:0, won:0});
  st.played = (st.played || 0) + 1; if(won) st.won = (st.won || 0) + 1;
  st.deck = st.deck || []; while(st.deck.length < DECKS.length) st.deck.push({p:0, w:0}); st.level = st.level || [{p:0,w:0},{p:0,w:0},{p:0,w:0}];
  const d = st.deck[S.p[0].di], l = st.level[S.level]; d.p++; l.p++; if(won){ d.w++; l.w++; }
  st.streak = won ? (st.streak || 0) + 1 : 0; st.best = Math.max(st.best || 0, st.streak);
  saveJ('lao-legend-stats', st);
  if(S.cdeck){ const cd = col().decks.find(x => x.id === S.cdeck); if(cd){ cd.p = (cd.p || 0) + 1; if(won) cd.w = (cd.w || 0) + 1; saveCol(); } }
}

/* ---------- engine ---------- */
const OPTIONAL = new Set(['phikrasue','kumphan','naiphan','thaenfahong','naktanu','santhaman','phuthao','ueaysong','luksaolao','hackxm']);
const cur = () => S.p[S.turn];
const pi = p => S.p.indexOf(p);
const opp = p => S.p[1 - pi(p)];
const oppLoc = p => { const q = S.p.includes(p) ? opp(p) : null; return q ? q.loc : null; };  // safe when a finished game's bot turn is still unwinding
const isBot = p => p.bot || S.auto;
const tkey = t => t.kind === 'hero' ? 'h:' + pi(t.owner) : 'c:' + t.c.uid;

function mkPlayer(name, di, bot, level, list){
  const deck = [];
  for(const [id, n] of Object.entries(list || DECKS[di].list)) for(let i=0;i<n;i++) deck.push(id);
  shuffle(deck);
  return {name, bot, di, level, life:20, maxMana:0, mana:0, penalty:0, deck, hand:[], field:[], loc:null, grave:[], tales:talesOf(list || DECKS[di].list), extra:fusionsOf(list || DECKS[di].list), fused:[]};
}
// keep every picture of both decks in memory, so re-drawing the board never shows a blank card
const IMG_KEEP = new Map();
function preloadArt(files){
  for(const f of files){ if(IMG_KEEP.has(f)) continue; const im = new Image(); im.decoding = 'async'; im.src = ART + f + '.jpg'; IMG_KEEP.set(f, im); }
}
function deckArt(di, list){ return Object.keys(list || DECKS[di].list).flatMap(id => ALT[id] ? [C[id].img, ALT[id]] : [C[id].img]); }
// a picture that failed (slow or dropped connection) gets two more tries before it gives up
document.addEventListener('keydown', e => { if(e.key === 'Escape' && ui.grave){ ui.grave = null; render(); } });
document.addEventListener('error', e => {
  const im = e.target; if(!(im instanceof HTMLImageElement)) return;
  const src = im.getAttribute('src') || ''; if(!src.startsWith(ART)) return;
  const n = +(im.dataset.retry || 0); if(n >= 2){ im.classList.add('broken'); return; }
  im.dataset.retry = n + 1;
  setTimeout(() => { im.src = src.split('?')[0] + '?r=' + (n + 1); }, 600 * (n + 1));
}, true);
function newGame(di, level, opts){
  opts = opts || {};
  ui.grave = null;
  const others = DECKS.map((_, i) => i).filter(x => x !== di);
  const bi = opts.pvp ? opts.pvp.di : (opts.botDeck != null ? opts.botDeck : pick(others));
  S = {screen:'game', p:[mkPlayer('ເຈົ້າ', di, false, level, opts.list), mkPlayer('ບອດ', bi, true, level)], turn:0, T:1, level, log:[], over:null,
       busy:false, targeting:null, sel:null, modal:null, fast:!!opts.fast, auto:!!opts.auto, onEnd:opts.onEnd, cdeck:opts.cdeck || null, reward:null, drop:null};
  if(opts.cover) S.p[0].cover = opts.cover;
  if(opts.pvp){   // 2 players, one device: whoever's turn it is always sits at the bottom (index 0); the pair swaps at every turn change
    S.pvp = opts.pvp; S.p[0].name = 'ຜູ້ຫຼິ້ນ 1'; S.p[1] = mkPlayer('ຜູ້ຫຼິ້ນ 2', bi, false, level, opts.pvp.list); if(opts.pvp.cover) S.p[1].cover = opts.pvp.cover;
  }
  if(S.auto){ S.p[0].name = 'ບອດ A'; S.p[1].name = 'ບອດ B'; }
  S.fest = opts.tut || (!SET.fest && !S.auto) ? null : shuffle(FESTS.map((_, i) => i)).slice(0, 4);
  if(opts.tut) for(const p of S.p) p.tales = [];
  if(!S.fast && petOn()) setTimeout(() => petSay('start'), 1400);
  if(!S.fast) preloadArt(['back', ...deckArt(di, opts.list), ...deckArt(bi)]);
  if(opts.levels){ S.p[0].level = opts.levels[0]; S.p[1].level = opts.levels[1]; }
  for(const p of S.p) for(let i=0;i<5;i++) drawRaw(p);
  S.turn = opts.first != null ? opts.first : (Math.random() < .5 ? 0 : 1);
  if(opts.tut){
    S.tut = {step:0};
    // make sure the first two turns have something to play: ນາກນ້ອຍ (1 ບຸນ) and ແມ່ນ້ຳຂອງ (2 ບຸນ)
    const me = S.p[0];
    for(const want of ['babynaga', 'maenamkhong']){
      if(me.hand.some(h => h.id === want)) continue;
      const i = me.deck.indexOf(want); if(i < 0) continue;
      me.deck.splice(i, 1); const out = me.hand.reduce((b, h) => C[h.id].cost > C[b.id].cost ? h : b, me.hand[0]);
      me.deck.unshift(out.id); out.id = want;
    }
  }
  if(S.pvp){ if(S.turn === 1){ S.p.reverse(); S.turn = 0; } log(S.p[0].name + ' ໄດ້ໄປກ່ອນ'); const G = S; render(); passScreen().then(() => { if(S === G) startTurn(); }); return; }
  log(S.turn === 0 ? 'ເຈົ້າໄດ້ໄປກ່ອນ' : 'ບອດໄດ້ໄປກ່ອນ');
  render();
  startTurn();
}
// cover the board until the next player has the device, so nobody sees the other hand
function passScreen(){ return new Promise(r => { S.modal = {type:'pass', name:S.p[0].name, resolve:r}; render(); }); }
function log(m){ if(!S) return; S.log.unshift(m); if(S.log.length > 60) S.log.pop(); }
function drawRaw(p){
  if(!p.deck.length) return false;
  const h = {uid:++U, id:p.deck.pop()};
  const mine = !S.auto && !S.sim && !S.pvp && p === S.p[0];
  if(ALT[h.id] && (mine ? (col().alts[h.id] || Math.random() < ALT_CHANCE * .4) : Math.random() < ALT_CHANCE)){
    h.alt = 1;
    if(mine) markAltSeen(h.id);
    if(!S.fast && mine && !col().alts[h.id]){ setTimeout(() => { const d = addFx('toast alt'); d.textContent = '✦ ໄດ້ກາດອາດພິເສດ: ' + C[h.id].name; setTimeout(() => d.remove(), 1900); sfx('spell'); }, 700); }
  }
  p.hand.push(h); return true;
}
function draw(p, n){
  if(!S || !S.p.includes(p)) return;
  for(let i=0;i<(n||1);i++){
    if(S.over) return;
    if(!drawRaw(p)){ log(p.name + ' ໝົດເດັກ'); gameOver(opp(p), 'deck'); return; }
  }
}
function costOf(p, id){

// put fresh copies of a character straight onto the field (they are not drawn from the deck)
async function summon(p, id, n){
  let k = 0;
  for(let i=0;i<n && p.field.length < 5;i++){ const c = {uid:++U, id, sick:!C[id].kw.rush, atk:0, items:[], mods:[]}; p.field.push(c); render(); await fxEnter(c); k++; }
  if(k) log(p.name + ' ເອີ້ນ «' + C[id].name + '» ' + k + ' ໃບ');
}
// a face-down trap springs: tell everyone, pay out its friends (ຊ້າງໃຈດີ grows, ກະຕ່າຍຫົວໃສ draws)
async function springTrap(q, id, c){
  if(!q || !q.traps || !q.traps.includes(id) || S.over) return false;
  q.traps.splice(q.traps.indexOf(id), 1); q.grave.push(id);
  log(q.name + ' ເປີດກັບດັກ «' + C[id].name + '»!');
  if(!S.fast){ toast('🪤 ຕົກກັບດັກ! «' + C[id].name + '»'); await fxActivate(id, null, pi(q)); }
  if(id === 'tanang' && c){ c.frz = S.T + 2; if(!S.fast) floatAt('c:' + c.uid, 'ຕິດໜ່າງ!', 'hit'); }
  for(const x of q.field) if(x.id === 'xangjaidi') x.mods.push({amt:1, exp:Infinity});
  const k = q.field.filter(x => x.id === 'kratai').length; if(k) draw(q, k);
  render(); return true;
}
function returnHacked(p){
  const q = opp(p);
  for(const c of p.field.filter(x => x.hacked)){
    p.field.splice(p.field.indexOf(c), 1); c.hacked = false; c.sick = false;
    if(q.field.length < 5){ q.field.push(c); log('«' + C[c.id].name + '» ກັບຄືນໄປຫາ ' + q.name); } else q.grave.push(...c.items, c.id);
  }
}
const encoreAt = p => p.field.some(x => x.id === 'manager') ? 6 : 8;
async function addFans(p, n){
  if(S.over || !n) return;
  p.fans = (p.fans || 0) + n; log(p.name + ' ແຟນ +' + n + ' (' + Math.min(p.fans, encoreAt(p)) + '/' + encoreAt(p) + ')');
  if(p.fans >= encoreAt(p)) await encore(p); else if(!S.fast) render();
}
// ອັງກໍ: every character may attack twice this turn (it waits for your turn if the fans peak during the other one)
async function encore(p){
  if(S.turn !== pi(p)){ p.fans = encoreAt(p); p.encoreReady = true; return; }
  p.fans = 0; p.encoreReady = false;
  for(const c of p.field){ c.x2 = S.T; c.sick = false; }
  log(p.name + ' ອັງກໍ! ຕົວລະຄອນທຸກໃບ ໂຈມຕີໄດ້ 2 ເທື່ອ');
  if(!S.fast){ toast('🎤 ອັງກໍ!'); flashScreen('#ff7ad9', .3); sfx('win'); for(const c of p.field) particlesAt('c:' + c.uid, '#ff7ad9', 12); render(); }
}
// take the first matching card out of the deck into the hand (the deck is shuffled, so it is a random one)
function tutor(p, f){
  const i = p.deck.findIndex(f); if(i < 0) return;
  const id = p.deck.splice(i, 1)[0]; p.hand.push({uid:++U, id}); log(p.name + ' ເອົາ «' + C[id].name + '» ຈາກເດັກມາໃສ່ມື');
}
// ປ່ຽນຮ່າງ: the card shows its true form (new power, maybe flying, maybe new art)
async function transform(p, c){
  const d = C[c.id]; if(!d.tf || c.tf || !p.field.includes(c)) return;
  c.tf = 1; log('«' + d.name + '» ປ່ຽນຮ່າງ' + (d.tf.name ? ' ເປັນ «' + d.tf.name + '»' : '') + '!');
  if(!S.fast){ render(); sfx('win'); particlesAt('c:' + c.uid, '#ffd23d', 30); const k = centerOf('c:' + c.uid); if(k) shockAt(k.x, k.y, '#ffd23d', 130); await fxRing('c:' + c.uid, '#ffd23d', true); }
  render();
}
// ນ້ຳຂຶ້ນ: each player has a water gauge; at 5 it floods the other side and drops back to 0
async function addWater(p, n){
  if(S.over || !n) return;
  p.water = Math.min(5, (p.water || 0) + n); log(p.name + ' ນ້ຳຂຶ້ນ ' + n + ' (ລະດັບ ' + p.water + '/5)');
  if(!S.fast) render();
  if(p.water >= 5) await flood(p);
}
async function flood(p){
  const q = opp(p), lim = p.field.some(x => x.id === 'suttharo') ? 4 : 3; p.water = 0;
  if(!S.fast){ flashScreen('#cfeaff', .3); await fxWave(); }
  const v = q.field.filter(c => pow(q, c) <= lim);
  await Promise.all(v.map(c => destroy(q, c, true)));
  log('ນ້ຳຖ້ວມເມືອງ! ທຳລາຍ ' + v.length + ' ໃບ'); render();
}
// ຄືນຊີບ: the strongest non-legend characters in the discard pile, cost maxCost or less
function reviveList(p, maxCost){
  return p.grave.filter(id => C[id].type === 'char' && !C[id].legend && C[id].cost <= maxCost).sort((a, b) => C[b].cost - C[a].cost || C[b].power - C[a].power);
}
async function revive(p, n, maxCost){
  let k = 0;
  for(let i=0;i<n && p.field.length < 5;i++){
    const id = reviveList(p, maxCost)[0]; if(!id) break;
    p.grave.splice(p.grave.indexOf(id), 1);
    const c = {uid:++U, id, sick:!C[id].kw.rush, atk:0, items:[], mods:[]}; p.field.push(c);
    if(!S.fast){ sfx('heal'); render(); particlesAt('c:' + c.uid, '#ffe08a', 18); }
    await fxEnter(c); log(p.name + ' ຄືນຊີບ «' + C[id].name + '»'); k++;
  }
  if(!k) log('ບໍ່ມີຕົວລະຄອນ ທີ່ຄືນຊີບໄດ້');
  render();
}
function bounce(owner, c){
  const i = owner.field.indexOf(c); if(i < 0) return;
  owner.field.splice(i, 1); owner.grave.push(...c.items); owner.hand.push({uid:++U, id:c.id, alt:c.alt});
}
async function destroy(p, c, quick){
  if(!p.field.includes(c)) return;
  if(c.shield){ c.shield = false; log('«' + C[c.id].name + '» ໂລ່ທິບ ກັນໄວ້'); if(!S.fast){ floatAt('c:' + c.uid, 'ໂລ່ທິບ!', 'heal'); render(); } return; }
  if(!S.fast){ sfx('destroy'); if(!S.auto) botSay(p === S.p[1] ? 'lose' : 'kill');
    const el = elOf('c:' + c.uid); if(el){ if(REDUCE) el.classList.add('dying'); else fxShatter(el, C[c.id].tribe); await sleep(quick ? 220 : 380); } }
  const i = p.field.indexOf(c); if(i < 0) return;
  p.field.splice(i, 1); (c.hacked ? opp(p) : p).grave.push(...c.items, c.id);
  log('«' + C[c.id].name + '» ຖືກທຳລາຍ');
  if(isFest('khaosak')) heal(c.hacked ? opp(p) : p, 1);
  if(p === S.p[1]) petSay('kill', .45);
  if(p === S.p[1] && !S.p[0].bot) questEvent('kill');
  if(c.items.includes('katip')){ draw(p, 1); log('ກະຕິບເຂົ້າ: ' + p.name + ' ຈົ່ວກາດ 1 ໃບ'); }
  if(c.id === 'phikongkoy'){ opp(p).penalty++; log('ສຽງຜີກອງກອຍ: ' + opp(p).name + ' ເສຍ 1 ບຸນ ຕາໜ້າ'); }
  if(c.id === 'nangnoy'){ draw(p, 1); log('ນາງນ້ອຍ: ' + p.name + ' ຈົ່ວກາດ 1 ໃບ'); }
  if(c.id === 'kangli'){ heal(p, 3); draw(p, 1); }
  if(c.items.includes('khanmakbeng')) heal(p, 2 * c.items.filter(x => x === 'khanmakbeng').length);
  if(c.id === 'krarokdon') await addWater(p, 2);
  if(p.loc === 'thammuet') heal(p, 1);
  // ດອກບົວທິບ: back on the field once, without the lotus
  if(c.items.includes('dokbuathip') && !S.over && p.field.length < 5){
    p.grave.splice(p.grave.lastIndexOf(c.id), 1);
    const n = {uid:++U, id:c.id, alt:c.alt, sick:!C[c.id].kw.rush, atk:0, items:[], mods:[]}; p.field.push(n);
    if(!S.fast){ sfx('heal'); render(); particlesAt('c:' + n.uid, '#ffb0d0', 18); }
    await fxEnter(n); log('ດອກບົວທິບ: «' + C[c.id].name + '» ກັບຄືນມາ');
  }
}
async function checkDeaths(){
  let again = true;
  while(again && S && !S.over){
    again = false;
    for(const p of S.p) for(const c of [...p.field]) if(pow(p, c) <= 0){ await destroy(p, c, true); again = true; }
  }
}
function heal(p, n){
  const b = p.life; p.life = Math.min(20, p.life + n); const g = p.life - b;
  if(g > 0){ floatAt('h:' + pi(p), '+' + g, 'heal'); fxHeal('h:' + pi(p)); log(p.name + ' ຟື້ນຂວັນ +' + g); }
}
function damageHero(p, n){
  if(p.field.some(x => x.id === 'punyeu') && n > 3){ n = 3; log('ປູ່ເຍີ້ຍ່າເຍີ້ ປົກປັກ: ເສຍຂວັນບໍ່ເກີນ 3'); }
  p.life -= n; if(p === S.p[1] && !S.p[0].bot) questEvent('face', n); floatAt('h:' + pi(p), '-' + n, ''); shakeEl('h:' + pi(p));
  if(!S.fast){ if(pi(p) === 0 && !S.auto) fxVignette(); if(n >= 6) fxBigShake(); if(p === S.p[1] && p.life > 0 && p.life <= 6) botSay('low'); }
  log(p.name + ' ເສຍຂວັນ ' + n);

}
async function attack(p, c, t){
  const q = opp(p);
  c.atk++;
  // ປົກປັກ: a guard steps in front of the friend being attacked
  if(t.kind === 'char'){
    const g = q.field.filter(x => x !== t.c && isGuard(x));
    if(g.length){ const gd = maxBy(g, x => pow(q, x)); log('«' + C[gd.id].name + '» ປົກປັກ «' + C[t.c.id].name + '»'); t = {kind:'char', owner:q, c:gd}; if(!S.fast) floatAt('c:' + gd.uid, 'ປົກປັກ!', 'heal'); }
  }
  if(c.items.includes('khaimuknak')) await addWater(p, c.items.filter(x => x === 'khaimuknak').length);
  // ຂຸມພາງ: an attacker of power 3 or less falls in before it lands
  if((q.traps || []).includes('khumphang') && pow(p, c, null, true) <= 3){
    await springTrap(q, 'khumphang'); await destroy(p, c); await checkDeaths(); render(); return;
  }
  render();
  await fxLunge('c:' + c.uid, tkey(t), C[c.id].tribe, t.kind === 'hero' ? pow(p, c, null, true) : pow(p, c, t.c, true));
  if(!S || S.over) return;

// ປ່ຽນໄພ້: once, before your first draw, swap any cards of the opening hand for new ones
function swapHand(p, uids){
  const out = p.hand.filter(h => uids.includes(h.uid)); if(!out.length) return;
  p.hand = p.hand.filter(h => !uids.includes(h.uid)); p.deck.push(...out.map(h => h.id)); shuffle(p.deck);
  for(let i = 0; i < out.length; i++) drawRaw(p);
  log(p.name + ' ປ່ຽນໄພ້ ' + out.length + ' ໃບ');
}

async function botTurn(){
  const G = S, p = cur(), q = opp(p);
  const live = () => S === G && !G.over;   // stop if the game ended or a new game started
  G.busy = true;
  await sleep(450);
  if(p.level === 2){ await botTurnHard(G, p); if(live()){ await sleep(280); if(live()) endTurn(); } return; }
  const fuseAll = async () => { for(const f of p.extra || []) if(live() && canFuse(p, f) && fuseGood(p, f)) await fuse(p, f); };
  if(p.level) await fuseAll();
  let guard = 0;
  while(live() && guard++ < 15){
    const ch = p.level === 0 ? botPickEasy(p, q) : botPick(p, q);
    if(!ch) break;
    if(!G.auto) await fxShowCard(ch.h.id, ch.h.alt);
    if(!live()) return;
    await playCard(p, ch.h, ch.t, ch.trib);
    await sleep(320);
  }
  if(p.level && live()) await fuseAll();
  const order = [...p.field].sort((a, b) => pow(p, b) - pow(p, a));
  for(const c of order){
    let g = 0;
    while(live() && p.field.includes(c) && canAttack(p, c) && g++ < 3){
      const t = p.level === 0 ? botTargetEasy(p, c) : botTarget(p, c);
      if(!t) break;
      await attack(p, c, t);
      await sleep(360);
    }
  }
  if(live()){ await sleep(280); if(live()) endTurn(); }
}

    } else if(h.id === 'hipsombat'){
      s = p.hand.length <= 5 ? 4 : 1.5;
    } else if(h.id === 'hotnampon'){
      s = p.life <= 14 ? 5 : 1.5;
    } else if(h.id === 'khuenyai'){
      s = (p.water || 0) >= 3 ? 5.5 : 2.5;
    } else if(h.id === 'thotkhap'){
      if(tl.length){ t = maxBy(tl, x => C[x.c.id].tf.power - pow(p, x.c) + (x.c.id === 'kamkadam' ? 8 : 0)); s = 3 + C[t.c.id].tf.power - pow(p, t.c); }
    } else if(h.id === 'bangfaikaeng'){
      const dmg = (p.water || 0) >= 3 ? 4 : 2;
      if(q.life <= dmg){ t = {kind:'hero', owner:q}; s = 100; }
      else { const k = en.filter(x => pow(q, x.c) <= dmg); if(k.length){ t = maxBy(k, x => C[x.c.id].cost + pow(q, x.c)); s = 3 + C[t.c.id].cost; } else { t = {kind:'hero', owner:q}; s = dmg >= 4 ? 3 : 1; } }
    } else if(h.id === 'namtamae'){
      const r = reviveList(p, 99)[0]; s = r ? C[r].cost * 2 + C[r].power - 3 : 0;
    } else if(h.id === 'haingeun'){
      s = .5;
    } else if(h.id === 'lomphayu'){
      const big = en.filter(x => C[x.c.id].cost >= 4 || x.c.items.length);
      if(big.length){ t = maxBy(big, x => C[x.c.id].cost + x.c.items.length * 2); s = C[t.c.id].cost; }
    }
    if(s > 0) s += taleWant(p, h.id) + (d.combo && p.combo >= 2 ? 3 : 0);
    if(s > bs){ bs = s; best = {h, t}; }
  }
  return best;
}
// medium bot leans toward finishing its tale
const taleWant = (p, id) => (p.tales || []).reduce((a, t) => { const T = TALES[t.i]; return a + (t.done || t.got.includes(id) || !T.ids.includes(id) ? 0 : (t.got.length === T.ids.length - 1 ? 3 : 1)); }, 0);
function botTarget(p, c){
  const q = opp(p); const ts = attackTargets(p, c); if(!ts.length) return null;
  const hero = ts.find(x => x.kind === 'hero');
  if(hero && pow(p, c, null, true) >= q.life) return hero;
  let best = null, bs = -1;
  for(const t of ts){
    if(t.kind !== 'char') continue;
    const a = pow(p, c, t.c, true), b = pow(q, t.c, c);
    const tv = C[t.c.id].cost + b, mv = C[c.id].cost + pow(p, c);
    let s = -1;
    if(a > b) s = tv + 2; else if(a === b && tv >= mv) s = tv - mv + 1;
    if(s > bs){ bs = s; best = t; }
  }
  // hitting ຂວັນ wins games; only a clearly better trade beats it
  if(hero && pow(p, c, null, true) * (DECKS[p.di].aggr || 1.3) + (q.life <= 10 ? 3 : 0) >= bs) return hero;
  return bs >= 0 ? best : null;
}
function botPickEasy(p, q){
  const opts = p.hand.filter(h => !playBlock(p, h));
  if(!opts.length || Math.random() < .15) return null;
  const h = pick(opts); const tl = targetsFor(p, h.id); let t = null;
  if(tl && tl.length){ const en = tl.filter(x => x.owner === q); t = pick(en.length ? en : tl); }
  return {h, t};
}
function botTargetEasy(p, c){
  if(Math.random() < .3) return null;
  const ts = attackTargets(p, c); return ts.length ? pick(ts) : null;
}
function botReact(q, p, c, t){
  if(q.level === 0) return false;
  if(t.kind === 'hero'){ const d = pow(p, c, null, true); return d >= q.life || d >= 4; }
  return pow(p, c, t.c, true) > pow(q, t.c, c) && C[t.c.id].cost >= 3;
}


/* ---------- hard bot: try every move on a copy of the game, keep the best ---------- */
function cloneState(hideIdx){
  const cp = (p, i) => ({name:p.name, bot:true, di:p.di, level:p.level, life:p.life, maxMana:p.maxMana, mana:p.mana, penalty:p.penalty,
    deck:null, hand:null,
    field:p.field.map(c => ({uid:c.uid, id:c.id, sick:c.sick, atk:c.atk, x2:c.x2, frz:c.frz, tf:c.tf, age:c.age, guard:c.guard, hacked:c.hacked, shield:c.shield, items:c.items.slice(), mods:c.mods.map(m => ({amt:m.amt, exp:m.exp}))})),
    loc:p.loc, locAge:p.locAge, water:p.water, fans:p.fans, encoreReady:p.encoreReady, traps:(p.traps || []).slice(), extra:p.extra, fused:(p.fused || []).slice(), combo:p.combo, mulled:true, tales:(p.tales || []).map(t => ({i:t.i, got:t.got.slice(), done:t.done})), grave:p.grave.slice(), lastMagic:p.lastMagic, _src:p, _i:i});
  const ps = S.p.map(cp);
  for(const q of ps){
    const src = q._src;
    if(q._i === hideIdx){
      // the bot may know how many cards you hold, never which ones
      const pool = shuffle(src.deck.concat(src.hand.map(h => h.id)));
      q.hand = src.hand.map((h, j) => ({uid:h.uid, id:pool[j]})); q.deck = pool.slice(src.hand.length);
    } else { q.hand = src.hand.map(h => ({uid:h.uid, id:h.id})); q.deck = shuffle(src.deck.slice()); }
    delete q._src; delete q._i;
  }
  return {screen:'game', p:ps, turn:S.turn, T:S.T, fest:S.fest, level:S.level, log:[], over:null, busy:true, targeting:null, sel:null, modal:null, fast:true, auto:true, sim:true};
}
function resolveT(tk){
  if(!tk) return null;
  if(tk[0] === 'h') return {kind:'hero', owner:S.p[+tk.slice(2)]};
  const uid = +tk.slice(2);
  for(const pl of S.p){ const c = pl.field.find(x => x.uid === uid); if(c) return {kind:'char', owner:pl, c}; }
  return null;
}
function hardMoves(p){
  const out = [{type:'end'}];
  for(const h of p.hand){
    if(playBlock(p, h)) continue;
    const tl = targetsFor(p, h.id);
    if(tl && tl.length) for(const t of tl) out.push({type:'play', uid:h.uid, tk:tkey(t)});
    else out.push({type:'play', uid:h.uid, tk:null});
  }
  for(const f of p.extra || []) if(canFuse(p, f)) out.push({type:'fuse', f});
  for(const h of p.hand) if(costOf(p, h.id) > p.mana && canTribute(p, h)){
    const two = p.field.filter(c => !c.hacked).sort((a, b) => pow(p, a) - pow(p, b)).slice(0, 2);
    out.push({type:'trib', uid:h.uid, a:two[0].uid, b:two[1].uid});
  }
  for(const c of p.field) if(canAttack(p, c)) for(const t of attackTargets(p, c)) out.push({type:'atk', uid:c.uid, tk:tkey(t)});
  return out;
}
async function applyMove(m){
  const p = cur();
  // a target can vanish mid-rollout (hacked, trapped), so skip moves whose target is gone
  if(m.type === 'play'){ const h = p.hand.find(x => x.uid === m.uid), t = resolveT(m.tk); if(h && (t || !m.tk)) await playCard(p, h, t); }
  else if(m.type === 'atk'){ const c = p.field.find(x => x.uid === m.uid), t = resolveT(m.tk); if(c && t) await attack(p, c, t); }
  else if(m.type === 'fuse'){ if(canFuse(p, m.f)) await fuse(p, m.f); }
  else if(m.type === 'trib'){ const h = p.hand.find(x => x.uid === m.uid), a = p.field.find(x => x.uid === m.a), b = p.field.find(x => x.uid === m.b); if(h && a && b && canTribute(p, h)) await playCard(p, h, null, [a, b]); }
}
function evalState(me){
  const P = S.p[me], Q = S.p[1 - me];
  if(S.over) return S.over.winner === me ? 1e4 : -1e4;
  const myPow = P.field.reduce((a, c) => a + pow(P, c), 0), opPow = Q.field.reduce((a, c) => a + pow(Q, c), 0);
  let e = (P.life - Q.life) * 1.2 + myPow * 1.5 - opPow * 1.7 + (P.field.length - Q.field.length) + (P.hand.length - Q.hand.length) * .6;
  e += P.field.filter(hasTaunt).length * 1.5;
  e -= Q.life * ((DECKS[P.di].aggr || 1.3) - 1);
  if(opPow >= P.life) e -= 60;
  if(myPow >= Q.life) e += 25;
  return e;
}
async function quickTurn(p, q){
  let g = 0;
  while(!S.over && g++ < 12){ const ch = botPick(p, q); if(!ch) break; await playCard(p, ch.h, ch.t); }
  for(const c of [...p.field].sort((a, b) => pow(p, b) - pow(p, a))){
    let k = 0;
    while(!S.over && p.field.includes(c) && canAttack(p, c) && k++ < 3){ const t = botTarget(p, c); if(!t) break; await attack(p, c, t); }
  }
}
async function passTurnSim(){
  const p = cur(); returnHacked(p);
  while(p.hand.length > 7) p.grave.push(p.hand.shift().id);
  for(const pl of S.p) for(const c of pl.field) c.mods = c.mods.filter(m => m.exp > S.T);
  await checkDeaths(); if(S.over) return;
  S.T++; S.turn = 1 - S.turn;
  const n = cur();
  for(const c of n.field){ c.sick = false; c.atk = 0; }
  draw(n, 1); if(S.over) return;
  if(n.loc === 'talatsao' && n.hand.length <= 2){ draw(n, 1); if(S.over) return; }
  n.maxMana = Math.min(10, n.maxMana + 1); n.mana = Math.max(0, n.maxMana - n.penalty); n.penalty = 0;
  const nk = n.field.filter(x => x.id === 'phayanak').length; if(nk) heal(n, 2 * nk);
  await turnStartEffects(n);
}
// play the move, finish this turn the medium way, let the opponent answer, then score
async function rolloutMove(m, me){
  const P = S.p[me], Q = S.p[1 - me];
  if(m.type !== 'end'){ await applyMove(m); if(!S.over) await quickTurn(P, Q); }
  if(!S.over) await passTurnSim();
  if(!S.over) await quickTurn(Q, P);
  return evalState(me);
}
async function botTurnHard(G, p){
  const me = pi(p); let guard = 0;
  while(S === G && !G.over && guard++ < 14){
    let best = null, bs = -Infinity;
    for(const m of hardMoves(p)){
      const real = S; let v = 0;
      try{ for(let r=0;r<2;r++){ S = cloneState(1 - me); v += await rolloutMove(m, me) / 2; } v += m.type === 'end' ? .05 : 0; }
      catch(err){ v = -Infinity; window.__errs.push('hard: ' + (err && err.stack || err)); }
      finally{ S = real; }
      if(v > bs){ bs = v; best = m; }
    }
    if(!best || best.type === 'end') break;
    if(best.type === 'play'){
      const h = p.hand.find(x => x.uid === best.uid); if(!h) break;
      await fxShowCard(h.id, h.alt); if(S !== G || G.over) return;
      await playCard(p, h, resolveT(best.tk));
    } else {
      const c = p.field.find(x => x.uid === best.uid), t = resolveT(best.tk); if(!c || !t) break;
      await attack(p, c, t);
    }
    await sleep(330);
  }
}

function fmtSkill(t){
  // highlight game words the way printed TCG cards do: trigger chips, keyword chips, coloured numbers
  const RULES = [
    [/«[^»]+»/g, 'kn'],
    [/ເມື່ອລົງສະໜາມ|ທຸກຕາ|ຢູ່ສະໜາມ|ເມື່ອໃບນີ້ຖືກທຳລາຍ|ເມື່ອທຳລາຍຕົວລະຄອນຂອງຄູ່ແຂ່ງໄດ້|ໃຊ້ຕອນຄູ່ແຂ່ງໂຈມຕີ|ເວລາໂຈມຕີ|ຕິດໃສ່ຕົວລະຄອນ(?:ເຜົ່າຍັກ)? 1 ໃບ/g, 'kt'],
    [/ກັນໄພ|ບິນ|ຮວມພົນ|ຄືນຊີບ|ປົກປັກ|ປ່ຽນຮ່າງ|ນ້ຳຂຶ້ນ|ນ້ຳຖ້ວມ|ແຮັກ|ກັບດັກ|ໂລ່ທິບ|ອັງກໍ/g, 'kk'],
    [/ເຜົ່າ(?:ນາກ|ຍັກ|ຜີ|ວິລະບຸລຸດ|ຫິມະພານ|ນັກປາດ|ເທວະດາ|ຊາວບ້ານ|ນັກຮົບ|ຜູ້ປົກປັກ|ໄຊບອກ|ສັດປ່າ|ນັກສະແດງ)/g, 'tr'],
    [/ແຟນ \+\d+/g, 'hp'], [/ຕໍ່ເນື່ອງ \d+/g, 'kk'],
    [/ພະລັງ \+\d+/g, 'up'], [/ພະລັງ -\d+/g, 'dn'], [/ຟື້ນຂວັນ \+\d+/g, 'hp'],
    [/ຈົ່ວກາດ \d+ ໃບ/g, 'dr'], [/ໂຈມຕີໄດ້ 2 ເທື່ອ(?:ຕໍ່ຕາ)?|ໂຈມຕີ \d+/g, 'dm']
  ];
  const bits = [];
  let s = String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  for(const [re, cls] of RULES) s = s.replace(re, m => { bits.push('<span class="kw-' + cls + '">' + m + '</span>'); return '\u0001' + (bits.length - 1) + '\u0002'; });
  return s.replace(/\u0001(\d+)\u0002/g, (m, i) => bits[+i]);
}

const PACKS = {
  basic:{name:'ຊອງທຳມະດາ', cost:100, desc:'5 ໃບ ຈາກທຸກເດັກ · ຫາຍາກຂຶ້ນໄປ ຢ່າງໜ້ອຍ 1 ໃບ', legend:.08, alt:.01},
  deck:{name:'ຊອງເດັກ', cost:150, desc:'5 ໃບ ຈາກເດັກທີ່ເລືອກ + ກາດກາງ', legend:.08, alt:.01},
  gold:{name:'ຊອງພິເສດ', cost:200, desc:'5 ໃບ · ຫາຍາກຂຶ້ນໄປ 2 ໃບ · ໂອກາດຕຳນານ ແລະ ອາດພິເສດ ສູງຂຶ້ນ', legend:.15, alt:.05}
};
const DUST_GET = {common:5, rare:20, legend:100, alt:200}, DUST_MAKE = {common:40, rare:100, legend:400};
const PITY = 10;
// the odds behind PACKS, per pack, so the shop can print them honestly
function packOdds(kind){ const k = PACKS[kind], l = 1 - (1 - k.legend) * (1 - k.legend); return {legend:Math.round(l * 100), alt:Math.round((1 - Math.pow(1 - k.alt, 5)) * 100)}; }
function rollPack(kind, di){
  const c = col(), k = PACKS[kind];
  let pool = Object.keys(C).filter(id => !C[id].fusion);
  if(kind === 'deck'){ const L = DECKS[di].list; pool = pool.filter(id => L[id] || NEUTRAL.has(id)); }
  const by = r => pool.filter(id => rarityOf(id) === r);
  const pickOf = r => {
    let ids = by(r); if(!ids.length) ids = by('rare').length ? by('rare') : pool;
    if(r === 'legend'){ const fresh = ids.filter(id => !owned(id)); if(fresh.length) ids = fresh; }   // no repeat legend until you have them all
    const w = ids.map(id => owned(id) >= RULE.copies ? 1 : (owned(id) ? 2 : 3));                    // cards you lack come up more often
    let t = Math.random() * w.reduce((a, b) => a + b, 0);
    for(let i = 0; i < ids.length; i++){ t -= w[i]; if(t <= 0) return ids[i]; } return ids[ids.length - 1];
  };
  const out = []; let gotLegend = false;
  for(let slot = 0; slot < 5; slot++){
    let r;
    if(slot === 3 || (kind === 'gold' && slot === 4)) r = Math.random() < k.legend ? 'legend' : 'rare';
    else if(slot === 4) r = Math.random() < k.legend ? 'legend' : (Math.random() < .35 ? 'rare' : 'common');
    else r = Math.random() < .15 ? 'rare' : 'common';
    if(slot === 3 && !gotLegend && c.pity >= PITY - 1 && !out.some(x => x.r === 'legend')) r = 'legend';
    const id = pickOf(r); if(rarityOf(id) === 'legend') gotLegend = true;
    out.push({id, r:rarityOf(id), alt:!!(ALT[id] && Math.random() < k.alt)});
  }
  c.pity = gotLegend ? 0 : c.pity + 1; c.packs++;
  for(const x of out){
    x.isNew = !owned(x.id);
    if(owned(x.id) < RULE.copies) c.cards[x.id] = owned(x.id) + 1; else { x.dust = DUST_GET[x.r]; c.dust += x.dust; }
    if(x.alt){ if(c.alts[x.id]){ c.dust += DUST_GET.alt; x.dust = (x.dust || 0) + DUST_GET.alt; } else { c.alts[x.id] = true; markAltSeen(x.id); x.isNew = true; } }
  }
  if(typeof questEvent === 'function') questEvent('pack', 1);
  saveCol(); return out;
}

// wait for an animation, but never longer than its own length: a hidden tab can hold 'finished' back forever
function animDone(an){
  const t = (an.effect && an.effect.getTiming && an.effect.getTiming().duration) || 500;
  return Promise.race([an.finished.catch(() => {}), new Promise(r => setTimeout(r, (+t || 500) + 60))]);
}

async function fxLunge(a, b, tribe, dmg){

function fxTick(now){
  const dt = Math.min(.05, (now - FX.last) / 1000); FX.last = now;
  const c = FX.ctx, d = FX.dpr; c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, innerWidth, innerHeight);
  if(FX.flash > 0){ c.globalAlpha = Math.min(1, FX.flash); c.fillStyle = FX.flashColor; c.fillRect(0, 0, innerWidth, innerHeight); FX.flash -= dt * 3.5; }
  for(let i = FX.ps.length - 1; i >= 0; i--){
    const p = FX.ps[i]; p.t += dt; if(p.t >= p.life){ FX.ps.splice(i, 1); continue; }
    const k = 1 - p.t / p.life;
    p.vx *= p.drag; p.vy = p.vy * p.drag + p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    c.globalCompositeOperation = p.solid ? 'source-over' : 'lighter';

    else if(p.kind === 'spark'){ c.lineWidth = p.size; c.lineCap = 'round'; c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * .045, p.y - p.vy * .045); c.stroke(); }
    else if(p.kind === 'ring'){ const r = p.r0 + (p.r1 - p.r0) * (1 - k * k); c.lineWidth = p.size * k + 1; c.beginPath(); c.arc(p.x, p.y, r, 0, 6.283); c.stroke(); }
    else if(p.kind === 'shard' || p.kind === 'leaf'){
      c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
      if(p.kind === 'leaf'){ c.beginPath(); c.ellipse(0, 0, p.size, p.size * .38, 0, 0, 6.283); c.fill(); }
      else { c.beginPath(); c.moveTo(-p.size / 2, -p.size / 3); c.lineTo(p.size / 2, -p.size / 4); c.lineTo(p.size / 3, p.size / 3); c.lineTo(-p.size / 3, p.size / 4); c.closePath(); c.fill(); c.strokeStyle = '#1b1b1b'; c.lineWidth = 1; c.stroke(); }

      const q = p.t / p.life, head = Math.min(1, q / .45), tail = Math.max(0, (q - .3) / .7);
      const pt = u => { const v = 1 - u; return [v * v * p.x0 + 2 * v * u * p.cx + u * u * p.x1, v * v * p.y0 + 2 * v * u * p.cy + u * u * p.y1]; };

    }
    else if(p.kind === 'slash'){
      const L = p.len * Math.min(1, p.t / p.life * 5), ca = Math.cos(p.ang), sa = Math.sin(p.ang);

};
