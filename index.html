<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ສະໜາມຕຳນານລາວ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao+Looped:wght@400;500;700;800&family=Noto+Sans+Lao:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: a dark Lao playmat; bot side on top, your side below, your hand along the bottom edge */
:root{
  --mat:#120f18;
  --mat-2:#1c1724;
  --mat-3:#2a2236;
  --ink:#f4efe4;
  --dim:#b3a995;
  --gold:#f2b632;
  --good:#4fd18b;
  --bad:#ff5d4d;
  --mana:#55c6ff;
  --line:#1b1b1b;
  --f-d:'Noto Sans Lao','Phetsarath OT',sans-serif;
  --f-b:'Noto Sans Lao Looped','Noto Sans Lao','Phetsarath OT',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);font-family:var(--f-b);
  background:
    radial-gradient(ellipse at 50% 50%,#2b2140 0%,transparent 65%),
    radial-gradient(circle at 1px 1px,#ffffff0b 1px,transparent 0) 0 0/18px 18px,
    var(--mat);}
button{font:inherit;color:inherit}
#app{height:100%}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}

/* ---------- full card face (same design as the card set) ---------- */
.card{position:relative;width:100%;aspect-ratio:63/88;border-radius:4.4%/3.2%;container-type:inline-size;background:var(--edge);box-shadow:0 6px 16px #0009}
.card .face{position:absolute;top:4.2cqw;left:4.2cqw;right:4.2cqw;bottom:5.4cqw;border-radius:3cqw;overflow:hidden;box-shadow:0 0 0 .7cqw #fff,0 0 0 1.3cqw var(--line)}
.card .art{position:absolute;inset:0}
.card .art img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
.card .cost{position:absolute;top:2.6cqw;left:2.6cqw;width:15cqw;border:.6cqw solid var(--line);border-radius:1.4cqw;overflow:hidden;background:#fff;text-align:center}
.card .lbl{display:block;font:800 2.9cqw/1.5 var(--f-d);color:#fff}
.card .cost .lbl{background:#1f9d6b}
.card .num{display:block;font:800 9cqw/1.15 var(--f-d);color:var(--line)}
.card .sym{position:absolute;top:2.6cqw;right:2.6cqw;width:13cqw;height:11cqw;border:.6cqw solid var(--line);border-radius:1.4cqw;background:#fff;display:grid;place-items:center}
.card .sym svg{width:78%;height:78%}
.card .panel{position:absolute;left:2.6cqw;right:2.6cqw;bottom:21.5cqw;background:#ffffffec;border:.6cqw solid var(--line);border-radius:1.6cqw;padding:3.6cqw 3cqw 2cqw;color:#1b1b1b}
.card .tag{position:absolute;top:-2.9cqw;left:2.6cqw;background:var(--tag);color:#fff;border:.5cqw solid var(--line);font:800 3cqw/1.45 var(--f-d);padding:0 2.2cqw;border-radius:1cqw;white-space:nowrap}
.card .skill{margin:0;font-size:3.45cqw;line-height:1.55}
.card .bottom{position:absolute;left:2.6cqw;right:2.6cqw;bottom:2.6cqw;height:16.5cqw;display:flex;gap:2cqw}
.card .power{width:16cqw;flex:none;border:.6cqw solid var(--line);border-radius:1.4cqw;overflow:hidden;background:#fff;text-align:center;display:flex;flex-direction:column}
.card .power .lbl{background:#2c63c9}
.card .power .num{flex:1;display:grid;place-items:center}
.card .namebox{flex:1;min-width:0;border:.6cqw solid var(--line);border-radius:1.4cqw;background:#fffaf0;display:flex;align-items:center;justify-content:center;padding:0 2cqw;font:800 8.2cqw/1.2 var(--f-d);color:var(--line);white-space:nowrap;overflow:hidden}
.card.hero{--edge:linear-gradient(160deg,#e0463a,#b8261f 55%,#8e1a15);--tag:#c8312b}
.card.legend{--edge:linear-gradient(150deg,#ffe48a,#d39a1e 30%,#ffe69a 52%,#b07a0c 76%,#f5cf62);--tag:#b07a0c}
.card.spell{--edge:linear-gradient(160deg,#3d86e8,#2459b8 55%,#183f8a);--tag:#2459b8}
.card.legend::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;mix-blend-mode:color-dodge;opacity:.18;
  background:repeating-linear-gradient(115deg,#ff3d6e 0%,#ffd23d 6%,#3dffa2 12%,#3dc5ff 18%,#b13dff 24%,#ff3d6e 30%);background-size:300% 300%;animation:holo 6s linear infinite}
@keyframes holo{to{background-position:300% 0}}

/* ---------- menu ---------- */
.menu{height:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:20px;
  padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{text-align:center}
.logo .set{font:700 15px var(--f-d);letter-spacing:.04em;color:var(--gold)}
.logo h1{margin:0}
.logoimg{display:block;width:min(460px,86vw);height:auto;margin:0 auto -6px;filter:drop-shadow(0 10px 24px #000a)}
.logo p{margin:0;color:var(--dim)}
.decks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:14px;width:min(920px,100%)}
.deck{display:flex;gap:14px;align-items:center;padding:12px;border-radius:16px;background:var(--mat-2);border:2px solid #ffffff14;cursor:pointer;transition:transform .15s,border-color .15s}
.deck:hover{transform:translateY(-3px)}
.deck:focus-visible{outline:2px solid #fff;outline-offset:2px}
.deck.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 10px 30px #f2b63230}
.deck .card{width:104px;flex:none}
.deck>div:not(.card) b{display:block;color:var(--gold);font:800 15px var(--f-d)}
.deck>div:not(.card)>span{display:block;font:800 18px/1.35 var(--f-d)}
.deck>div:not(.card)>small{display:block;color:var(--dim);font-size:13px;margin-top:4px}
.levels{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.levels > span{color:var(--dim)}
.lv{background:#ffffff10;border:1px solid #ffffff24;border-radius:999px;padding:8px 18px;font:700 15px var(--f-d);cursor:pointer}
.lv.on{background:var(--gold);color:#1a1206;border-color:var(--gold)}
.lv:disabled{opacity:.45;cursor:default}
.btn-main{background:var(--gold);color:#1a1206;border:0;border-radius:999px;padding:13px 40px;font:800 19px var(--f-d);cursor:pointer;box-shadow:0 6px 0 #a8740f}
.btn-main:active{transform:translateY(3px);box-shadow:0 3px 0 #a8740f}
.btn-main:disabled{background:#ffffff20;color:#ffffff70;box-shadow:none;cursor:default}
.btn-main.sm{padding:10px 24px;font-size:16px}
.btn2{background:#ffffff14;border:1px solid #ffffff2a;border-radius:999px;padding:9px 18px;font:700 14px var(--f-d);cursor:pointer}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.links{margin:0;color:var(--dim);font-size:14px;text-align:center}
.links a{color:var(--gold)}
.note{margin:0;color:var(--dim);font-size:12.5px;text-align:center;max-width:52ch}
.stats{color:var(--dim);font-size:13px}

/* ---------- board ---------- */
.board{height:100%;max-width:1120px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto minmax(0,1fr) auto auto;gap:4px;
  padding-block:6px 2px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;gap:10px;justify-content:space-between;min-height:50px}
.who{display:flex;align-items:center;gap:8px;border-radius:999px;padding:3px 14px 3px 3px;background:#0007;border:2px solid #ffffff14;transition:box-shadow .2s}
.who.tgt{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad),0 0 20px var(--bad);cursor:pointer;animation:pulse 1s infinite}
.av{width:42px;height:42px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);flex:none}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.who .nm{font:700 12px var(--f-d);color:var(--dim);line-height:1.2}
.life{display:flex;align-items:center;gap:4px;font:800 22px/1.1 var(--f-d);font-variant-numeric:tabular-nums}
.life svg{width:18px;height:18px}
.manabox{display:flex;flex-direction:column;align-items:center;gap:2px}
.gems{display:flex;gap:3px}
.gem{width:11px;height:11px;border-radius:50%;border:1px solid #ffffff30;transform:rotate(45deg);border-radius:2px}
.gem.full{background:var(--mana);border-color:#c9efff;box-shadow:0 0 6px var(--mana)}
.gem.spent{background:#ffffff22}
.mtxt{font:700 11px var(--f-d);color:var(--dim);font-variant-numeric:tabular-nums}
.meta{display:flex;align-items:center;gap:8px;font:700 12px var(--f-d);color:var(--dim)}
.pile{display:flex;align-items:center;gap:3px}
.pile svg{width:14px;height:14px}
.backs{display:flex;padding-left:6px}
.backs i{width:15px;height:21px;border-radius:3px;margin-left:-6px;background:linear-gradient(135deg,#8a2020,#3a0f0f);border:1px solid var(--gold)}
.loc{background:#ffffff12;border:1px solid #ffffff26;border-radius:999px;padding:3px 10px;font:700 12px var(--f-d);cursor:pointer;white-space:nowrap}
.loc.none{cursor:default;opacity:.5}
.quit{background:none;border:1px solid #ffffff26;border-radius:999px;padding:3px 10px;font:700 12px var(--f-d);cursor:pointer;color:var(--dim)}
.field{display:flex;justify-content:center;align-items:center;gap:clamp(4px,1.2vw,12px);min-height:0;border-radius:16px;position:relative;
  background:radial-gradient(ellipse at 50% 50%,var(--tint,transparent),transparent 70%)}
.field .empty{color:#ffffff2e;font:700 13px var(--f-d)}
.field[data-loc="maenamkhong"]{--tint:#3aa0ff30}
.field[data-loc="khuenduenmuet"]{--tint:#a77bff30}
.field[data-loc="pasatyak"]{--tint:#ff5a3c30}
.field[data-loc="pahimmaphan"]{--tint:#ffcf3a2a}
.mini{--w:clamp(52px,min(17vw,12.5dvh),106px);width:var(--w);aspect-ratio:63/88;position:relative;border-radius:9px;overflow:hidden;flex:none;cursor:pointer;
  border:2px solid #c8312b;background:#222;box-shadow:0 6px 14px #0009;transition:transform .15s,box-shadow .2s}
.mini.lg{border-color:var(--gold)}
.mini img{width:100%;height:100%;object-fit:cover;object-position:50% 6%;display:block}
.mini .pw{position:absolute;left:3px;bottom:3px;width:calc(var(--w)*.34);height:calc(var(--w)*.34);border-radius:50%;background:#fff;color:#111;border:2px solid #111;
  display:grid;place-items:center;font:800 calc(var(--w)*.2)/1 var(--f-d);font-variant-numeric:tabular-nums}
.pw.up{background:#bff3d0;color:#0b4a24}
.pw.down{background:#ffd2cb;color:#7a140a}
.mini .nm{position:absolute;left:0;right:0;bottom:0;padding:calc(var(--w)*.14) 3px 3px calc(var(--w)*.38);background:linear-gradient(transparent,#000d 55%);
  color:#fff;font:700 calc(var(--w)*.115)/1.25 var(--f-d);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .kw{position:absolute;top:3px;left:3px;right:3px;display:flex;gap:2px;flex-wrap:wrap}
.kw span{font:700 calc(var(--w)*.1)/1.35 var(--f-d);background:#000c;color:#fff;border-radius:4px;padding:0 3px}
.kw .it{background:#2459b8}
.kw .dn{background:#7a2fd0}
.mini.sick img,.mini.used img{filter:saturate(.35) brightness(.55)}
.mini .st{position:absolute;top:38%;left:0;right:0;text-align:center;font:800 calc(var(--w)*.13) var(--f-d);color:#fff;text-shadow:0 1px 3px #000}
.mini.can{border-color:var(--good);box-shadow:0 0 0 2px var(--good),0 0 18px var(--good)}
.mini.can:hover{transform:translateY(-4px)}
.mini.sel{transform:translateY(-10px) scale(1.06);border-color:var(--gold);box-shadow:0 0 0 3px var(--gold),0 0 24px var(--gold);z-index:2}
.mini.tgt{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad),0 0 20px var(--bad);animation:pulse 1s infinite}
.mid{display:flex;align-items:center;gap:10px;justify-content:space-between;min-height:42px}
.turn{font:800 13px var(--f-d);padding:5px 12px;border-radius:999px;background:#ffffff10;white-space:nowrap}
.turn.me{background:#f2b63226;color:var(--gold)}
.logline{flex:1;min-width:0;background:none;border:0;font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;cursor:pointer}
.endbtn{background:var(--gold);color:#1a1206;border:0;border-radius:999px;padding:9px 20px;font:800 15px var(--f-d);cursor:pointer;white-space:nowrap;box-shadow:0 4px 0 #a8740f}
.endbtn:disabled{background:#ffffff1a;color:#ffffff60;box-shadow:none;cursor:default}
.endbtn.glow{animation:pulse 1.1s infinite}
.mid.tg{justify-content:center;gap:14px}
.prompt{font:800 15px var(--f-d);color:var(--gold)}
.hand{display:flex;gap:6px;overflow-x:auto;padding:14px 4px 6px;justify-content:safe center;scrollbar-width:none}
.hand::-webkit-scrollbar{display:none}
.hc{flex:none;width:clamp(70px,min(19vw,13dvh),118px);cursor:pointer;transition:transform .15s}
.hc.ok{transform:translateY(-10px)}
.hc.ok .card{box-shadow:0 0 0 2px var(--good),0 0 18px #4fd18b88}
.hc.ok:hover{transform:translateY(-16px)}
.hc.no{filter:brightness(.62)}


/* ---------- board v2: color-coded lanes, ຂວັນ column left, piles and portrait right ---------- */
body{background:
    radial-gradient(ellipse at 50% 115%,#ff6a2a44 0%,transparent 55%),
    radial-gradient(ellipse at 50% 40%,#2b2140 0%,transparent 65%),
    radial-gradient(circle at 1px 1px,#ffffff0b 1px,transparent 0) 0 0/18px 18px,
    var(--mat)}
.table2{height:100%;max-width:1440px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto minmax(0,1fr) auto;gap:6px;
  padding-block:6px 2px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topinfo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:30px}
.tchip{background:#fff;color:#1b1b1b;border:2px solid #1b1b1b;border-radius:999px;padding:2px 12px;font:700 13px var(--f-d)}
.tchip b{color:#c8312b}
.phases{display:flex;gap:4px}
.phases span{font:800 11px var(--f-d);padding:3px 10px;border-radius:6px;background:#ffffff14;color:#ffffff80;transform:skewX(-10deg)}
.phases span.on{background:var(--gold);color:#1a1206}
.ohand{margin-left:auto;display:flex;align-items:center;padding-left:8px}
.ohand .cback{width:22px;margin-left:-9px}
.ohand b{margin-left:8px;font:800 14px var(--f-d)}
.cback{display:block;aspect-ratio:63/88;border-radius:7px;overflow:hidden;box-shadow:0 0 0 2px #1b1b1b,0 4px 10px #0007}
.cback img{display:block;width:100%;height:100%;object-fit:cover}
.half{display:grid;grid-template-columns:84px minmax(0,1fr) 200px;gap:12px;min-height:0}
.mat{background:#efe7d6;border-radius:18px;padding:8px;display:grid;grid-template-rows:38fr 62fr;gap:8px;min-height:0;box-shadow:0 0 0 3px #1b1b1b,0 12px 30px #0009}
.half.me .mat{grid-template-rows:62fr 38fr}
.lane{position:relative;border-radius:12px;min-height:0}
.lane.chars{container-type:size;overflow:hidden;box-shadow:inset 0 0 0 3px #1b1b1b;
  background:repeating-linear-gradient(135deg,#ffffff0d 0 10px,transparent 10px 20px),#c8312b}
.lane.chars .row{position:relative;z-index:1;height:100%;display:flex;gap:min(12px,1.4cqw);align-items:center;justify-content:center;padding:0 54px}
.lane.chars .mini{--w:min(150px,calc((100cqh - 18px) * .716),calc((100cqw - 120px) / max(var(--n,5),3.2) - 12px))}
.wm{position:absolute;inset:0;display:grid;place-items:center;font:800 clamp(16px,6cqw,70px)/1 var(--f-d);color:#ffffff26;letter-spacing:.08em;pointer-events:none;user-select:none;white-space:nowrap}
.maxb{position:absolute;left:8px;bottom:8px;z-index:2;background:#fff;color:#1b1b1b;border:2px solid #1b1b1b;border-radius:7px;font:700 9px/1.2 var(--f-d);padding:2px 6px;text-align:center}
.maxb b{display:block;font:800 18px/1 var(--f-d)}
.half.opp .maxb{top:8px;bottom:auto}
.lane.support{display:grid;grid-template-columns:minmax(0,26%) minmax(0,1fr);gap:8px}
.slot{position:relative;border-radius:12px;box-shadow:inset 0 0 0 3px #1b1b1b;container-type:size;display:grid;place-items:center;overflow:hidden}
.slot.loc{background:repeating-linear-gradient(45deg,#ffffff1a 0 8px,transparent 8px 16px),#e8b23a}
.slot.magic{background:repeating-linear-gradient(45deg,#ffffff12 0 8px,transparent 8px 16px),#2f63c4}
.slot .card{position:relative;z-index:1;width:min(calc((100cqh - 14px) * .716),calc(100cqw - 14px))}
.slot.loc.has,.lm{cursor:pointer}
.lm{position:relative;z-index:1;display:grid;place-items:center}
.lifecol{border-radius:14px;min-height:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 6px;
  background:repeating-linear-gradient(90deg,#b98a4e 0 6px,#a8773e 6px 12px);box-shadow:0 0 0 3px #1b1b1b,inset 0 0 0 3px #e8c48a}
.ltitle{background:#c8312b;color:#fff;border:2px solid #1b1b1b;border-radius:6px;font:800 12px var(--f-d);padding:1px 8px;transform:rotate(-4deg)}
.lnum{display:flex;align-items:center;gap:3px;background:#fff;border:2px solid #1b1b1b;border-radius:10px;padding:2px 7px;font:800 22px/1.1 var(--f-d);color:#1b1b1b;font-variant-numeric:tabular-nums}
.lnum svg{width:16px;height:16px}
.beads{flex:1;min-height:0;width:30px;display:flex;flex-direction:column-reverse;gap:2px}
.beads i{flex:1;min-height:3px;border-radius:4px;background:#00000038;border:1px solid #00000055}
.beads i.on{background:linear-gradient(90deg,#ff8a6a,#e0302a);border-color:#7a140a}
.sidecol{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;min-height:0}
.piles{display:flex;gap:10px;align-items:flex-start}
.pile{position:relative;width:min(70px,8.5dvh);flex:none}
.pile .card{width:100%}
.gravep[data-a]{cursor:pointer}
.gempty{aspect-ratio:63/88;border-radius:8px;border:2px dashed #ffffff30}
.cnt{position:absolute;top:-7px;right:-7px;z-index:2;background:#fff;color:#1b1b1b;border:2px solid #1b1b1b;border-radius:8px;font:800 13px/1 var(--f-d);padding:3px 6px;font-variant-numeric:tabular-nums}
.plbl{display:block;text-align:center;font:700 11px var(--f-d);color:var(--dim);margin-top:4px}
.avwrap{position:relative;display:grid;justify-items:center;gap:4px;padding:4px 8px;border-radius:18px;border:2px solid transparent}
.avwrap.tgt{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad),0 0 24px var(--bad);cursor:pointer;animation:pulse 1s infinite}
.avbig{width:min(86px,10.5dvh);aspect-ratio:1;border-radius:50%;overflow:hidden;border:4px solid #fff;box-shadow:0 0 0 3px #1b1b1b,0 0 26px #f2b63266}
.avbig img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.mana{position:absolute;top:-6px;right:-4px;background:#2459b8;color:#fff;border:3px solid #1b1b1b;border-radius:10px;padding:2px 7px;transform:rotate(6deg);text-align:center;line-height:1}
.mana b{font:800 22px/1 var(--f-d)}
.mana small{font:700 12px var(--f-d)}
.mana span{display:block;font:700 9px/1.3 var(--f-d)}
.avname{position:relative;margin-top:-12px;background:#fff;color:#1b1b1b;border:2px solid #1b1b1b;border-radius:8px;font:800 13px var(--f-d);padding:1px 10px;white-space:nowrap}
.midline{display:flex;align-items:center;gap:12px;min-height:40px}
.midline.tg{justify-content:center}
.hint{display:flex;align-items:center;gap:8px;font:700 13px var(--f-d);color:#fff;min-width:0}
.hint .ic{flex:none;width:30px;height:30px;border-radius:8px;background:#fff;border:2px solid #1b1b1b;display:grid;place-items:center}
.hint .ic svg{width:20px;height:20px}
.hint b{color:var(--gold)}
.hint span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.midline .logline{flex:1}
.handrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:end;gap:10px}
.hidebtn{background:#fff;color:#1b1b1b;border:2px solid #1b1b1b;border-radius:8px;font:700 12px var(--f-d);padding:4px 10px;cursor:pointer;margin-bottom:8px}
.handrow .hand{padding:16px 4px 4px}
.handrow .hand.hidden{visibility:hidden;height:0;padding:0}
.handrow .hc{width:clamp(70px,min(14vw,15.5dvh),134px)}
.handrow .hc + .hc{margin-left:-12px}
.endbig{display:flex;align-items:center;gap:8px;background:var(--gold);color:#1a1206;border:3px solid #1b1b1b;border-radius:14px;padding:10px 22px;font:800 18px var(--f-d);cursor:pointer;box-shadow:0 5px 0 #1b1b1b;margin-bottom:8px;white-space:nowrap}
.endbig svg{width:20px;height:20px}
.endbig:active{transform:translateY(3px);box-shadow:0 2px 0 #1b1b1b}
.endbig:disabled{background:#3a3344;color:#ffffff70;box-shadow:none;cursor:default}
.endbig.glow{animation:pulse 1.1s infinite}
.mbar{display:none}
@media (max-width:760px){
  .half{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:4px}
  .half.me{grid-template-rows:minmax(0,1fr) auto}
  .half.me .mbar{order:2}
  .half.opp .mbar{order:-1}
  .lifecol,.sidecol{display:none}
  .mbar{display:flex}
  .phases{display:none}
  .hint .long{display:none}
  .lane.chars .row{padding:0 8px}
  .lane.chars .mini{--w:min(130px,calc((100cqh - 14px) * .716),calc((100cqw - 20px) / max(var(--n,5),2.4) - 6px))}
  .maxb{display:none}
  .endbig{padding:8px 14px;font-size:15px}
  .handrow .hc{width:clamp(60px,19vw,96px)}
}

/* ---------- phase 3 effects ---------- */
.pt{position:absolute;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);animation:pt .7s ease-out forwards}
@keyframes pt{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0}}
.pt.up{width:9px;height:9px;opacity:0;animation:ptup 1.2s ease-out forwards}
@keyframes ptup{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-110px) scale(1.2)}}
.runes{position:absolute;width:160px;height:160px;transform:translate(-50%,-50%);animation:runes .9s ease-out forwards}
.runes svg{width:100%;height:100%;animation:spin 1.2s linear infinite}
@keyframes runes{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
.tornado{position:absolute;width:120px;height:170px;transform:translate(-50%,-60%);animation:fadeio .9s forwards}
.tornado i{position:absolute;left:50%;border:4px solid #e6f6ff;border-radius:50%;transform:translateX(-50%);box-shadow:0 0 12px #bfe9ff;animation:tw .3s linear infinite}
@keyframes tw{50%{transform:translateX(-35%) scaleX(.85)}}
.rope{position:absolute;height:6px;width:150px;transform:translate(-50%,-50%);border-radius:3px;background:repeating-linear-gradient(90deg,#c08a4a 0 6px,#7a4f1c 6px 12px);box-shadow:0 2px 0 #1b1b1b;animation:rope .9s ease-out forwards}
@keyframes rope{0%{width:0}30%{width:150px}80%{opacity:1}100%{width:150px;opacity:0}}
.stars{position:absolute;transform:translate(-50%,-50%);font:800 24px var(--f-d);color:#ffd23d;text-shadow:0 0 8px #000;white-space:nowrap;animation:spinfade .95s ease-out forwards}
@keyframes spinfade{0%{opacity:0;transform:translate(-50%,-50%) rotate(0)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-110%) rotate(360deg)}}
.fly{position:absolute;width:12px;height:12px;border-radius:50%;background:#8dff9e;box-shadow:0 0 14px #8dff9e;transform:translate(-50%,-50%)}
.claw{position:absolute;height:8px;border-radius:4px;background:linear-gradient(90deg,transparent,#ff5a3c,#fff,transparent);box-shadow:0 0 14px #ff5a3c;transform:translate(-50%,-50%) rotate(55deg);animation:slash .45s ease-out forwards}
.locban{position:absolute;transform:translate(-50%,-50%);font:800 clamp(20px,4vw,34px) var(--f-d);color:#fff;text-shadow:0 3px 0 #000,0 0 18px #000;white-space:nowrap;animation:showc 1.05s ease-out forwards}
.vign{position:absolute;inset:0;box-shadow:inset 0 0 140px 40px #ff2a2aaa;animation:fadeio .6s forwards}
#app.bigshake{animation:shake .45s}
.conf{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:conf linear forwards}
@keyframes conf{to{transform:translateY(112vh) rotate(720deg)}}
.flycard{position:absolute;width:62px;transform:translate(-50%,-50%)}
.say{position:absolute;max-width:230px;background:#fff;color:#1b1b1b;border:3px solid #1b1b1b;border-radius:16px;padding:8px 13px;font:800 15px/1.45 var(--f-d);box-shadow:0 5px 0 #1b1b1b;animation:say 2.3s ease-out forwards}
.say.l{transform:translate(calc(-100% - 58px),-50%)}
.say.r{transform:translate(50px,-50%)}
@keyframes say{0%{opacity:0}10%{opacity:1}85%{opacity:1}100%{opacity:0}}
.setlist{display:flex;flex-direction:column;gap:8px;width:100%}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#ffffff10;border:1px solid #ffffff22;border-radius:12px;padding:12px 16px;font:700 15px var(--f-d);cursor:pointer}
.setrow b{background:#ffffff1a;border-radius:999px;padding:3px 12px;white-space:nowrap}
.setrow b.on{background:var(--gold);color:#1a1206}
.menu .btn2{margin-top:-6px}

/* ---------- skill keywords ---------- */
.kw-kt,.kw-kk,.kw-tr{display:inline-block;color:#fff;font-weight:800;border-radius:.9cqw;padding:0 1.1cqw;margin:0 .3cqw;line-height:1.45;
  border:.35cqw solid #1b1b1b;-webkit-text-stroke:0;text-shadow:none;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.kw-kt{background:#1f9d6b}
.kw-kk{background:#d0342c}
.kw-tr{background:#6b3fb0}
.kw-kn{font-weight:800}
.kw-up{color:#0b7a3b;font-weight:800}
.kw-dn{color:#c0261c;font-weight:800}
.kw-hp{color:#d02c69;font-weight:800}
.kw-dr{color:#1d5fc4;font-weight:800}
.kw-dm{color:#c25200;font-weight:800}

/* ---------- alt art (ອາດພິເສດ): borderless, holo, text right on the picture ---------- */
.card.alt{background:#fbf8f1}
.card.alt .face{top:2cqw;left:2cqw;right:2cqw;bottom:2cqw;border-radius:3.4cqw;box-shadow:none}
.card.alt .panel{background:none;border:0;bottom:23cqw;padding:3.4cqw 1cqw 0}
.card.alt .skill{color:#111;font-weight:700;font-size:3.7cqw;line-height:1.6;-webkit-text-stroke:.9cqw #fff;paint-order:stroke fill;text-shadow:0 0 1.4cqw #fffc}
.card.alt .namebox{background:linear-gradient(90deg,#fff7e2e6,#fff7e273 75%,#fff7e200);border:0;justify-content:flex-start;padding-left:3cqw;text-shadow:0 0 .6cqw #fff,0 0 .6cqw #fff}
.card.alt .bottom{bottom:5.2cqw}
.card.alt::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;mix-blend-mode:color-dodge;opacity:.24;
  background:radial-gradient(circle at 20% 30%,#fff 0 .6px,transparent 1.2px) 0 0/10px 10px,repeating-linear-gradient(115deg,#ff3d6e 0%,#ffd23d 6%,#3dffa2 12%,#3dc5ff 18%,#b13dff 24%,#ff3d6e 30%);
  background-size:10px 10px,300% 300%;animation:holo 5s linear infinite}
.altbadge{position:absolute;z-index:2;top:21cqw;left:2.6cqw;background:linear-gradient(135deg,#fff3b0,#e5a823);color:#3a2402;border:.5cqw solid var(--line);border-radius:1cqw;font:800 2.6cqw/1.5 var(--f-d);padding:0 1.6cqw}
.mini.altm{border-color:#fff8dc;box-shadow:0 0 0 2px #e5a823,0 0 18px #ffd23d99,0 6px 14px #0009}
.mini.altm::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:.28;
  background:repeating-linear-gradient(115deg,#ff3d6e 0%,#ffd23d 6%,#3dffa2 12%,#3dc5ff 18%,#b13dff 24%,#ff3d6e 30%);background-size:300% 300%;animation:holo 5s linear infinite}
.mini.altm.can{box-shadow:0 0 0 2px var(--good),0 0 18px var(--good)}
.toast.alt{background:linear-gradient(135deg,#fff3b0,#e5a823);color:#3a2402;border-color:#1b1b1b;font-size:16px}

/* ---------- field shows the whole card, not a thumbnail ---------- */
.mini{border:0!important;background:none;overflow:visible;border-radius:4.4%/3.2%}
.mini > .card{width:100%;box-shadow:0 6px 14px #0009}
.mini .kw{z-index:4;top:calc(var(--w) * .25)}
.mini .st{z-index:4;top:30%}
.mini.altm::after{display:none}
.mini .card .num.up{color:#0b7a3b}
.mini .card .num.down{color:#c0261c}
.mini .card .power .num.up{background:#c9f5d8}
.mini .card .power .num.down{background:#ffd6cf}

/* ---------- phase 4: card book, stats, tutorial ---------- */
.mrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:-6px}
.btn2.hl{background:var(--gold);color:#1a1206;border-color:var(--gold);animation:pulse 1.2s infinite}
.book{height:100%;overflow-y:auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bookhead{max-width:1100px;margin:0 auto 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bookhead h2{margin:0;font:800 24px var(--f-d);flex:1}
.bookhead .cnt2{color:var(--dim);font:700 14px var(--f-d)}
.tabs{max-width:1100px;margin:0 auto 16px;display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:#ffffff10;border:1px solid #ffffff24;border-radius:999px;padding:7px 14px;font:700 14px var(--f-d);cursor:pointer}
.tabs button.on{background:var(--gold);color:#1a1206;border-color:var(--gold)}
.bgrid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,42vw),1fr));gap:14px}
.bcell{cursor:pointer;transition:transform .15s}
.bcell:hover{transform:translateY(-4px)}
.bcell small{display:block;text-align:center;color:var(--dim);font:700 12px var(--f-d);margin-top:4px}
.locked{aspect-ratio:63/88;border-radius:4.4%/3.2%;border:2px dashed #ffffff30;display:grid;place-items:center;text-align:center;color:#ffffff60;font:800 14px/1.5 var(--f-d);padding:10px;
  background:repeating-linear-gradient(45deg,#ffffff06 0 10px,transparent 10px 20px)}
.locked b{display:block;font-size:42px;color:#ffffff40}
.stattbl{width:100%;border-collapse:collapse;font:700 15px var(--f-d)}
.stattbl th,.stattbl td{padding:8px 10px;border-bottom:1px solid #ffffff18;text-align:left}
.stattbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.stattbl th{color:var(--dim);font-size:13px}
.tut{position:fixed;z-index:45;left:50%;top:calc(58px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(560px,calc(100% - 32px));
  display:flex;gap:12px;align-items:flex-start;background:#fffdf6;color:#1b1b1b;border:3px solid #1b1b1b;border-radius:18px;padding:12px 14px;box-shadow:0 6px 0 #1b1b1b,0 20px 40px #000a}
.tut .face2{flex:none;width:58px;height:58px;border-radius:50%;overflow:hidden;border:3px solid var(--gold);box-shadow:0 0 0 2px #1b1b1b}
.tut .face2 img{width:100%;height:100%;object-fit:cover;object-position:50% 10%}
.tut .tx{flex:1;min-width:0}
.tut b.who2{display:block;font:800 13px var(--f-d);color:#2f6b1e}
.tut p{margin:2px 0 8px;font:700 15px/1.6 var(--f-d)}
.tut .tb{display:flex;gap:8px;justify-content:flex-end}
.tut .tb button{border:2px solid #1b1b1b;border-radius:999px;padding:5px 14px;font:800 14px var(--f-d);cursor:pointer;background:var(--gold);color:#1a1206}
.tut .tb button.sk{background:#fff}
.tut .step{font:700 11px var(--f-d);color:#8a7a60}
.tutpulse{animation:tutp 1s infinite;border-radius:14px}
@keyframes tutp{50%{box-shadow:0 0 0 4px #ffd23d,0 0 26px #ffd23d}}

/* ---------- big effects: particle canvas, shatter, legend cut-in ---------- */
#fxc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
.shard{position:fixed;pointer-events:none;z-index:65;will-change:transform,opacity}
.shard .card{width:100%}
.float{font-size:44px;-webkit-text-stroke:2px #000;paint-order:stroke fill}
.float.crit{font-size:64px;color:#ffd23d}
.cutin2{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:10px;overflow:hidden;perspective:900px;
  background:radial-gradient(circle at 50% 45%,#2a1640e6,#000f 70%);animation:fadeio 2s forwards}
.cutin2 .lgcard{position:relative;width:min(300px,58vw);animation:lgin .65s cubic-bezier(.2,1.2,.3,1) both}
@keyframes lgin{from{transform:translateY(55vh) rotateY(540deg) scale(.25);filter:brightness(3)}60%{filter:brightness(2)}to{transform:none;filter:none}}
.cutin2 .lgcard::after{content:"";position:absolute;inset:0;border-radius:4.4%/3.2%;pointer-events:none;mix-blend-mode:overlay;
  background:linear-gradient(110deg,transparent 35%,#ffffffdd 50%,transparent 65%);background-size:250% 100%;animation:sweep 1s .65s ease-out both}
@keyframes sweep{from{background-position:150% 0}to{background-position:-60% 0}}
.cutin2 .cutname{position:relative;font:800 clamp(30px,7vw,56px) var(--f-d);color:var(--gold);text-shadow:0 4px 0 #000,0 0 24px #f2b632;animation:namein .5s .55s cubic-bezier(.2,1.3,.4,1) both}
.cutin2 .cutsub{position:relative;font:800 15px var(--f-d);letter-spacing:.2em;color:#fff;animation:namein .5s .7s both}
@keyframes namein{from{transform:translateX(-60vw) skewX(-20deg);opacity:0}to{transform:none;opacity:1}}
.altban{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font:800 clamp(20px,4vw,30px) var(--f-d);color:#3a2402;padding:4px 18px;border-radius:999px;border:3px solid #1b1b1b;
  background:linear-gradient(90deg,#ff9ad5,#ffe27a,#9dffcf,#8fd0ff,#d7a6ff);box-shadow:0 5px 0 #1b1b1b;animation:showc 1.2s ease-out forwards}

/* ---------- v3 effects: comic impact, knockback, card break, location field ---------- */
.pow{position:absolute;width:170px;height:170px;transform:translate(-50%,-50%) scale(0);pointer-events:none;animation:pow .7s cubic-bezier(.2,1.5,.4,1) forwards}
.pow svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pow b{position:absolute;inset:0;display:grid;place-items:center;font:800 34px var(--f-d);color:#e0302a;-webkit-text-stroke:5px #fff;paint-order:stroke fill;transform:rotate(-8deg);text-shadow:0 3px 0 #1b1b1b}
.pow.big{width:230px;height:230px}
.pow.big b{font-size:46px}
@keyframes pow{0%{transform:translate(-50%,-50%) scale(0) rotate(-25deg)}30%{transform:translate(-50%,-50%) scale(1.12) rotate(0)}72%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.06)}}
.lines{position:absolute;width:300px;height:300px;transform:translate(-50%,-50%);pointer-events:none;animation:lines .5s ease-out forwards}
@keyframes lines{from{opacity:1;transform:translate(-50%,-50%) scale(.6)}to{opacity:0;transform:translate(-50%,-50%) scale(1.25)}}
.float.hit{color:#ffd23d;-webkit-text-stroke:5px #1b1b1b}
.half-break{position:fixed;pointer-events:none;z-index:65;filter:grayscale(.8) brightness(.9)}
.half-break .card{width:100%}
.crack{position:fixed;pointer-events:none;z-index:66;animation:fadeio .35s forwards}
.mat.hasloc{background:linear-gradient(#0000004d,#0000004d),var(--locimg) center/cover,#efe7d6}
.mat.hasloc .lane.chars{background:repeating-linear-gradient(135deg,#ffffff10 0 10px,transparent 10px 20px),#c8312b8c}
.mat.hasloc .slot.loc{background:#e8b23aa6}
.mat.hasloc .slot.magic{background:#2f63c4a6}
.mat.hasloc .wm{color:#ffffff3a}
.locwipe{position:fixed;pointer-events:none;z-index:64;border-radius:18px;background-size:cover;background-position:center}

/* ---------- v4 effects (duel-game style): summon showcase, card activation, dash with afterimages, light flare ---------- */
.show{position:absolute;inset:0;overflow:hidden;background:#000;animation:showin var(--dur) forwards}
.show .sbg{position:absolute;inset:-6%;background-size:cover;background-position:50% 22%;animation:kb var(--dur) cubic-bezier(.2,.7,.3,1) forwards}
@keyframes kb{0%{transform:scale(1.4) translateY(5%);filter:brightness(2.4) saturate(1.5)}14%{filter:brightness(1.15) saturate(1.2)}100%{transform:scale(1.06);filter:brightness(1) saturate(1.1)}}
.show .stint{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,transparent 30%,#000d 100%),linear-gradient(0deg,var(--tc) 0%,transparent 45%);opacity:.8}
.show .streaks{position:absolute;inset:-60%;background:repeating-linear-gradient(115deg,transparent 0 46px,#ffffff2e 46px 50px,transparent 50px 140px);mix-blend-mode:screen;animation:streak .55s linear infinite}
@keyframes streak{to{transform:translate(-140px,66px)}}
.show .sband{position:absolute;left:0;right:0;bottom:11%;padding:12px 16px;text-align:center;background:linear-gradient(90deg,transparent,#000000dd 18%,#000000dd 82%,transparent);
  border-top:2px solid #f2b632b0;border-bottom:2px solid #f2b632b0;animation:bandin .45s .3s cubic-bezier(.2,1,.3,1) both}
.show .sband small{display:block;font:700 14px var(--f-d);letter-spacing:.14em;color:var(--gold)}
.show .sband b{display:block;font:800 clamp(30px,7vw,62px)/1.25 var(--f-d);color:#fff;text-shadow:0 0 20px var(--tc),0 3px 0 #000}
.show .sband span{display:inline-block;margin-top:4px;padding:2px 20px;border-radius:4px;background:#ffffff1f;border:1px solid #ffffff33;font:800 17px var(--f-d);color:#fff;font-variant-numeric:tabular-nums}
.show.alt .stint{background:radial-gradient(ellipse at 50% 38%,transparent 30%,#000d 100%),linear-gradient(0deg,#ff9ad5aa,#8fd0ff55 30%,transparent 50%)}
@keyframes bandin{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
@keyframes showin{0%{opacity:0}5%{opacity:1}86%{opacity:1}100%{opacity:0}}
.activate{position:absolute;left:50%;top:44%;width:min(250px,52vw);transform:translate(-50%,-50%)}
.activate .glow{position:absolute;inset:-26%;border-radius:50%;background:conic-gradient(from 0deg,#f2b63200,#ffd23d,#fff6c8,#f2b63200 40%,#ffd23d 70%,#f2b63200);filter:blur(14px);opacity:.85;animation:spin 1.4s linear infinite}
.activate .card{position:relative;box-shadow:0 0 0 3px #ffd23d,0 0 30px #ffd23d,0 0 70px #f2b63299;animation:actin .35s cubic-bezier(.2,1.4,.4,1) both}
@keyframes actin{from{transform:scale(.4) rotateY(70deg);opacity:0}to{transform:none;opacity:1}}
.activate .acttag{position:absolute;left:50%;bottom:-38px;transform:translateX(-50%);white-space:nowrap;font:800 16px var(--f-d);color:#1a1206;background:var(--gold);border:2px solid #1b1b1b;border-radius:999px;padding:2px 14px}
.ghost{position:fixed;pointer-events:none;filter:brightness(1.7) saturate(1.3) blur(1.5px)}
.ghost .card{width:100%}
.flare{position:absolute;width:380px;height:380px;transform:translate(-50%,-50%);pointer-events:none;mix-blend-mode:screen;animation:flare .5s ease-out forwards;
  background:radial-gradient(circle,#fff 0 7%,color-mix(in srgb,var(--tc) 65%,#fff) 15%,transparent 44%)}
.flare i{position:absolute;left:0;right:0;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:linear-gradient(90deg,transparent,#fff 44%,#fff 56%,transparent);box-shadow:0 0 20px var(--tc)}
.flare i+i{transform:rotate(90deg)}
.flare.big{width:540px;height:540px}
@keyframes flare{0%{transform:translate(-50%,-50%) scale(.2) rotate(-18deg);opacity:1}40%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.15) rotate(0);opacity:0}}

/* ---------- duel board v3: card info panel left, engraved stone field, plates and a turn badge ---------- */
.duel{height:100%;display:grid;grid-template-columns:minmax(0,270px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:14px;
  padding-block:8px 6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at 50% 40%,#3a2a1c 0%,#1d140d 60%,#0f0a07 100%)}
.dpanel{min-height:0;align-self:center;max-height:calc(100% - 8px);overflow:auto;background:#0d0b14ee;border:2px solid #d9b25a88;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px #000a}
.dpanel .dname{display:flex;align-items:center;gap:8px;font:800 18px/1.3 var(--f-d);color:#fff;border-bottom:1px solid #ffffff22;padding-bottom:8px}
.dpanel .dname svg{width:26px;height:26px;flex:none;background:#fff;border-radius:6px;padding:2px}

.dpanel .dstats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.dpanel .dstats span{background:#ffffff14;border:1px solid #ffffff26;border-radius:999px;padding:2px 12px;font:700 13px var(--f-d)}

  .ebanner{display:none}

  .obacks .cback{width:22px;margin-left:-9px}
}

.tprompt2 b{font:800 15px var(--f-d);color:#f2d48a}
@media (max-width:760px){
  .arena{gap:4px}
  .band{gap:8px}
  .band.top{grid-template-columns:minmax(0,1fr);grid-template-areas:"ofan" "plate";gap:10px}
  .band.top .ofan{grid-area:ofan}.band.top .lplate{grid-area:plate;justify-self:start}
  .band.bot{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"plate btns" "fan fan"}
  .band.bot .lplate{grid-area:plate;justify-self:start}.band.bot .btns2{grid-area:btns}.band.bot .fan{grid-area:fan}
  .piles2{display:none}
  .lplate{padding:3px 12px 3px 3px;gap:7px}
  .lplate .lav{width:38px;height:38px}
  .lplate .llife{font-size:20px}.lplate .llife svg{width:15px;height:15px}
  .lplate .lnm{font-size:10px}
  .field2{padding:8px;grid-template-rows:minmax(0,1fr) 36px minmax(0,1fr)}
  .half2{gap:6px}
  .arena .lane.chars .row{padding:0 4px;gap:4px}
  .arena .lane.chars .mini{--w:min(150px,calc((100cqh - 26px) * .716),calc((100cqw - 20px) / 5.15))}
  .medal{width:64px;height:64px;right:-4px}.medal span{font-size:9px}.medal b{font-size:14px}
  .mid2 .logb{display:none}
  .gbtn{width:36px;height:36px}.gbtn svg{width:17px;height:17px}
  .fan{--cw:clamp(56px,19vw,110px)}
  .ofan{--ow:clamp(44px,14vw,84px)}
}

.arena[data-theme]{background:var(--a-bg)}
.arena[data-theme] .field2{background:var(--cTL) no-repeat 6px 6px/46px,var(--cTR) no-repeat right 6px top 6px/46px,var(--cBL) no-repeat left 6px bottom 6px/46px,var(--cBR) no-repeat right 6px bottom 6px/46px,var(--f-bg);
  box-shadow:0 0 0 2px var(--ring),0 0 0 6px var(--gap),0 0 0 7px var(--ring2),0 22px 50px #0009}
.arena[data-theme] .lane.chars{background:var(--lane-bg);border-color:var(--lane-line)}
.arena[data-theme] .lane.chars.hasloc{background:linear-gradient(#0000004d,#0000004d),var(--locimg) center/cover;border-color:var(--ring)}
.arena[data-theme] .lane.chars .wm{color:var(--wm)}
.arena[data-theme] .slot{border-color:var(--slot-line);background:var(--slot-bg)}
.arena[data-theme] .slot::after{color:var(--slot-ink)}
.arena[data-theme] .lplate{background:var(--plate-bg);box-shadow:inset 0 0 0 1.5px var(--ring),0 6px 16px #0007}
.arena[data-theme] .lplate .lav{box-shadow:0 0 0 3px var(--ring)}
.arena[data-theme] .lplate .lnm{color:var(--soft)}
.arena[data-theme] .lplate .llife{color:var(--plate-ink)}
.arena[data-theme] .mid2::before{background:linear-gradient(90deg,#0000,var(--ring) 20%,var(--ring) 80%,#0000)}
.arena[data-theme] .mid2 .tchip2{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.arena[data-theme] .mid2 .tchip2.bot{background:var(--plate-bg);color:var(--soft);box-shadow:inset 0 0 0 1.5px var(--ring)}
.arena[data-theme] .mid2 .logb{background:var(--log-bg);border-color:var(--ring);color:var(--log-ink)}
.arena[data-theme] .medal{background:var(--medal)}
.arena[data-theme] .medal span{color:var(--mk1)}
.arena[data-theme] .medal b{color:var(--mk2)}
.arena[data-theme] .medal.go{background:var(--medal-go)}
.arena[data-theme] .medal.go span{color:var(--gk1)}
.arena[data-theme] .medal.go b{color:var(--gk2)}
.arena[data-theme] .gbtn{background:var(--btn-bg);box-shadow:inset 0 0 0 1.5px var(--ring),0 4px 10px #0006}
.arena[data-theme] .ofan .ocnt{background:var(--log-bg);color:var(--log-ink);border-color:var(--ring)}
.arena[data-theme] .pile2 small{color:var(--soft)}
.arena[data-theme="sinh"] .pile2 small{color:#2c3e8f}
.arena[data-theme] .tprompt2{background:var(--log-bg);border-color:var(--ring)}
.arena[data-theme] .tprompt2 b{color:var(--log-ink)}
.themes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.thb{display:flex;flex-direction:column;align-items:center;gap:6px;background:#ffffff0d;border:2px solid #ffffff22;border-radius:14px;padding:8px 10px;cursor:pointer;font:700 13px var(--f-d);color:var(--ink)}
.thb.on{border-color:var(--gold);background:#f2b6321f}
.thb i{display:block;width:96px;height:58px;border-radius:9px;box-shadow:inset 0 0 0 2px #0004}
.thb[data-v="mekong"] i{background:radial-gradient(circle at 70% 40%,#7fe0ff 0 8px,#0000 9px),linear-gradient(160deg,#0f5a73,#03141f)}
.thb[data-v="sinh"] i{background:repeating-linear-gradient(0deg,#f6ead2 0 10px,#b8261f 10px 13px,#f6ead2 13px 16px,#2c3e8f 16px 19px)}
.thb[data-v="himma"] i{background:radial-gradient(circle at 70% 40%,#ffe48a 0 8px,#0000 9px),linear-gradient(160deg,#356a37,#0b1d0e)}
.themelbl{color:var(--dim);font:700 14px var(--f-d)}

/* ---------- clean backgrounds (no patterns) and the card detail panel on the left ---------- */
.arena[data-theme="sinh"]{--a-bg:linear-gradient(180deg,#f8f1e3,#ece0c8);--f-bg:radial-gradient(ellipse at 50% 45%,#fffdf8,#f4e9d3 85%);
  --p-bg:#fffdf7;--p-head:linear-gradient(90deg,#34489c,#1d2b6b);--p-ink:#2b2014;--p-soft:#7a6a55;--p-type:#b8261f;--chip-bg:#f3e7cf}
.arena[data-theme="mekong"]{--a-bg:radial-gradient(ellipse at 50% 40%,#0d4a66,#062636 60%,#02101a);--f-bg:radial-gradient(ellipse at 50% 50%,#0f5a73,#06283a 80%);
  --p-bg:#072a3a;--p-head:linear-gradient(90deg,#1a7a99,#0b3e52);--p-ink:#e6f8ff;--p-soft:#9fcfe0;--p-type:#0f5168;--chip-bg:#0d3d52}
.arena[data-theme="himma"]{--a-bg:radial-gradient(ellipse at 50% 40%,#25542a,#123018 60%,#071409);--f-bg:radial-gradient(ellipse at 50% 50%,#356a37,#163a1d 80%);
  --p-bg:#10260f;--p-head:linear-gradient(90deg,#7a4e28,#3e2512);--p-ink:#f1f7e6;--p-soft:#b9d0a8;--p-type:#2f6b1e;--chip-bg:#1f3d1a}
.arena{grid-template-columns:minmax(0,300px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:14px}
.amain{min-height:0;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:6px}
.spanel{min-height:0;align-self:stretch;display:flex;flex-direction:column;gap:12px;overflow:auto;padding-bottom:16px;border-radius:16px;
  background:var(--p-bg);box-shadow:0 0 0 2px var(--ring),0 0 0 5px var(--gap),0 0 0 6px var(--ring2),0 12px 28px #0003}

.tb2{position:absolute;left:0;right:0;top:46%;height:130px;transform:translateY(-50%);pointer-events:none}
.tb2 .tbb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transform:skewY(-4deg);
  background:linear-gradient(90deg,#0000,var(--c1) 14%,var(--c2) 50%,var(--c1) 86%,#0000);box-shadow:0 0 50px var(--c1);
  border-top:3px solid #f2d48a;border-bottom:3px solid #f2d48a;animation:tbin var(--d) cubic-bezier(.2,.8,.2,1) forwards;overflow:hidden}
.tb2 .tbb::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,#0000 40%,#ffffffb0 50%,#0000 60%);background-size:260% 100%;animation:sweep .9s .2s both;mix-blend-mode:overlay}

@keyframes tbin{0%{transform:skewY(-4deg) translateX(-105%)}20%{transform:skewY(-4deg) translateX(0)}78%{transform:skewY(-4deg) translateX(0);opacity:1}100%{transform:skewY(-4deg) translateX(105%);opacity:0}}

/* ---------- v6: right rail for plates, turn and tools; field, hand and the bot's backs never overlap ---------- */
.arena.v6{grid-template-columns:minmax(0,280px) minmax(0,1fr) 212px;grid-template-rows:minmax(0,1fr);gap:12px;padding-block:8px}
.arena.v6 .amain{grid-template-rows:auto minmax(0,1fr) auto;gap:8px}

/* ---------- sound: everything is synthesized, no audio files ---------- */
const SND = {ctx:null, sfx:null, mus:null, timer:null};
function audioInit(){
  if(SND.ctx){ if(SND.ctx.state === 'suspended') SND.ctx.resume(); return; }
  try{
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    SND.ctx = new AC(); const m = SND.ctx.createGain(); m.gain.value = .55; m.connect(SND.ctx.destination);
    SND.sfx = SND.ctx.createGain(); SND.sfx.connect(m);
    SND.mus = SND.ctx.createGain(); SND.mus.gain.value = .2; SND.mus.connect(m);
  }catch(e){ SND.ctx = null; }
}
function tone(f, dur, type, vol, dest, t0, slide){
  const c = SND.ctx, t = t0 || c.currentTime, o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if(slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol || .3, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(dest || SND.sfx); o.start(t); o.stop(t + dur + .05);
}
function noise(dur, vol, freq, t0, type){
  const c = SND.ctx, t = t0 || c.currentTime, n = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = Math.random() * 2 - 1;
  const src = c.createBufferSource(); src.buffer = b; const f = c.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.value = freq || 2000;
  const g = c.createGain(); g.gain.setValueAtTime(vol || .3, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(SND.sfx); src.start(t);
}
function sfx(name){
  if(!SND.ctx || !SET.sfx || (S && (S.fast || S.sim))) return;
  const t = SND.ctx.currentTime;
  try{
    switch(name){
      case 'draw': noise(.18, .14, 3500, t, 'highpass'); break;
      case 'play': tone(140, .25, 'sine', .5, null, t, 70); tone(420, .12, 'triangle', .14, null, t); break;
      case 'attack': noise(.22, .24, 1500, t, 'bandpass'); break;
      case 'hit': tone(90, .2, 'square', .22, null, t, 50); noise(.12, .3, 800, t); break;
      case 'destroy': noise(.45, .34, 1200, t); tone(300, .4, 'sawtooth', .1, null, t, 60); break;
      case 'heal': [523, 659, 784, 1047].forEach((f, i) => tone(f, .25, 'sine', .16, null, t + i * .07)); break;
      case 'spell': [880, 1175, 1568].forEach((f, i) => tone(f, .4, 'sine', .11, null, t + i * .05)); noise(.4, .07, 6000, t, 'highpass'); break;
      case 'rocket': noise(.6, .24, 900, t, 'bandpass'); tone(200, .6, 'sawtooth', .07, null, t, 900); break;
      case 'boom': noise(.6, .5, 600, t); tone(60, .5, 'sine', .5, null, t, 30); break;
      case 'legend': [65, 130, 196].forEach(f => tone(f, 2.2, 'sine', .28, null, t)); tone(392, 1.5, 'triangle', .08, null, t + .1); break;
      case 'turn': tone(330, .5, 'sine', .16, null, t); tone(495, .5, 'sine', .09, null, t + .08); break;
      case 'win': [523, 587, 659, 784, 880, 1047].forEach((f, i) => tone(f, .35, 'triangle', .22, null, t + i * .12)); break;
      case 'lose': [440, 392, 330, 262].forEach((f, i) => tone(f, .45, 'triangle', .2, null, t + i * .18)); break;
      case 'trip': tone(600, .3, 'square', .09, null, t, 150); noise(.2, .2, 1000, t + .2); break;
      case 'wind': noise(.9, .24, 700, t, 'bandpass'); break;
      case 'curse': tone(110, .8, 'sawtooth', .11, null, t, 80); tone(116, .8, 'sawtooth', .09, null, t, 85); break;
    }
  }catch(e){}
}
// a slow loop in a Lao-style pentatonic scale: low khaen-like drone plus a plucked phin melody
const MEL = [0,2,3,2,0,4,3,2, 1,2,3,5,4,3,2,0], SCALE = [220,262,294,330,392,440,523,587,659,784];
function musicStart(){
  if(!SND.ctx || !SET.music || SND.timer) return;
  let step = 0, next = SND.ctx.currentTime + .1; const beat = .34;
  SND.timer = setInterval(() => {
    const c = SND.ctx; if(!c) return;
    while(next < c.currentTime + .4){
      if(step % 8 === 0){ tone(110, beat * 8, 'triangle', .16, SND.mus, next); tone(165, beat * 8, 'triangle', .09, SND.mus, next); }
      const n = MEL[step % 16];
      if(step % 4 !== 3) tone(SCALE[n + 2], beat * .9, 'triangle', .24, SND.mus, next);
      if(step % 2 === 0) tone(SCALE[n] * 2, .08, 'sine', .05, SND.mus, next + beat / 2);
      next += beat; step++;
    }
  }, 100);
}
function musicStop(){ clearInterval(SND.timer); SND.timer = null; }
function saveSet(){ try{ localStorage.setItem('lao-legend-settings', JSON.stringify(SET)); }catch(e){} }
function toggleSetting(k){
  if(k === 'speed') SET.speed = SET.speed === 1 ? .55 : 1; else SET[k] = !SET[k];
  saveSet(); audioInit(); if(SET.music) musicStart(); else musicStop();
}

  return '<div class="modal-bg"><div class="modal"><p class="q">ຕັ້ງຄ່າ</p><div class="setlist">' +
    row('sfx', 'ສຽງເອັບເຟັກ', SET.sfx, SET.sfx ? 'ເປີດ' : 'ປິດ') + row('music', 'ດົນຕີ', SET.music, SET.music ? 'ເປີດ' : 'ປິດ') +

    '</div><div class="mbtns"><button class="btn2" data-a="setclose">ປິດ</button></div></div></div>';
}

function drawRaw(p){

function costOf(p, id){
  const d = C[id]; let c = d.cost;
  if(d.tribe === 'giant' && p.loc === 'pasatyak') c = Math.max(1, c - 1);
  if(d.type === 'spell' && oppLoc(p) === 'khonephapheng') c += 1;
  if(d.type === 'spell') c -= (p.loc === 'loduhon' ? 1 : 0) + p.field.filter(x => x.id === 'thaenlom').length;
  c = Math.max(0, c);
  return c;
}
function pow(p, c, vs, att){
  const d = C[c.id]; let v = d.power;
  for(const i of c.items) v += C[i].bonus;
  for(const m of c.mods) v += m.amt;
  if(p.loc && C[p.loc].buff === d.tribe) v++;
  if(d.tribe === 'hero') v += p.field.filter(x => x.id === 'khunborom').length;
  if(d.tribe === 'naga') v += p.field.filter(x => x.id === 'phayanak').length;
  if(d.tribe === 'warrior') v += p.field.filter(x => x.id === 'maethap').length;
  if(d.kw.rally && p.field.some(x => x !== c && C[x.id].tribe === 'warrior')) v++;
  if(c.id === 'phralak' && p.field.some(x => x.id === 'phralam')) v += 2;
  if(c.id === 'phinong') v += p.grave.filter(id => id === 'phinong').length;
  if(c.id === 'phikrasue' && p.loc === 'khuenduenmuet') v++;
  if(p.loc === 'thonghai' && d.cost <= 2) v++;
  if(oppLoc(p) === 'loduhnao') v--;
  if(att && c.id === 'siho') v += 2;
  if(vs){
    const t = C[vs.id].tribe;
    if(c.id === 'sinxay' && t === 'giant') v += 2;
    if(c.id === 'khrut' && t === 'naga') v += 2;
    if(c.id === 'khankhaak' && t === 'thewada') v += 3;
    if(c.id === 'phralam' && t === 'giant') v += 3;
    if(c.id === 'hapkhanasouane' && vs.id === 'phralam') v -= 3;

const hasTaunt = c => !!C[c.id].kw.taunt || c.items.includes('lowai');

function attackTargets(p, c){

function targetsFor(p, id){

  const chars = (pl, f) => pl.field.filter(f || (() => true)).map(c => ({kind:'char', owner:pl, c}));
  const notImm = c => c.id !== 'phayanak';
  switch(id){
    case 'bangfai': return [...chars(q, notImm), ...chars(p), {kind:'hero', owner:q}];
    case 'khamsap': return chars(q, notImm);
    case 'lomphayu': return [...chars(q, notImm), ...chars(p)];
    case 'sonsin': case 'sonphralam': case 'hokwiset': return chars(p);
    case 'kabongyak': return chars(p, c => C[c.id].tribe === 'giant');
    case 'phikrasue': return chars(q);
    case 'kumphan': return chars(q, c => C[c.id].cost <= 3);
    case 'faphaa': return chars(q, notImm);
    case 'phukkhaen': case 'lowai': case 'wao': case 'katip': case 'dokbuathip': return chars(p);
    case 'naiphan': case 'thaenfahong': return chars(q);

  }

function playBlock(p, h){
  const d = C[h.id];
  if(S.turn !== pi(p)) return 'ລໍຖ້າຕາຂອງເຈົ້າ';
  if(d.react) return 'ໃບນີ້ໃຊ້ໄດ້ຕອນຄູ່ແຂ່ງໂຈມຕີເທົ່ານັ້ນ';
  if(costOf(p, h.id) > p.mana) return 'ບຸນບໍ່ພໍ';
  if(d.type === 'char' && p.field.length >= 5) return 'ສະໜາມເຕັມແລ້ວ (5 ໃບ)';

// ຄືນຊີບ: the strongest non-legend characters in the discard pile, cost maxCost or less
function reviveList(p, maxCost){

function bounce(owner, c){

async function startTurn(){

}
async function endTurn(){

function gameOver(winner, reason){

/* ---------- bot ---------- */
async function botTurn(){
  const G = S, p = cur(), q = opp(p);
  const live = () => S === G && !G.over;   // stop if the game ended or a new game started
  G.busy = true;
  await sleep(450);
  if(p.level === 2){ await botTurnHard(G, p); if(live()){ await sleep(280); if(live()) endTurn(); } return; }
  let guard = 0;
  while(live() && guard++ < 15){
    const ch = p.level === 0 ? botPickEasy(p, q) : botPick(p, q);
    if(!ch) break;
    if(!G.auto) await fxShowCard(ch.h.id, ch.h.alt);
    if(!live()) return;
    await playCard(p, ch.h, ch.t);
    await sleep(320);
  }
  const order = [...p.field].sort((a, b) => pow(p, b) - pow(p, a));
  for(const c of order){
    let g = 0;
    while(live() && p.field.includes(c) && canAttack(p, c) && g++ < 3){
      const t = p.level === 0 ? botTargetEasy(p, c) : botTarget(p, c);
      if(!t) break;
      await attack(p, c, t);
      await sleep(360);
    }
  }
  if(live()){ await sleep(280); if(live()) endTurn(); }
}
function botPick(p, q){
  const reserve = p.hand.some(h => C[h.id].react) ? 1 : 0;
  let best = null, bs = 0;
  for(const h of p.hand){
    if(playBlock(p, h)) continue;
    const d = C[h.id], cost = costOf(p, h.id);
    if(reserve && d.type !== 'char' && p.mana - cost < reserve && cost < 5) continue;
    let s = 0, t = null;
    const tl = targetsFor(p, h.id) || [];
    const en = tl.filter(x => x.kind === 'char' && x.owner === q);
    if(d.type === 'loc'){
      if(!p.loc){
        const tribe = h.id === 'pasatyak' ? 'giant' : (h.id === 'khaithahan' ? 'warrior' : d.buff);
        s = 2 + p.field.filter(c => C[c.id].tribe === tribe).length + p.hand.filter(x => C[x.id].tribe === tribe).length * .5;
      }
    } else if(d.type === 'char'){
      s = cost * 2 + d.power + 1;
      if(h.id === 'phikrasue' && en.length) t = en.find(x => pow(q, x.c) <= 2) || maxBy(en, x => pow(q, x.c));
      if((h.id === 'thaenfahong') && en.length){ const k = en.filter(x => pow(q, x.c) <= 3); t = k.length ? maxBy(k, x => C[x.c.id].cost) : null; if(t) s += 2 + C[t.c.id].cost; }
      if(h.id === 'naiphan' && en.length){ t = maxBy(en, x => pow(q, x.c)); s += 1; }
      if(h.id === 'nanghung') s += Math.min(3, p.grave.filter(id => C[id].type === 'spell').length);
      if(h.id === 'kumphan' && en.length){ t = maxBy(en, x => C[x.c.id].cost + pow(q, x.c)); s += 2; }
      if(h.id === 'khankhaak' && p.deck.includes('bangfai')) s += 2;
      if((h.id === 'babynaga' || h.id === 'kinnari') && p.life < 14) s += 2;
      if(h.id === 'naktanu'){
        const dmg = p.field.some(c => C[c.id].tribe === 'warrior') ? 2 : 1, k = en.filter(x => pow(q, x.c) <= dmg);
        t = k.length ? maxBy(k, x => C[x.c.id].cost + pow(q, x.c)) : (en.length ? en[0] : null);
        if(k.length) s += 2 + C[t.c.id].cost;
      }
      if(d.tribe === 'warrior' && p.field.some(c => C[c.id].tribe === 'warrior')) s += 1;
      if(h.id === 'thaohung') s += Math.min(2, 5 - p.field.length) * 3;
      if(h.id === 'phinong') s += p.grave.filter(id => id === 'phinong').length * 1.5;
      if(h.id === 'moya'){ const r = reviveList(p, 3)[0]; if(r && p.field.length < 4) s += C[r].cost * 2 + 1; }
      if(h.id === 'phutthasen') s += reviveList(p, 4).slice(0, Math.min(2, 4 - p.field.length)).reduce((a, id) => a + C[id].cost * 2, 0);
      if(h.id === 'santhaman'){
        const mine = tl.filter(x => x.owner === p);
        if(mine.length){ t = minBy(mine, x => C[x.c.id].cost + pow(p, x.c) - (['nangnoy','kangli'].includes(x.c.id) || x.c.items.some(i => i === 'katip' || i === 'dokbuathip') ? 4 : 0)); s += 3 - C[t.c.id].cost - pow(p, t.c) + (['nangnoy','kangli'].includes(t.c.id) ? 3 : 0); }
      }
    } else if(d.type === 'item'){
      if(tl.length){ t = maxBy(tl, x => pow(p, x.c) + (x.c.sick ? 0 : 1) + (x.c.id === 'sinxay' && h.id === 'sonsin' ? 6 : 0) - (h.id === 'wao' && hasFly(x.c) ? 9 : 0) - (h.id === 'lowai' && hasTaunt(x.c) ? 9 : 0) - (h.id === 'hokwiset' && x.c.items.includes('hokwiset') ? 9 : 0) - (h.id === 'dokbuathip' && x.c.items.includes('dokbuathip') ? 9 : 0) + (h.id === 'dokbuathip' ? C[x.c.id].cost : 0)); s = 2 + d.bonus + (h.id === 'wao' || h.id === 'lowai' || (h.id === 'hokwiset' && q.field.some(hasTaunt)) ? 1.5 : 0); }
    } else if(h.id === 'bangfai'){
      const dmg = p.field.some(x => x.id === 'khankhaak') ? 5 : 3;
      if(q.life <= dmg){ t = {kind:'hero', owner:q}; s = 100; }
      else {
        const k = en.filter(x => pow(q, x.c) <= dmg);
        if(k.length){ t = maxBy(k, x => C[x.c.id].cost + pow(q, x.c)); s = 3 + C[t.c.id].cost; }
        else { t = {kind:'hero', owner:q}; s = 1.5; }

    } else if(h.id === 'namthuam'){

    } else if(h.id === 'khamsap'){
      if(en.length){ t = maxBy(en, x => pow(q, x.c)); const pw = pow(q, t.c); s = pw <= 3 ? 4 + C[t.c.id].cost : (pw >= 5 ? 3 : 0); }
    } else if(h.id === 'baci'){

    } else if(h.id === 'khaoniao'){
      s = p.life <= 14 ? 3 : 0;
    } else if(h.id === 'phukkhaen'){
      const mine = tl.filter(x => canAttack(p, x.c)); if(mine.length){ t = maxBy(mine, x => pow(p, x.c)); s = 2.5; }
    } else if(h.id === 'tikong'){
      const n = p.field.filter(c => canAttack(p, c)).length; s = n >= 2 ? n * 1.6 : 0;
    } else if(h.id === 'faphaa'){
      const k = en.filter(x => pow(q, x.c) <= 4); if(k.length){ t = maxBy(k, x => C[x.c.id].cost + pow(q, x.c)); s = 3 + C[t.c.id].cost; }
    } else if(h.id === 'satnam'){
      let v = 0; for(const c of q.field) if(C[c.id].cost <= 2) v += C[c.id].cost + 1; for(const c of p.field) if(C[c.id].cost <= 2) v -= C[c.id].cost + 1;
      s = v >= 3 ? v : 0;
    } else if(h.id === 'phayufa'){
      let v = 0; for(const c of q.field) if(c.id !== 'phayanak' && pow(q, c) <= 2) v += C[c.id].cost + 1; s = v >= 3 ? v : 0;
    } else if(h.id === 'mokseo'){
      if(en.length){ t = maxBy(en, x => pow(q, x.c)); s = pow(q, t.c) >= 4 ? 2.5 : 0; }
    } else if(h.id === 'pasumthap'){
      s = p.hand.length <= 5 ? (p.field.filter(c => C[c.id].tribe === 'warrior').length >= 2 ? 5 : 2.5) : 1;
    } else if(h.id === 'khongsuek'){
      const ws = p.field.filter(c => C[c.id].tribe === 'warrior' && canAttack(p, c));
      s = ws.length >= 2 ? ws.reduce((a, c) => a + pow(p, c), 0) * .8 : 0;
    } else if(h.id === 'namtamae'){
      const r = reviveList(p, 99)[0]; s = r ? C[r].cost * 2 + C[r].power - 3 : 0;
    } else if(h.id === 'haingeun'){
      s = .5;
    } else if(h.id === 'lomphayu'){
      const big = en.filter(x => C[x.c.id].cost >= 4 || x.c.items.length);
      if(big.length){ t = maxBy(big, x => C[x.c.id].cost + x.c.items.length * 2); s = C[t.c.id].cost; }
    }
    if(s > bs){ bs = s; best = {h, t}; }
  }
  return best;
}
function botTarget(p, c){
  const q = opp(p); const ts = attackTargets(p, c); if(!ts.length) return null;
  const hero = ts.find(x => x.kind === 'hero');
  if(hero && pow(p, c, null, true) >= q.life) return hero;
  let best = null, bs = -1;
  for(const t of ts){
    if(t.kind !== 'char') continue;
    const a = pow(p, c, t.c, true), b = pow(q, t.c, c);
    const tv = C[t.c.id].cost + b, mv = C[c.id].cost + pow(p, c);
    let s = -1;
    if(a > b) s = tv + 2; else if(a === b && tv >= mv) s = tv - mv + 1;
    if(s > bs){ bs = s; best = t; }
  }
  // hitting ຂວັນ wins games; only a clearly better trade beats it
  if(hero && pow(p, c, null, true) * (DECKS[p.di].aggr || 1.3) + (q.life <= 10 ? 3 : 0) >= bs) return hero;
  return bs >= 0 ? best : null;
}
function botPickEasy(p, q){
  const opts = p.hand.filter(h => !playBlock(p, h));
  if(!opts.length || Math.random() < .15) return null;
  const h = pick(opts); const tl = targetsFor(p, h.id); let t = null;
  if(tl && tl.length){ const en = tl.filter(x => x.owner === q); t = pick(en.length ? en : tl); }
  return {h, t};
}
function botTargetEasy(p, c){
  if(Math.random() < .3) return null;
  const ts = attackTargets(p, c); return ts.length ? pick(ts) : null;
}
function botReact(q, p, c, t){
  if(q.level === 0) return false;
  if(t.kind === 'hero'){ const d = pow(p, c, null, true); return d >= q.life || d >= 4; }
  return pow(p, c, t.c, true) > pow(q, t.c, c) && C[t.c.id].cost >= 3;
}


/* ---------- hard bot: try every move on a copy of the game, keep the best ---------- */
function cloneState(hideIdx){
  const cp = (p, i) => ({name:p.name, bot:true, di:p.di, level:p.level, life:p.life, maxMana:p.maxMana, mana:p.mana, penalty:p.penalty,
    deck:null, hand:null,
    field:p.field.map(c => ({uid:c.uid, id:c.id, sick:c.sick, atk:c.atk, x2:c.x2, frz:c.frz, items:c.items.slice(), mods:c.mods.map(m => ({amt:m.amt, exp:m.exp}))})),
    loc:p.loc, locAge:p.locAge, grave:p.grave.slice(), lastMagic:p.lastMagic, _src:p, _i:i});
  const ps = S.p.map(cp);
  for(const q of ps){
    const src = q._src;
    if(q._i === hideIdx){
      // the bot may know how many cards you hold, never which ones
      const pool = shuffle(src.deck.concat(src.hand.map(h => h.id)));
      q.hand = src.hand.map((h, j) => ({uid:h.uid, id:pool[j]})); q.deck = pool.slice(src.hand.length);
    } else { q.hand = src.hand.map(h => ({uid:h.uid, id:h.id})); q.deck = shuffle(src.deck.slice()); }
    delete q._src; delete q._i;
  }
  return {screen:'game', p:ps, turn:S.turn, T:S.T, level:S.level, log:[], over:null, busy:true, targeting:null, sel:null, modal:null, fast:true, auto:true, sim:true};
}
function resolveT(tk){
  if(!tk) return null;
  if(tk[0] === 'h') return {kind:'hero', owner:S.p[+tk.slice(2)]};
  const uid = +tk.slice(2);
  for(const pl of S.p){ const c = pl.field.find(x => x.uid === uid); if(c) return {kind:'char', owner:pl, c}; }
  return null;
}
function hardMoves(p){
  const out = [{type:'end'}];
  for(const h of p.hand){
    if(playBlock(p, h)) continue;
    const tl = targetsFor(p, h.id);
    if(tl && tl.length) for(const t of tl) out.push({type:'play', uid:h.uid, tk:tkey(t)});
    else out.push({type:'play', uid:h.uid, tk:null});
  }
  for(const c of p.field) if(canAttack(p, c)) for(const t of attackTargets(p, c)) out.push({type:'atk', uid:c.uid, tk:tkey(t)});
  return out;
}
async function applyMove(m){
  const p = cur();
  if(m.type === 'play'){ const h = p.hand.find(x => x.uid === m.uid); if(h) await playCard(p, h, resolveT(m.tk)); }
  else if(m.type === 'atk'){ const c = p.field.find(x => x.uid === m.uid), t = resolveT(m.tk); if(c && t) await attack(p, c, t); }
}
function evalState(me){
  const P = S.p[me], Q = S.p[1 - me];
  if(S.over) return S.over.winner === me ? 1e4 : -1e4;
  const myPow = P.field.reduce((a, c) => a + pow(P, c), 0), opPow = Q.field.reduce((a, c) => a + pow(Q, c), 0);
  let e = (P.life - Q.life) * 1.2 + myPow * 1.5 - opPow * 1.7 + (P.field.length - Q.field.length) + (P.hand.length - Q.hand.length) * .6;
  e += P.field.filter(hasTaunt).length * 1.5;
  e -= Q.life * ((DECKS[P.di].aggr || 1.3) - 1);
  if(opPow >= P.life) e -= 60;
  if(myPow >= Q.life) e += 25;
  return e;
}
async function quickTurn(p, q){
  let g = 0;
  while(!S.over && g++ < 12){ const ch = botPick(p, q); if(!ch) break; await playCard(p, ch.h, ch.t); }
  for(const c of [...p.field].sort((a, b) => pow(p, b) - pow(p, a))){
    let k = 0;
    while(!S.over && p.field.includes(c) && canAttack(p, c) && k++ < 3){ const t = botTarget(p, c); if(!t) break; await attack(p, c, t); }
  }
}
async function passTurnSim(){
  const p = cur();
  while(p.hand.length > 7) p.grave.push(p.hand.shift().id);
  for(const pl of S.p) for(const c of pl.field) c.mods = c.mods.filter(m => m.exp > S.T);
  await checkDeaths(); if(S.over) return;
  S.T++; S.turn = 1 - S.turn;
  const n = cur();
  for(const c of n.field){ c.sick = false; c.atk = 0; }
  draw(n, 1); if(S.over) return;
  if(n.loc === 'talatsao' && n.hand.length <= 2){ draw(n, 1); if(S.over) return; }
  n.maxMana = Math.min(10, n.maxMana + 1); n.mana = Math.max(0, n.maxMana - n.penalty); n.penalty = 0;
  const nk = n.field.filter(x => x.id === 'phayanak').length; if(nk) heal(n, 2 * nk);
  await turnStartEffects(n);
}
// play the move, finish this turn the medium way, let the opponent answer, then score
async function rolloutMove(m, me){
  const P = S.p[me], Q = S.p[1 - me];
  if(m.type !== 'end'){ await applyMove(m); if(!S.over) await quickTurn(P, Q); }
  if(!S.over) await passTurnSim();
  if(!S.over) await quickTurn(Q, P);
  return evalState(me);
}
async function botTurnHard(G, p){
  const me = pi(p); let guard = 0;
  while(S === G && !G.over && guard++ < 14){
    let best = null, bs = -Infinity;
    for(const m of hardMoves(p)){
      const real = S; let v = 0;
      try{ for(let r=0;r<2;r++){ S = cloneState(1 - me); v += await rolloutMove(m, me) / 2; } v += m.type === 'end' ? .05 : 0; }
      catch(err){ v = -Infinity; window.__errs.push('hard: ' + (err && err.stack || err)); }
      finally{ S = real; }
      if(v > bs){ bs = v; best = m; }
    }
    if(!best || best.type === 'end') break;
    if(best.type === 'play'){
      const h = p.hand.find(x => x.uid === best.uid); if(!h) break;
      await fxShowCard(h.id, h.alt); if(S !== G || G.over) return;
      await playCard(p, h, resolveT(best.tk));
    } else {
      const c = p.field.find(x => x.uid === best.uid), t = resolveT(best.tk); if(!c || !t) break;
      await attack(p, c, t);
    }
    await sleep(330);
  }
}

/* ---------- particle canvas: sparks, debris, shockwaves, screen flash ---------- */
const FX = {cv:null, ctx:null, ps:[], run:false, dpr:1, flash:0, flashColor:'#fff', last:0};
const TFX = {
  naga:{c:['#3aa0ff','#bfe9ff','#ffffff'], kind:'dot', g:700},
  giant:{c:['#ff5a3c','#ffb347','#7a4a2c'], kind:'shard', g:1000, solid:true},
  ghost:{c:['#b06bff','#e6d2ff','#8dff9e'], kind:'dot', g:-90},
  himma:{c:['#ffd23d','#fff3b0','#ff9a3d'], kind:'leaf', g:250},
  hero:{c:['#ffffff','#ffd23d','#9fe0ff'], kind:'spark', g:350},
  nakpat:{c:['#7be36a','#ffffff','#ffd23d'], kind:'spark', g:350},
  villager:{c:['#e8c48a','#ffffff','#c08a4a'], kind:'dot', g:500},
  thewada:{c:['#9fe0ff','#ffffff','#ffd23d'], kind:'spark', g:-60},
  warrior:{c:['#ff9f43','#ffd23d','#ffffff'], kind:'shard', g:800}

function fxCanvas(){
  if(FX.cv) return;
  const cv = document.createElement('canvas'); cv.id = 'fxc'; cv.setAttribute('aria-hidden', 'true'); document.body.appendChild(cv);
  FX.cv = cv; FX.ctx = cv.getContext('2d');
  const rs = () => { FX.dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = innerWidth * FX.dpr; cv.height = innerHeight * FX.dpr; };
  rs(); addEventListener('resize', rs);
}
function fxLoop(){ if(FX.run) return; FX.run = true; FX.last = performance.now(); requestAnimationFrame(fxTick); }
function emit(o){
  if((S && S.fast) || REDUCE) return; fxCanvas();
  if(FX.ps.length < 900) FX.ps.push(Object.assign({t:0, life:.8, g:0, drag:.97, size:4, kind:'dot', color:'#fff', rot:0, vr:0, vx:0, vy:0}, o));

function fxTick(now){
  const dt = Math.min(.05, (now - FX.last) / 1000); FX.last = now;
  const c = FX.ctx, d = FX.dpr; c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, innerWidth, innerHeight);
  if(FX.flash > 0){ c.globalAlpha = Math.min(1, FX.flash); c.fillStyle = FX.flashColor; c.fillRect(0, 0, innerWidth, innerHeight); FX.flash -= dt * 3.5; }
  for(let i = FX.ps.length - 1; i >= 0; i--){
    const p = FX.ps[i]; p.t += dt; if(p.t >= p.life){ FX.ps.splice(i, 1); continue; }
    const k = 1 - p.t / p.life;
    p.vx *= p.drag; p.vy = p.vy * p.drag + p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    c.globalCompositeOperation = p.solid ? 'source-over' : 'lighter';

    if(p.kind === 'dot'){ c.beginPath(); c.arc(p.x, p.y, Math.max(.5, p.size * (.4 + k * .6)), 0, 6.283); c.fill(); }
    else if(p.kind === 'spark'){ c.lineWidth = p.size; c.lineCap = 'round'; c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * .045, p.y - p.vy * .045); c.stroke(); }
    else if(p.kind === 'ring'){ const r = p.r0 + (p.r1 - p.r0) * (1 - k * k); c.lineWidth = p.size * k + 1; c.beginPath(); c.arc(p.x, p.y, r, 0, 6.283); c.stroke(); }
    else if(p.kind === 'shard' || p.kind === 'leaf'){
      c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
      if(p.kind === 'leaf'){ c.beginPath(); c.ellipse(0, 0, p.size, p.size * .38, 0, 0, 6.283); c.fill(); }
      else { c.beginPath(); c.moveTo(-p.size / 2, -p.size / 3); c.lineTo(p.size / 2, -p.size / 4); c.lineTo(p.size / 3, p.size / 3); c.lineTo(-p.size / 3, p.size / 4); c.closePath(); c.fill(); c.strokeStyle = '#1b1b1b'; c.lineWidth = 1; c.stroke(); }
      c.restore();
    }
    else if(p.kind === 'arc'){
      // a glowing curve that grows from the attacker to the target, then its tail catches up
      const q = p.t / p.life, head = Math.min(1, q / .45), tail = Math.max(0, (q - .3) / .7);
      const pt = u => { const v = 1 - u; return [v * v * p.x0 + 2 * v * u * p.cx + u * u * p.x1, v * v * p.y0 + 2 * v * u * p.cy + u * u * p.y1]; };
      c.globalCompositeOperation = 'lighter'; c.globalAlpha = 1; c.lineCap = 'round';
      for(const [w, col, blur] of [[p.size, p.color, 22], [p.size * .38, '#ffffff', 0]]){
        c.beginPath(); for(let u = tail; u <= head + 1e-6; u += .03){ const [x, y] = pt(Math.min(u, head)); if(u === tail) c.moveTo(x, y); else c.lineTo(x, y); }

      }
      c.shadowBlur = 0;
      if(head < 1){ const [hx, hy] = pt(head); c.fillStyle = '#ffffff'; c.beginPath(); c.arc(hx, hy, p.size * .8, 0, 6.283); c.fill(); }
    }
    else if(p.kind === 'slash'){
      const L = p.len * Math.min(1, p.t / p.life * 5), ca = Math.cos(p.ang), sa = Math.sin(p.ang);
      c.lineCap = 'round'; c.lineWidth = p.size * k + 2; c.beginPath(); c.moveTo(p.x - ca * L / 2, p.y - sa * L / 2); c.lineTo(p.x + ca * L / 2, p.y + sa * L / 2); c.stroke();

  }
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  if(FX.ps.length || FX.flash > 0) requestAnimationFrame(fxTick); else { FX.run = false; c.clearRect(0, 0, innerWidth, innerHeight); }
}

function closeModal(){ const r = S && S.modal && S.modal.resolve; if(S) S.modal = null; render(); if(r) r(); }
$app.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if(!el) return;
  const a = el.dataset.a, v = el.dataset.v;
  if(a === 'settings'){ ui.settingsOpen = true; render(); return; }
  if(a === 'setclose'){ ui.settingsOpen = false; render(); return; }
  if(a === 'set'){ toggleSetting(v); render(); return; }
  if(a === 'theme'){ SET.theme = v; saveSet(); render(); return; }
  if(ui.settingsOpen) return;
  if(!S || S.screen !== 'game'){
    if(a === 'mmclose'){ ui.mmodal = null; render(); return; }
    if(ui.mmodal) return;
    if(a === 'book'){ ui.screen = 'book'; render(); return; }
    if(a === 'bookback'){ ui.screen = null; render(); return; }
    if(a === 'booktab'){ ui.bookTab = v; render(); return; }
    if(a === 'bookcard'){ ui.mmodal = {type:'card', id:v, alt:el.dataset.alt ? 1 : 0}; render(); return; }
    if(a === 'stats'){ ui.mmodal = {type:'stats'}; render(); return; }
    if(a === 'tutstart'){ ui.screen = null; newGame(0, 0, {botDeck:1, first:0, tut:true}); return; }
    if(a === 'deck'){ ui.deck = +v; render(); }
    else if(a === 'lvl'){ ui.level = +v; render(); }
    else if(a === 'start'){ newGame(ui.deck, ui.level); }
    return;
  }
  if(a === 'tutnext'){ if(S.tut){ S.tut.step++; render(); } return; }
  if(a === 'tutdone' || a === 'tutskip'){ S.tut = null; saveJ('lao-legend-tut', 1); render(); return; }
  if(a === 'mclose'){ closeModal(); return; }
  if(a === 'yes' || a === 'no'){ const r = S.modal.resolve; S.modal = null; render(); r(a === 'yes'); return; }
  if(a === 'discard'){ const r = S.modal.resolve; const h = S.p[0].hand.find(x => x.uid === +v); S.modal = null; render(); r(h); return; }
  if(a === 'menu'){ if(S.over || (S.turn === 0 && !S.busy)){ S = null; render(); } return; }
  if(a === 'replay'){ newGame(ui.deck, ui.level); return; }
  if(S.modal) return;
  if(S.targeting){
    if(a === 'cancel'){ const r = S.targeting.resolve; S.targeting = null; S.sel = null; render(); r(undefined); return; }
    const k = el.dataset.k; const t = k && S.targeting.list.find(x => tkey(x) === k);
    if(t){ const r = S.targeting.resolve; S.targeting = null; S.sel = null; render(); r(t); }
    return;
  }
  if(a === 'hidehand'){ ui.hideHand = !ui.hideHand; render(); return; }
  if(a === 'info'){ S.modal = {type:'info', id:v}; render(); return; }
  if(a === 'log'){ S.modal = {type:'log'}; render(); return; }
  const myMove = S.turn === 0 && !S.busy && !S.over && !S.auto;
  if(a === 'hand'){
    const h = S.p[0].hand.find(x => x.uid === +v); if(!h) return;
    S.modal = myMove ? {type:'hand', uid:h.uid} : {type:'info', id:h.id, alt:h.alt}; render(); return;
  }
  if(a === 'field'){
    const k = el.dataset.k;
    const own = S.p[0].field.find(c => 'c:' + c.uid === k);
    if(own && myMove && canAttack(S.p[0], own)){ attackFlow(own); return; }
    const any = [...S.p[0].field, ...S.p[1].field].find(c => 'c:' + c.uid === k);
    if(any){ S.modal = {type:'info', id:any.id, alt:any.alt}; render(); }
    return;
  }
  if(a === 'end'){ if(myMove) endTurn(); return; }
});

/* ---------- self-test: bot vs bot, no animation ---------- */
window.__sim = async function(n, level, levels){
  n = n || 30; const D = DECKS.length; const res = {games:0, wins:DECKS.map(() => 0), plays:DECKS.map(() => 0), seat:[0,0], avgTurns:0, reasons:{life:0, deck:0}, errors:[]};
  window.__errs.length = 0; let turns = 0;
  for(let i=0;i<n;i++){
    const a = i % D, b = (a + 1 + (Math.floor(i / D) % (D - 1))) % D;
    try{
      await new Promise((resolve, reject) => {
        const to = setTimeout(() => reject(new Error('timeout game ' + i)), 30000);
        newGame(a, level == null ? 1 : level, {fast:true, auto:true, botDeck:b, levels:levels, onEnd:() => { clearTimeout(to); resolve(); }});
      });
      res.games++; turns += S.T; res.plays[S.p[0].di]++; res.plays[S.p[1].di]++; res.wins[S.p[S.over.winner].di]++; res.reasons[S.over.reason]++; res.seat[S.over.winner]++;
    }catch(err){ res.errors.push(String(err)); }
  }
  res.avgTurns = res.games ? Math.round(turns / res.games / 2 * 10) / 10 : 0;
  res.errors.push(...window.__errs);
  S = null; render();
  return res;
};
