<script>
/* The game lives at laolegendwars.com. Browsers keep saved data per address, so the old github.io address sends what this
   browser holds there (the save, the settings and the account sign-in) to the new one inside the #fragment, which is never
   sent to any server. The new address takes it only when it has nothing yet or an older copy, then reloads clean.
   Both halves run before the game starts; the page stays hidden meanwhile. */
(function(){
  const OLD = 'ndesignnewgen-cmyk.github.io', NEW = 'https://laolegendwars.com/', KEEP = /^lao-legend|^sb-.*-auth-token$/;
  const b64 = u => { let t = ''; for(let i = 0; i < u.length; i += 0x8000) t += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(t).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  const unb64 = t => { const b = atob(t.replace(/-/g, '+').replace(/_/g, '/')), u = new Uint8Array(b.length); for(let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
  const keys = () => { const k = []; try{ for(let i = 0; i < localStorage.length; i++) if(KEEP.test(localStorage.key(i))) k.push(localStorage.key(i)); }catch(e){} return k; };
  const atOf = v => { try{ return (JSON.parse(v || '{}').at) || 0; }catch(e){ return 0; } };
  if(location.hostname === OLD){
    document.documentElement.style.visibility = 'hidden';
    const go = h => location.replace(NEW + (h ? '#move=' + h : ''));
    const data = {}; for(const k of keys()) data[k] = localStorage.getItem(k);
    if(!Object.keys(data).length){ go(''); return; }
    const raw = new TextEncoder().encode(JSON.stringify(data));
    if(window.CompressionStream) new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer().then(b => go('z' + b64(new Uint8Array(b))), () => go('p' + b64(raw)));
    else go('p' + b64(raw));
    return;
  }
  const m = /^#move=([pz])([A-Za-z0-9_-]+)$/.exec(location.hash); if(!m) return;
  document.documentElement.style.visibility = 'hidden';
  // what this address held before the game had a chance to write anything
  const had = keys().some(k => k === 'lao-legend-collection' || /^sb-/.test(k)), hadAt = atOf(localStorage.getItem('lao-legend-sync'));
  const u = unb64(m[2]);
  const text = m[1] === 'z' ? new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text() : Promise.resolve(new TextDecoder().decode(u));
  text.then(t => {
    const data = JSON.parse(t);
    if(had && atOf(data['lao-legend-sync']) <= hadAt) return;   // this address already has the same or newer data
    for(const k of keys()) localStorage.removeItem(k);
    for(const k in data) if(KEEP.test(k) && typeof data[k] === 'string') localStorage.setItem(k, data[k]);
  }).catch(() => {}).then(() => location.replace(location.pathname + location.search));
})();
</script>

<style>
/* Layout: a dark Lao playmat; bot side on top, your side below, your hand along the bottom edge */
:root{
  --mat:#120f18;
  --mat-2:#1c1724;
  --mat-3:#2a2236;
  --ink:#f4efe4;
  --dim:#b3a995;
  --gold:#f2b632;
  --good:#4fd18b;
  --bad:#ff5d4d;
  --mana:#55c6ff;
  --line:#1b1b1b;
  --f-d:'Noto Sans Lao','Phetsarath OT',sans-serif;
  --f-b:'Noto Sans Lao Looped','Noto Sans Lao','Phetsarath OT',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);font-family:var(--f-b);
  background:
    radial-gradient(ellipse at 50% 50%,#2b2140 0%,transparent 65%),
    radial-gradient(circle at 1px 1px,#ffffff0b 1px,transparent 0) 0 0/18px 18px,
    var(--mat);}
button{font:inherit;color:inherit}
#app{height:100%}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#fx .rays{position:absolute;width:var(--s);height:var(--s);transform:translate(-50%,-50%);border-radius:50%;
  background:url(art/fx/rays.webp) center/100% no-repeat,repeating-conic-gradient(from 0deg,transparent 0 9deg,color-mix(in srgb,var(--c) 45%,transparent) 11deg 14deg,transparent 16deg 22.5deg);
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 72%);mask:radial-gradient(circle,#000 30%,transparent 72%);animation:rays var(--d) ease-out forwards;mix-blend-mode:screen}
@keyframes rays{0%{opacity:0;transform:translate(-50%,-50%) rotate(0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(70deg) scale(1.15)}}
#fx .yantra{position:absolute;width:var(--s);height:var(--s);transform:translate(-50%,-50%);animation:ytr var(--d) ease-out forwards}
#fx .yantra::before{content:'';position:absolute;inset:-4%;border-radius:50%;background:radial-gradient(circle,rgba(26,10,40,.78) 0 58%,rgba(26,10,40,.45) 68%,transparent 72%)}
#fx .yantra svg{position:relative;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 6px var(--c)) drop-shadow(0 0 16px var(--c))}
#fx .yantra .yd *{fill:none;stroke:var(--c);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:ydraw calc(var(--d) * .45) ease-out forwards}
#fx .yantra .ydots circle{fill:var(--c);opacity:0;animation:ydots calc(var(--d) * .3) calc(var(--d) * .35) ease-out forwards}
#fx .yantra.art img{position:relative;display:block;width:100%;height:100%;animation:yopen calc(var(--d) * .4) ease-out both}
@keyframes yopen{from{clip-path:circle(0 at 50% 50%);filter:brightness(2.4)}to{clip-path:circle(71% at 50% 50%);filter:brightness(1)}}
@keyframes ydraw{to{stroke-dashoffset:0}}@keyframes ydots{to{opacity:1}}
@keyframes ytr{0%{opacity:0;transform:translate(-50%,-50%) rotate(-30deg) scale(.6)}15%{opacity:1}80%{opacity:1;transform:translate(-50%,-50%) rotate(25deg) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(35deg) scale(1.15)}}
#fx .orb{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;background:url(art/fx/orb.webp) center/100% no-repeat,radial-gradient(circle,#fff 0 12%,var(--c) 24%,transparent 46%)}
#fx .candle{position:absolute;width:12px;height:62px;margin:-58px 0 0 -6px;background:url(art/fx/candle.webp) center bottom/contain no-repeat;filter:drop-shadow(0 2px 2px #0008);opacity:0;animation:candle .35s ease-out forwards}
#fx .candle i{position:absolute;left:50%;top:-12px;width:36px;height:36px;margin-left:-18px;border-radius:50%;background:radial-gradient(circle,#fff8d8 0 10%,#ffd23d80 30%,#ff9a3d00 68%);mix-blend-mode:screen;animation:flame .2s ease-in-out infinite alternate}
@keyframes candle{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes flame{to{transform:scale(1.22);opacity:.75}}
/* ພາຂວັນ: the baci centrepiece rises in the middle of the rite, and over the hand for the ບາສີ card */
#fx .phakhuan{position:absolute;height:var(--s);transform:translate(-50%,-62%);animation:pkin var(--d) ease-out forwards}
#fx .phakhuan img{display:block;height:100%;filter:drop-shadow(0 0 8px #fff6c8) drop-shadow(0 0 22px #ffd23d)}
@keyframes pkin{0%{opacity:0;transform:translate(-50%,-48%) scale(.55)}18%{opacity:1;transform:translate(-50%,-64%) scale(1.06)}26%{transform:translate(-50%,-62%) scale(1)}82%{opacity:1}100%{opacity:0;transform:translate(-50%,-66%) scale(1.04)}}
#fx .sasin{position:absolute;width:var(--s);margin:calc(var(--s) * -.45) 0 0 calc(var(--s) * -.5);filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 14px #ffe48a)}
#fx .sasin img{display:block;width:100%}
#fx .pillar{position:absolute;width:10px;height:var(--h);transform:translate(-50%,-100%);margin-top:30px;border-radius:999px;background:linear-gradient(to bottom,transparent,color-mix(in srgb,var(--c) 70%,#fff) 30%,#fff 85%,color-mix(in srgb,var(--c) 60%,transparent));
  box-shadow:0 0 40px 18px color-mix(in srgb,var(--c) 70%,transparent);mix-blend-mode:screen;animation:pillar var(--d) ease-out forwards}
@keyframes pillar{0%{width:6px;opacity:0}25%{width:120px;opacity:1}70%{width:80px;opacity:.9}100%{width:4px;opacity:0}}
#fx .rrocket{position:absolute;width:18px;height:64px;transform:translate(-50%,-50%);border-radius:9px 9px 4px 4px;background:repeating-linear-gradient(0deg,#d9a35a 0 8px,#b9803c 8px 10px);box-shadow:0 0 0 2px #1b1b1b,0 0 18px #ffb347}
#fx .rrocket::before{content:'';position:absolute;left:50%;top:-14px;margin-left:-11px;border:11px solid transparent;border-bottom:16px solid #e0302a;border-top:0}
#fx .threads{position:absolute;width:var(--s);height:calc(var(--s) * .6);transform:translate(-50%,-50%)}
#fx .threads svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 10px #ffe48a)}
#fx .threads path{fill:none;stroke:#fffdf4;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:ydraw calc(var(--d) * .7) ease-out forwards,fadeo calc(var(--d) * .3) calc(var(--d) * .7) forwards}
@keyframes fadeo{to{opacity:0}}
#fx .skiphint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);font:700 12px var(--f-d);color:#fff;background:#0008;border-radius:999px;padding:4px 12px;opacity:0;animation:skiph .4s .6s forwards;z-index:3}
@keyframes skiph{to{opacity:.85}}

/* ---------- full card face (same design as the card set) ---------- */
.card{position:relative;width:100%;aspect-ratio:63/88;border-radius:4.4%/3.2%;container-type:inline-size;background:var(--edge);box-shadow:0 6px 16px #0009}
.card .face{position:absolute;top:4.2cqw;left:4.2cqw;right:4.2cqw;bottom:5.4cqw;border-radius:3cqw;overflow:hidden;box-shadow:0 0 0 .7cqw #fff,0 0 0 1.3cqw var(--line)}
.card .art{position:absolute;inset:0}
.card .art img{width:100%;height:100%;object-fit:cover;object-position:50% 0;display:block}
.card .cost{position:absolute;top:2.6cqw;left:2.6cqw;width:15cqw;border:.6cqw solid var(--line);border-radius:1.4cqw;overflow:hidden;background:#fff;text-align:center}
.card .lbl{display:block;font:800 2.9cqw/1.5 var(--f-d);color:#fff}
.card .cost .lbl{background:#1f9d6b}
.card .num{display:block;font:800 9cqw/1.15 var(--f-d);color:var(--line)}
.card .sym{position:absolute;top:2.6cqw;right:2.6cqw;width:13cqw;height:11cqw;border:.6cqw solid var(--line);border-radius:1.4cqw;background:#fff;display:grid;place-items:center}
.card .sym svg{width:78%;height:78%}
.card .panel{position:absolute;left:2.6cqw;right:2.6cqw;bottom:21.5cqw;background:#ffffffec;border:.6cqw solid var(--line);border-radius:1.6cqw;padding:3.6cqw 3cqw 2cqw;color:#1b1b1b}
.card .tag{position:absolute;top:-2.9cqw;left:2.6cqw;background:var(--tag);color:#fff;border:.5cqw solid var(--line);font:800 3cqw/1.45 var(--f-d);padding:0 2.2cqw;border-radius:1cqw;white-space:nowrap}
.card .skill{margin:0;font-size:3.45cqw;line-height:1.55}
.card .bottom{position:absolute;left:2.6cqw;right:2.6cqw;bottom:2.6cqw;height:16.5cqw;display:flex;gap:2cqw}
.card .power{width:16cqw;flex:none;border:.6cqw solid var(--line);border-radius:1.4cqw;overflow:hidden;background:#fff;text-align:center;display:flex;flex-direction:column}
.card .power .lbl{background:#2c63c9}
.card .power .num{flex:1;display:grid;place-items:center}
.card .namebox{flex:1;min-width:0;border:.6cqw solid var(--line);border-radius:1.4cqw;background:#fffaf0;display:flex;align-items:center;justify-content:center;padding:0 2cqw;font:800 8.2cqw/1.2 var(--f-d);color:var(--line);white-space:nowrap;overflow:hidden}
.card.hero{--edge:linear-gradient(160deg,#e0463a,#b8261f 55%,#8e1a15);--tag:#c8312b}
.card.legend{--edge:linear-gradient(150deg,#ffe48a,#d39a1e 30%,#ffe69a 52%,#b07a0c 76%,#f5cf62);--tag:#b07a0c}
.card.spell{--edge:linear-gradient(160deg,#3d86e8,#2459b8 55%,#183f8a);--tag:#2459b8}
.card.legend::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;mix-blend-mode:color-dodge;opacity:.18;
  background:repeating-linear-gradient(115deg,#ff3d6e 0%,#ffd23d 6%,#3dffa2 12%,#3dc5ff 18%,#b13dff 24%,#ff3d6e 30%);background-size:300% 300%;animation:holo 6s linear infinite}
@keyframes holo{to{background-position:300% 0}}

/* ---------- menu ---------- */
.menu{height:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:20px;
  padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{text-align:center}
.logo .set{font:700 15px var(--f-d);letter-spacing:.04em;color:var(--gold)}
.logo h1{margin:0}
.logoimg{display:block;width:min(460px,86vw);height:auto;margin:0 auto -6px;filter:drop-shadow(0 10px 24px #000a)}
.logo p{margin:0;color:var(--dim)}
.decks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:14px;width:min(920px,100%)}
.deck{display:flex;gap:14px;align-items:center;padding:12px;border-radius:16px;background:var(--mat-2);border:2px solid #ffffff14;cursor:pointer;transition:transform .15s,border-color .15s}
.deck:hover{transform:translateY(-3px)}
.deck:focus-visible{outline:2px solid #fff;outline-offset:2px}
.deck.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 10px 30px #f2b63230}
.deck .card{width:104px;flex:none}
.deck>div:not(.card) b{display:block;color:var(--gold);font:800 15px var(--f-d)}
.deck>div:not(.card)>span{display:block;font:800 18px/1.35 var(--f-d)}
.deck>div:not(.card)>small{display:block;color:var(--dim);font-size:13px;margin-top:4px}
.levels{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.levels > span{color:var(--dim)}
.lv{background:#ffffff10;border:1px solid #ffffff24;border-radius:999px;padding:8px 18px;font:700 15px var(--f-d);cursor:pointer}
.lv.on{background:var(--gold);color:#1a1206;border-color:var(--gold)}
.lv:disabled{opacity:.45;cursor:default}
.btn-main{background:var(--gold);color:#1a1206;border:0;border-radius:999px;padding:13px 40px;font:800 19px var(--f-d);cursor:pointer;box-shadow:0 6px 0 #a8740f}
.btn-main:active{transform:translateY(3px);box-shadow:0 3px 0 #a8740f}
.btn-main:disabled{background:#ffffff20;color:#ffffff70;box-shadow:none;cursor:default}
.btn-main.sm{padding:10px 24px;font-size:16px}
.btn2{background:#ffffff14;border:1px solid #ffffff2a;border-radius:999px;padding:9px 18px;font:700 14px var(--f-d);cursor:pointer}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.links{margin:0;color:var(--dim);font-size:14px;text-align:center}
.links a{color:var(--gold)}
.note{margin:0;color:var(--dim);font-size:12.5px;text-align:center;max-width:52ch}
.stats{color:var(--dim);font-size:13px}

/* ---------- board ---------- */
.board{height:100%;max-width:1120px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto minmax(0,1fr) auto auto;gap:4px;
  padding-block:6px 2px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;gap:10px;justify-content:space-between;min-height:50px}
.who{display:flex;align-items:center;gap:8px;border-radius:999px;padding:3px 14px 3px 3px;background:#0007;border:2px solid #ffffff14;transition:box-shadow .2s}
.who.tgt{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad),0 0 20px var(--bad);cursor:pointer;animation:pulse 1s infinite}
.av{width:42px;height:42px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);flex:none}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.who .nm{font:700 12px var(--f-d);color:var(--dim);line-height:1.2}
.life{display:flex;align-items:center;gap:4px;font:800 22px/1.1 var(--f-d);font-variant-numeric:tabular-nums}
.life svg{width:18px;height:18px}
.manabox{display:flex;flex-direction:column;align-items:center;gap:2px}
.gems{display:flex;gap:3px}
.gem{width:11px;height:11px;border-radius:50%;border:1px solid #ffffff30;transform:rotate(45deg);border-radius:2px}
.gem.full{background:var(--mana);border-color:#c9efff;box-shadow:0 0 6px var(--mana)}
.gem.spent{background:#ffffff22}
.mtxt{font:700 11px var(--f-d);color:var(--dim);font-variant-numeric:tabular-nums}
.meta{display:flex;align-items:center;gap:8px;font:700 12px var(--f-d);color:var(--dim)}
.pile{display:flex;align-items:center;gap:3px}
.pile svg{width:14px;height:14px}
.backs{display:flex;padding-left:6px}
.backs i{width:15px;height:21px;border-radius:3px;margin-left:-6px;background:linear-gradient(135deg,#8a2020,#3a0f0f);border:1px solid var(--gold)}
.loc{background:#ffffff12;border:1px solid #ffffff26;border-radius:999px;padding:3px 10px;font:700 12px var(--f-d);cursor:pointer;white-space:nowrap}
.loc.none{cursor:default;opacity:.5}
.quit{background:none;border:1px solid #ffffff26;border-radius:999px;padding:3px 10px;font:700 12px var(--f-d);cursor:pointer;color:var(--dim)}
.field{display:flex;justify-content:center;align-items:center;gap:clamp(4px,1.2vw,12px);min-height:0;border-radius:16px;position:relative;
  background:radial-gradient(ellipse at 50% 50%,var(--tint,transparent),transparent 70%)}
.field .empty{color:#ffffff2e;font:700 13px var(--f-d)}
.field[data-loc="maenamkhong"]{--tint:#3aa0ff30}
.field[data-loc="khuenduenmuet"]{--tint:#a77bff30}
.field[data-loc="pasatyak"]{--tint:#ff5a3c30}
.field[data-loc="pahimmaphan"]{--tint:#ffcf3a2a}
.mini{--w:clamp(52px,min(17vw,12.5dvh),106px);width:var(--w);aspect-ratio:63/88;position:relative;border-radius:9px;overflow:hidden;flex:none;cursor:pointer;
  border:2px solid #c8312b;background:#222;box-shadow:0 6px 14px #0009;transition:transform .15s,box-shadow .2s}
.mini.lg{border-color:var(--gold)}
.mini img{width:100%;height:100%;object-fit:cover;object-position:50% 6%;display:block}
.mini .pw{position:absolute;left:3px;bottom:3px;width:calc(var(--w)*.34);height:calc(var(--w)*.34);border-radius:50%;background:#fff;color:#111;border:2px solid #111;
  display:grid;place-items:center;font:800 calc(var(--w)*.2)/1 var(--f-d);font-variant-numeric:tabular-nums}
.pw.up{background:#bff3d0;color:#0b4a24}
.pw.down{background:#ffd2cb;color:#7a140a}
.mini .nm{position:absolute;left:0;right:0;bottom:0;padding:calc(var(--w)*.14) 3px 3px calc(var(--w)*.38);background:linear-gradient(transparent,#000d 55%);
  color:#fff;font:700 calc(var(--w)*.115)/1.25 var(--f-d);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .kw{position:absolute;top:3px;left:3px;right:3px;display:flex;gap:2px;flex-wrap:wrap}
.kw span{font:700 calc(var(--w)*.1)/1.35 var(--f-d);background:#000c;color:#fff;border-radius:4px;padding:0 3px}
.kw .it{background:#2459b8}
.kw .dn{background:#7a2fd0}
.mini.sick img,.mini.used img{filter:saturate(.35) brightness(.55)}
.mini .st{position:absolute;top:38%;left:0;right:0;text-align:center;font:800 calc(var(--w)*.13) var(--f-d);color:#fff;text-shadow:0 1px 3px #000}
.mini.can{border-color:var(--good);box-shadow:0 0 0 2px var(--good),0 0 18px var(--good)}
.mini.can:hover{transform:translateY(-4px)}
.mini.sel{transform:translateY(-10px) scale(1.06);border-color:var(--gold);box-shadow:0 0 0 3px var(--gold),0 0 24px var(--gold);z-index:2}
.mini.tgt{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad),0 0 20px var(--bad);animation:pulse 1s infinite}
.mid{display:flex;align-items:center;gap:10px;justify-content:space-between;min-height:42px}
.turn{font:800 13px var(--f-d);padding:5px 12px;border-radius:999px;background:#ffffff10;white-space:nowrap}
.turn.me{background:#f2b63226;color:var(--gold)}
.logline{flex:1;min-width:0;background:none;border:0;font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;cursor:pointer}
.endbtn{background:var(--gold);color:#1a1206;border:0;border-radius:999px;padding:9px 20px;font:800 15px var(--f-d);cursor:pointer;white-space:nowrap;box-shadow:0 4px 0 #a8740f}
.endbtn:disabled{background:#ffffff1a;color:#ffffff60;box-shadow:none;cursor:default}
.endbtn.glow{animation:pulse 1.1s infinite}
.mid.tg{justify-content:center;gap:14px}
.prompt{font:800 15px var(--f-d);color:var(--gold)}
.hand{display:flex;gap:6px;overflow-x:auto;padding:14px 4px 6px;justify-content:safe center;scrollbar-width:none}
.hand::-webkit-scrollbar{display:none}
.hc{flex:none;width:clamp(70px,min(19vw,13dvh),118px);cursor:pointer;transition:transform .15s}
.hc.ok{transform:translateY(-10px)}
.hc.ok .card{box-shadow:0 0 0 2px var(--good),0 0 18px #4fd18b88}
.hc.ok:hover{transform:translateY(-16px)}
.hc.no{filter:brightness(.62)}


/* ---------- board v2: color-coded lanes, ຂວັນ column left, piles and portrait right ---------- */
body{background:
    radial-gradient(ellipse at 50% 115%,#ff6a2a44 0%,transparent 55%),
    radial-gradient(ellipse at 50% 40%,#2b2140 0%,transparent 65%),
    radial-gradient(circle at 1px 1px,#ffffff0b 1px,transparent 0) 0 0/18px 18px,
    var(--mat)}
.table2{height:100%;max-width:1440px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto minmax(0,1fr) auto;gap:6px;
  padding-block:6px 2px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topinfo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:30px}
.tchip{background:#fff;color:#1b1b1b;border:2px solid #1b1b1b;border-radius:999px;padding:2px 12px;font:700 13px var(--f-d)}
.tchip b{color:#c8312b}
.phases{display:flex;gap:4px}
.phases span{font:800 11px var(--f-d);padding:3px 10px;border-radius:6px;background:#ffffff14;color:#ffffff80;transform:skewX(-10deg)}
.phases span.on{background:var(--gold);color:#1a1206}
.ohand{margin-left:auto;display:flex;align-items:center;padding-left:8px}
.ohand .cback{width:22px;margin-left:-9px}
.ohand b{margin-left:8px;font:800 14px var(--f-d)}
.cback{display:block;aspect-ratio:63/88;border-radius:7px;overflow:hidden;box-shadow:0 0 0 2px #1b1b1b,0 4px 10px #0007}
.cback img{display:block;width:100%;height:100%;object-fit:cover}
.half{display:grid;grid-template-columns:84px minmax(0,1fr) 200px;gap:12px;min-height:0}
.mat{background:#efe7d6;border-radius:18px;padding:8px;display:grid;grid-template-rows:38fr 62fr;gap:8px;min-height:0;box-shadow:0 0 0 3px #1b1b1b,0 12px 30px #0009}
.half.me .mat{grid-template-rows:62fr 38fr}
.lane{position:relative;border-radius:12px;min-height:0}
.lane.chars{container-type:size;overflow:hidden;box-shadow:inset 0 0 0 3px #1b1b1b;
  background:repeating-linear-gradient(135deg,#ffffff0d 0 10px,transparent 10px 20px),#c8312b}
.lane.chars .row{position:relative;z-index:1;height:100%;display:flex;gap:min(12px,1.4cqw);align-items:center;justify-content:center;padding:0 54px}
.lane.chars .mini{--w:min(150px,calc((100cqh - 18px) * .716),calc((100cqw - 120px) / max(var(--n,5),3.2) - 12px))}
.wm{position:absolute;inset:0;display:grid;place-items:center;font:800 clamp(16px,6cqw,70px)/1 var(--f-d);color:#ffffff26;letter-spacing:.08em;pointer-events:none;user-select:none;white-space:nowrap}
.maxb{position:absolute;left:8px;bottom:8px;z-index:2;background:#fff;color:#1b1b1b;border:2px solid #1b1b1b;border-radius:7px;font:700 9px/1.2 var(--f-d);padding:2px 6px;text-align:center}
.maxb b{display:block;font:800 18px/1 var(--f-d)}
.half.opp .maxb{top:8px;bottom:auto}
.lane.support{display:grid;grid-template-columns:minmax(0,26%) minmax(0,1fr);gap:8px}
.slot{position:relative;border-radius:12px;box-shadow:inset 0 0 0 3px #1b1b1b;container-type:size;display:grid;place-items:center;overflow:hidden}
.slot.loc{background:repeating-linear-gradient(45deg,#ffffff1a 0 8px,transparent 8px 16px),#e8b23a}
.slot.magic{background:repeating-linear-gradient(45deg,#ffffff12 0 8px,transparent 8px 16px),#2f63c4}
.slot .card{position:relative;z-index:1;width:min(calc((100cqh - 14px) * .716),calc(100cqw - 14px))}
.slot.loc.has,.lm{cursor:pointer}
.lm{position:relative;z-index:1;display:grid;place-items:center}
.lifecol{border-radius:14px;min-height:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 6px;
  background:repeating-linear-gradient(90deg,#b98a4e 0 6px,#a8773e 6px 12px);box-shadow:0 0 0 3px #1b1b1b,inset 0 0 0 3px #e8c48a}
.ltitle{background:#c8312b;color:#fff;border:2px solid #1b1b1b;border-radius:6px;font:800 12px var(--f-d);padding:1px 8px;transform:rotate(-4deg)}
.lnum{display:flex;align-items:center;gap:3px;background:#fff;border:2px solid #1b1b1b;border-radius:10px;padding:2px 7px;font:800 22px/1.1 var(--f-d);color:#1b1b1b;font-variant-numeric:tabular-nums}
.lnum svg{width:16px;height:16px}
.beads{flex:1;min-height:0;width:30px;display:flex;flex-direction:column-reverse;gap:2px}
.beads i{flex:1;min-height:3px;border-radius:4px;background:#00000038;border:1px solid #00000055}
.beads i.on{background:linear-gradient(90deg,#ff8a6a,#e0302a);border-color:#7a140a}
.sidecol{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px;min-height:0}
.piles{display:flex;gap:10px;align-items:flex-start}
.pile{position:relative;width:min(70px,8.5dvh);flex:none}
.pile .card{width:100%}
.gravep[data-a]{cursor:pointer}
.gempty{aspect-ratio:63/88;border-radius:8px;border:2px dashed #ffffff30}
.cnt{position:absolute;top:-7px;right:-7px;z-index:2;background:#fff;color:#1b1b1b;border:2px solid #1b1b1b;border-radius:8px;font:800 13px/1 var(--f-d);padding:3px 6px;font-variant-numeric:tabular-nums}
.plbl{display:block;text-align:center;font:700 11px var(--f-d);color:var(--dim);margin-top:4px}
.avwrap{position:relative;display:grid;justify-items:center;gap:4px;padding:4px 8px;border-radius:18px;border:2px solid transparent}
.avwrap.tgt{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad),0 0 24px var(--bad);cursor:pointer;animation:pulse 1s infinite}
.avbig{width:min(86px,10.5dvh);aspect-ratio:1;border-radius:50%;overflow:hidden;border:4px solid #fff;box-shadow:0 0 0 3px #1b1b1b,0 0 26px #f2b63266}
.avbig img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.mana{position:absolute;top:-6px;right:-4px;background:#2459b8;color:#fff;border:3px solid #1b1b1b;border-radius:10px;padding:2px 7px;transform:rotate(6deg);text-align:center;line-height:1}
.mana b{font:800 22px/1 var(--f-d)}
.mana small{font:700 12px var(--f-d)}
.mana span{display:block;font:700 9px/1.3 var(--f-d)}
.avname{position:relative;margin-top:-12px;background:#fff;color:#1b1b1b;border:2px solid #1b1b1b;border-radius:8px;font:800 13px var(--f-d);padding:1px 10px;white-space:nowrap}
.midline{display:flex;align-items:center;gap:12px;min-height:40px}
.midline.tg{justify-content:center}
.hint{display:flex;align-items:center;gap:8px;font:700 13px var(--f-d);color:#fff;min-width:0}
.hint .ic{flex:none;width:30px;height:30px;border-radius:8px;background:#fff;border:2px solid #1b1b1b;display:grid;place-items:center}
.hint .ic svg{width:20px;height:20px}
.hint b{color:var(--gold)}
.hint span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.midline .logline{flex:1}
.handrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:end;gap:10px}
.hidebtn{background:#fff;color:#1b1b1b;border:2px solid #1b1b1b;border-radius:8px;font:700 12px var(--f-d);padding:4px 10px;cursor:pointer;margin-bottom:8px}
.handrow .hand{padding:16px 4px 4px}
.handrow .hand.hidden{visibility:hidden;height:0;padding:0}
.handrow .hc{width:clamp(70px,min(14vw,15.5dvh),134px)}
.handrow .hc + .hc{margin-left:-12px}
.endbig{display:flex;align-items:center;gap:8px;background:var(--gold);color:#1a1206;border:3px solid #1b1b1b;border-radius:14px;padding:10px 22px;font:800 18px var(--f-d);cursor:pointer;box-shadow:0 5px 0 #1b1b1b;margin-bottom:8px;white-space:nowrap}
.endbig svg{width:20px;height:20px}
.endbig:active{transform:translateY(3px);box-shadow:0 2px 0 #1b1b1b}
.endbig:disabled{background:#3a3344;color:#ffffff70;box-shadow:none;cursor:default}
.endbig.glow{animation:pulse 1.1s infinite}
.mbar{display:none}
@media (max-width:760px){
  .half{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:4px}
  .half.me{grid-template-rows:minmax(0,1fr) auto}
  .half.me .mbar{order:2}
  .half.opp .mbar{order:-1}
  .lifecol,.sidecol{display:none}
  .mbar{display:flex}
  .phases{display:none}
  .hint .long{display:none}
  .lane.chars .row{padding:0 8px}
  .lane.chars .mini{--w:min(130px,calc((100cqh - 14px) * .716),calc((100cqw - 20px) / max(var(--n,5),2.4) - 6px))}
  .maxb{display:none}
  .endbig{padding:8px 14px;font-size:15px}
  .handrow .hc{width:clamp(60px,19vw,96px)}
}

/* ---------- phase 3 effects ---------- */
.pt{position:absolute;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);animation:pt .7s ease-out forwards}
@keyframes pt{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0}}
.pt.up{width:9px;height:9px;opacity:0;animation:ptup 1.2s ease-out forwards}
@keyframes ptup{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-110px) scale(1.2)}}
.runes{position:absolute;width:160px;height:160px;transform:translate(-50%,-50%);animation:runes .9s ease-out forwards}
.runes svg{width:100%;height:100%;animation:spin 1.2s linear infinite}
@keyframes runes{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
.tornado{position:absolute;width:120px;height:170px;transform:translate(-50%,-60%);animation:fadeio .9s forwards}
.tornado i{position:absolute;left:50%;border:4px solid #e6f6ff;border-radius:50%;transform:translateX(-50%);box-shadow:0 0 12px #bfe9ff;animation:tw .3s linear infinite}
@keyframes tw{50%{transform:translateX(-35%) scaleX(.85)}}
.rope{position:absolute;height:6px;width:150px;transform:translate(-50%,-50%);border-radius:3px;background:repeating-linear-gradient(90deg,#c08a4a 0 6px,#7a4f1c 6px 12px);box-shadow:0 2px 0 #1b1b1b;animation:rope .9s ease-out forwards}
@keyframes rope{0%{width:0}30%{width:150px}80%{opacity:1}100%{width:150px;opacity:0}}
.stars{position:absolute;transform:translate(-50%,-50%);font:800 24px var(--f-d);color:#ffd23d;text-shadow:0 0 8px #000;white-space:nowrap;animation:spinfade .95s ease-out forwards}
@keyframes spinfade{0%{opacity:0;transform:translate(-50%,-50%) rotate(0)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-110%) rotate(360deg)}}
.fly{position:absolute;width:12px;height:12px;border-radius:50%;background:#8dff9e;box-shadow:0 0 14px #8dff9e;transform:translate(-50%,-50%)}
.claw{position:absolute;height:8px;border-radius:4px;background:linear-gradient(90deg,transparent,#ff5a3c,#fff,transparent);box-shadow:0 0 14px #ff5a3c;transform:translate(-50%,-50%) rotate(55deg);animation:slash .45s ease-out forwards}
.locban{position:absolute;transform:translate(-50%,-50%);font:800 clamp(20px,4vw,34px) var(--f-d);color:#fff;text-shadow:0 3px 0 #000,0 0 18px #000;white-space:nowrap;animation:showc 1.05s ease-out forwards}
.vign{position:absolute;inset:0;box-shadow:inset 0 0 140px 40px #ff2a2aaa;animation:fadeio .6s forwards}
#app.bigshake{animation:shake .45s}
.conf{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:conf linear forwards}
@keyframes conf{to{transform:translateY(112vh) rotate(720deg)}}
.flycard{position:absolute;width:62px;transform:translate(-50%,-50%)}
.say{position:absolute;max-width:230px;background:#fff;color:#1b1b1b;border:3px solid #1b1b1b;border-radius:16px;padding:8px 13px;font:800 15px/1.45 var(--f-d);box-shadow:0 5px 0 #1b1b1b;animation:say 2.3s ease-out forwards}
.say.l{transform:translate(calc(-100% - 58px),-50%)}
.say.r{transform:translate(50px,-50%)}
@keyframes say{0%{opacity:0}10%{opacity:1}85%{opacity:1}100%{opacity:0}}
.setlist{display:flex;flex-direction:column;gap:8px;width:100%}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#ffffff10;border:1px solid #ffffff22;border-radius:12px;padding:12px 16px;font:700 15px var(--f-d);cursor:pointer}
.setrow b{background:#ffffff1a;border-radius:999px;padding:3px 12px;white-space:nowrap}
.setrow b.on{background:var(--gold);color:#1a1206}
.menu .btn2{margin-top:-6px}

/* ---------- skill keywords ---------- */
.kw-kt,.kw-kk,.kw-tr{display:inline-block;color:#fff;font-weight:800;border-radius:.9cqw;padding:0 1.1cqw;margin:0 .3cqw;line-height:1.45;
  border:.35cqw solid #1b1b1b;-webkit-text-stroke:0;text-shadow:none;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.kw-kt{background:#1f9d6b}
.kw-kk{background:#d0342c}
.kw-tr{background:#6b3fb0}
.kw-kn{font-weight:800}
.kw-up{color:#0b7a3b;font-weight:800}
.kw-dn{color:#c0261c;font-weight:800}
.kw-hp{color:#d02c69;font-weight:800}
.kw-dr{color:#1d5fc4;font-weight:800}
.kw-dm{color:#c25200;font-weight:800}

/* ---------- alt art (ອາດພິເສດ): borderless, holo, text right on the picture ---------- */
.card.alt{background:#fbf8f1}
.card.alt .face{top:2cqw;left:2cqw;right:2cqw;bottom:2cqw;border-radius:3.4cqw;box-shadow:none}
.card.alt .panel{background:none;border:0;bottom:23cqw;padding:3.4cqw 1cqw 0}
.card.alt .skill{color:#111;font-weight:700;font-size:3.7cqw;line-height:1.6;-webkit-text-stroke:.9cqw #fff;paint-order:stroke fill;text-shadow:0 0 1.4cqw #fffc}
.card.alt .namebox{background:linear-gradient(90deg,#fff7e2e6,#fff7e273 75%,#fff7e200);border:0;justify-content:flex-start;padding-left:3cqw;text-shadow:0 0 .6cqw #fff,0 0 .6cqw #fff}
.card.alt .bottom{bottom:5.2cqw}
.card.alt::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;mix-blend-mode:color-dodge;opacity:.24;
  background:radial-gradient(circle at 20% 30%,#fff 0 .6px,transparent 1.2px) 0 0/10px 10px,repeating-linear-gradient(115deg,#ff3d6e 0%,#ffd23d 6%,#3dffa2 12%,#3dc5ff 18%,#b13dff 24%,#ff3d6e 30%);
  background-size:10px 10px,300% 300%;animation:holo 5s linear infinite}
.altbadge{position:absolute;z-index:2;top:21cqw;left:2.6cqw;background:linear-gradient(135deg,#fff3b0,#e5a823);color:#3a2402;border:.5cqw solid var(--line);border-radius:1cqw;font:800 2.6cqw/1.5 var(--f-d);padding:0 1.6cqw}
.mini.altm{border-color:#fff8dc;box-shadow:0 0 0 2px #e5a823,0 0 18px #ffd23d99,0 6px 14px #0009}
.mini.altm::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:color-dodge;opacity:.28;
  background:repeating-linear-gradient(115deg,#ff3d6e 0%,#ffd23d 6%,#3dffa2 12%,#3dc5ff 18%,#b13dff 24%,#ff3d6e 30%);background-size:300% 300%;animation:holo 5s linear infinite}
.mini.altm.can{box-shadow:0 0 0 2px var(--good),0 0 18px var(--good)}
.toast.alt{background:linear-gradient(135deg,#fff3b0,#e5a823);color:#3a2402;border-color:#1b1b1b;font-size:16px}

/* ---------- field shows the whole card, not a thumbnail ---------- */
.mini{border:0!important;background:none;overflow:visible;border-radius:4.4%/3.2%}
.mini > .card{width:100%;box-shadow:0 6px 14px #0009}
.mini .kw{z-index:4;top:calc(var(--w) * .25)}
.mini .st{z-index:4;top:30%}
.mini.altm::after{display:none}
.mini .card .num.up{color:#0b7a3b}
.mini .card .num.down{color:#c0261c}
.mini .card .power .num.up{background:#c9f5d8}
.mini .card .power .num.down{background:#ffd6cf}

/* ---------- phase 4: card book, stats, tutorial ---------- */
.mrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:-6px}
.btn2.hl{background:var(--gold);color:#1a1206;border-color:var(--gold);animation:pulse 1.2s infinite}
.book{height:100%;overflow-y:auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bookhead{max-width:1100px;margin:0 auto 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bookhead h2{margin:0;font:800 24px var(--f-d);flex:1}
.bookhead .cnt2{color:var(--dim);font:700 14px var(--f-d)}
.tabs{max-width:1100px;margin:0 auto 16px;display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:#ffffff10;border:1px solid #ffffff24;border-radius:999px;padding:7px 14px;font:700 14px var(--f-d);cursor:pointer}
.tabs button.on{background:var(--gold);color:#1a1206;border-color:var(--gold)}
.bgrid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,42vw),1fr));gap:14px}
.bcell{cursor:pointer;transition:transform .15s}
.bcell:hover{transform:translateY(-4px)}
.bcell small{display:block;text-align:center;color:var(--dim);font:700 12px var(--f-d);margin-top:4px}
.locked{aspect-ratio:63/88;border-radius:4.4%/3.2%;border:2px dashed #ffffff30;display:grid;place-items:center;text-align:center;color:#ffffff60;font:800 14px/1.5 var(--f-d);padding:10px;
  background:repeating-linear-gradient(45deg,#ffffff06 0 10px,transparent 10px 20px)}
.locked b{display:block;font-size:42px;color:#ffffff40}
.stattbl{width:100%;border-collapse:collapse;font:700 15px var(--f-d)}
.stattbl th,.stattbl td{padding:8px 10px;border-bottom:1px solid #ffffff18;text-align:left}
.stattbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.stattbl th{color:var(--dim);font-size:13px}
.tut{position:fixed;z-index:45;left:50%;top:calc(58px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(560px,calc(100% - 32px));
  display:flex;gap:12px;align-items:flex-start;background:#fffdf6;color:#1b1b1b;border:3px solid #1b1b1b;border-radius:18px;padding:12px 14px;box-shadow:0 6px 0 #1b1b1b,0 20px 40px #000a}
.tut .face2{flex:none;width:58px;height:58px;border-radius:50%;overflow:hidden;border:3px solid var(--gold);box-shadow:0 0 0 2px #1b1b1b}
.tut .face2 img{width:100%;height:100%;object-fit:cover;object-position:50% 10%}
.tut .tx{flex:1;min-width:0}
.tut b.who2{display:block;font:800 13px var(--f-d);color:#2f6b1e}
.tut p{margin:2px 0 8px;font:700 15px/1.6 var(--f-d)}
.tut .tb{display:flex;gap:8px;justify-content:flex-end}
.tut .tb button{border:2px solid #1b1b1b;border-radius:999px;padding:5px 14px;font:800 14px var(--f-d);cursor:pointer;background:var(--gold);color:#1a1206}
.tut .tb button.sk{background:#fff}

/* ---------- duel board v3: card info panel left, engraved stone field, plates and a turn badge ---------- */
.duel{height:100%;display:grid;grid-template-columns:minmax(0,270px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:14px;

.dpanel .dlore{margin:0;font-size:13px;line-height:1.6;color:var(--dim);font-style:italic}

.dmain{position:relative;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:6px}

.hexav img{width:52px;height:56px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);object-fit:cover;object-position:50% 12%}
.plate .pn{font:800 13px var(--f-d);color:var(--dim);letter-spacing:.04em}
.plate .pl{display:flex;align-items:baseline;gap:6px;font:800 30px/1 var(--f-d);color:#fff;font-variant-numeric:tabular-nums}

.plate .pm{display:flex;align-items:center;gap:6px;margin-top:3px}

.obacks{display:flex;padding-left:10px}

.ebanner{flex:1;min-width:0;background:#0b1430d9;border:1px solid #9fc4ff55;border-radius:10px;padding:7px 12px;font:700 13px/1.5 var(--f-d);color:#e6eeff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;text-align:left}
.dbtns{display:flex;gap:8px;margin-left:auto}

.rbtn svg{width:22px;height:22px}

.dmain,.boardwrap{min-width:0}
.boardwrap{position:relative;min-height:0;display:grid;place-items:center;perspective:1500px;container-type:size}
.plane{position:relative;width:min(100cqw - 70px,100cqh * 1.31);aspect-ratio:8.6/6.6;display:grid;grid-template-rows:1fr 1fr 22px 1fr 1fr;gap:6px;padding:10px 12px;border-radius:18px;
  transform:rotateX(14deg);transform-origin:50% 62%;

    repeating-linear-gradient(45deg,#0000 0 46px,#d9b25a14 46px 48px),repeating-linear-gradient(-45deg,#0000 0 46px,#d9b25a14 46px 48px),
    radial-gradient(ellipse at 50% 50%,#8a6a42,#5a4128 70%,#3e2c1a);
  box-shadow:0 0 0 3px #d9b25a,0 0 0 9px #2a1c10,0 0 0 11px #d9b25a88,0 30px 60px #000c}

.srow{position:relative;display:grid;grid-template-columns:repeat(7,auto);justify-content:center;gap:8px;min-height:0}

  border:2px solid #f2d48a66;background:
    linear-gradient(45deg,#0000 47%,#f2d48a2e 48% 52%,#0000 53%),linear-gradient(-45deg,#0000 47%,#f2d48a2e 48% 52%,#0000 53%),#0000002e}

.tile.mz{border-color:#8fc2ff66;background-color:#2f63c42e}
.tile.loc.has::after{display:none}
.tile > .card{position:absolute;inset:0;width:100%}
.srow .tile > .mini{position:absolute;inset:0;width:100%;--w:100cqw}
.srow.lane.chars{background:none;box-shadow:none;overflow:visible;container-type:normal;border-radius:0}

.tile.pile .cback{position:absolute;inset:0}
.tile .cnt{position:absolute;top:-8px;right:-8px;z-index:3}
.mini .pwtop{position:absolute;left:50%;top:0;transform:translate(-50%,-105%);z-index:5;font:800 calc(var(--w) * .3)/1 var(--f-d);color:#fff;-webkit-text-stroke:calc(var(--w) * .035) #1b1b1b;paint-order:stroke fill;pointer-events:none;font-variant-numeric:tabular-nums}

.cline{position:relative;display:flex;align-items:center;justify-content:center}
.cline::before{content:"";position:absolute;left:4%;right:4%;top:50%;height:2px;background:linear-gradient(90deg,#0000,#ffd23d,#0000)}
.cline span{position:relative;font:800 12px var(--f-d);color:#ffd23d;background:#3e2c1a;padding:0 10px;border-radius:999px;border:1px solid #ffd23d88}
.sidebox.hasloc{display:contents}
.locbg{position:absolute;border-radius:12px;background-size:cover;background-position:center;opacity:.42;pointer-events:none;mix-blend-mode:luminosity}
.phex{position:absolute;right:-4px;top:50%;transform:translateY(-50%);width:104px;height:116px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:linear-gradient(160deg,#ffd970,#b8261f 55%,#6e1410);display:grid;place-items:center;text-align:center;z-index:6;border:0;padding:0;cursor:default}

.phex > *{position:relative}
.phex small{display:block;font:800 12px var(--f-d);color:#ffe48a}
.phex b{display:block;font:800 18px/1.25 var(--f-d);color:#fff}
.phex.go{cursor:pointer;background:linear-gradient(160deg,#fff3a0,#f2b632 55%,#a8740f)}
.phex.go::before{background:linear-gradient(160deg,#f2b632,#c8860f)}
.phex.go b{color:#1a1206}
.phex.go small{color:#5a3a05}
.phex.go.glow{animation:pulse 1.1s infinite}
.phex:disabled{cursor:default}
.tprompt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;display:flex;gap:10px;align-items:center;background:#000000d9;border:2px solid #ffd23d;border-radius:999px;padding:8px 16px}

  .plane{transform:none;width:100%;height:auto;aspect-ratio:auto;grid-template-rows:auto auto 18px auto auto;gap:4px;padding:6px 6px 6px 6px}
  .srow{grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
  .tile{height:auto;width:100%}

  .dtop,.dbot{min-height:0;gap:6px}
  .dbot{flex-wrap:wrap}
  .duel .hand{order:3;flex:1 1 100%;padding:14px 4px 2px}
  .duel .hand .hc{width:clamp(56px,18vw,90px)}
  .duel .hand .hc + .hc{margin-left:-10px}
  .plate{padding:3px 10px 3px 3px}
  .hexav{width:42px;height:46px}.hexav img{width:37px;height:41px}
  .plate .pl{font-size:22px}
  .ebanner{display:none}
  .rbtn{width:36px;height:36px}.rbtn svg{width:18px;height:18px}
  .obacks .cback{width:22px;margin-left:-9px}
}

  background:radial-gradient(circle,#3a0b08 0 54%,#e2b54a 55% 58%,#0000 59%),repeating-conic-gradient(#e2b54a 0 11.25deg,#a8740f 11.25deg 22.5deg);box-shadow:0 8px 20px #000c}
.medal span{display:block;font:800 12px var(--f-d);color:#f2d48a}
.medal b{display:block;font:800 19px/1.2 var(--f-d);color:#fff}
.medal.go{cursor:pointer;background:radial-gradient(circle,#f8d77a 0 54%,#7a1611 55% 58%,#0000 59%),repeating-conic-gradient(#ffe48a 0 11.25deg,#c8860f 11.25deg 22.5deg)}
.medal.go span{color:#6e1712}.medal.go b{color:#3a0b08}
.medal.go.glow{animation:pulse 1.1s infinite}
.medal:focus-visible{outline:3px solid #fff;outline-offset:3px}
.fan{position:relative;--cw:clamp(70px,min(9.5vw,16dvh),150px);height:calc(var(--cw) * 1.4 + 44px);container-type:inline-size}
.arena .fan.hand{display:block;overflow:visible;padding:0}
.arena .fan .hc{position:absolute;left:50%;bottom:26px;width:var(--cw);margin:0;--o:calc(var(--i) - (var(--n) - 1) / 2);--lift:0px;
  --step:min(calc(var(--cw) * .82),calc((100cqw - var(--cw) - 24px) / max(var(--n) - 1, 1)));
  transform:translateX(calc(-50% + var(--o) * var(--step))) translateY(calc(var(--o) * var(--o) * 2.4px + var(--lift))) rotate(calc(var(--o) * 2.4deg))!important;
  transform-origin:50% 140%;transition:transform .15s}
.arena .fan .hc.ok{--lift:-12px}
.arena .fan .hc:hover{--lift:-30px;z-index:20}
.arena .fan.hidden{visibility:hidden}
.btns2{display:flex;gap:8px;align-items:center}
.gbtn{width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:radial-gradient(circle at 35% 30%,#7a1a14,#3a0b08);box-shadow:inset 0 0 0 1.5px #e2b54a,0 4px 10px #0009}
.gbtn svg{width:20px;height:20px}
.gbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.tprompt2{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;display:flex;gap:10px;align-items:center;background:#0b0404ee;border:2px solid #e2b54a;border-radius:999px;padding:8px 16px;white-space:nowrap}
.tprompt2 b{font:800 15px var(--f-d);color:#f2d48a}
/* the cancel button must read on every board theme (light ones made the see-through button almost vanish) */
.tprompt2 .btn2,.arena[data-theme] .tprompt2 .btn2{background:linear-gradient(#e0463a,#b8261f);border:1.5px solid #fff9;color:#fff;font:800 14px var(--f-d);padding:7px 16px;box-shadow:0 2px 0 #6e1712,0 0 0 1px #6e1712;text-shadow:0 1px 0 #0006}
.tprompt2 .btn2:hover{filter:brightness(1.1)}
@media (max-width:760px){
  .arena{gap:4px}
  .band{gap:8px}
  .band.top{grid-template-columns:minmax(0,1fr);grid-template-areas:"ofan" "plate";gap:10px}
  .band.top .ofan{grid-area:ofan}.band.top .lplate{grid-area:plate;justify-self:start}
  .band.bot{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"plate btns" "fan fan"}
  .band.bot .lplate{grid-area:plate;justify-self:start}.band.bot .btns2{grid-area:btns}.band.bot .fan{grid-area:fan}
  .piles2{display:none}
  .lplate{padding:3px 12px 3px 3px;gap:7px}
  .lplate .lav{width:38px;height:38px}
  .lplate .llife{font-size:20px}.lplate .llife svg{width:15px;height:15px}
  .lplate .lnm{font-size:10px}
  .field2{padding:8px;grid-template-rows:minmax(0,1fr) 36px minmax(0,1fr)}
  .half2{gap:6px}
  .arena .lane.chars .row{padding:0 4px;gap:4px}
  .arena .lane.chars .mini{--w:min(150px,calc((100cqh - 26px) * .716),calc((100cqw - 20px) / 5.15))}
  .medal{width:64px;height:64px;right:-4px}.medal span{font-size:9px}.medal b{font-size:14px}
  .mid2 .logb{display:none}
  .gbtn{width:36px;height:36px}.gbtn svg{width:17px;height:17px}
  .fan{--cw:clamp(56px,19vw,110px)}
  .ofan{--ow:clamp(44px,14vw,84px)}
}

.arena[data-theme]{background:var(--a-bg)}
.arena[data-theme] .field2{background:var(--cTL) no-repeat 6px 6px/46px,var(--cTR) no-repeat right 6px top 6px/46px,var(--cBL) no-repeat left 6px bottom 6px/46px,var(--cBR) no-repeat right 6px bottom 6px/46px,var(--f-bg);
  box-shadow:0 0 0 2px var(--ring),0 0 0 6px var(--gap),0 0 0 7px var(--ring2),0 22px 50px #0009}
.arena[data-theme] .lane.chars{background:var(--lane-bg);border-color:var(--lane-line)}
.arena[data-theme] .lane.chars.hasloc{background:linear-gradient(#0000004d,#0000004d),var(--locimg) center/cover;border-color:var(--ring)}
.arena[data-theme] .lane.chars .wm{color:var(--wm)}
.arena[data-theme] .slot{border-color:var(--slot-line);background:var(--slot-bg)}
.arena[data-theme] .slot::after{color:var(--slot-ink)}
.arena[data-theme] .lplate{background:var(--plate-bg);box-shadow:inset 0 0 0 1.5px var(--ring),0 6px 16px #0007}
.arena[data-theme] .lplate .lav{box-shadow:0 0 0 3px var(--ring)}
.arena[data-theme] .lplate .lnm{color:var(--soft)}
.arena[data-theme] .lplate .llife{color:var(--plate-ink)}
.arena[data-theme] .mid2::before{background:linear-gradient(90deg,#0000,var(--ring) 20%,var(--ring) 80%,#0000)}
.arena[data-theme] .mid2 .tchip2{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.arena[data-theme] .mid2 .tchip2.bot{background:var(--plate-bg);color:var(--soft);box-shadow:inset 0 0 0 1.5px var(--ring)}
.arena[data-theme] .mid2 .logb{background:var(--log-bg);border-color:var(--ring);color:var(--log-ink)}
.arena[data-theme] .medal{background:var(--medal)}
.arena[data-theme] .medal span{color:var(--mk1)}
.arena[data-theme] .medal b{color:var(--mk2)}
.arena[data-theme] .medal.go{background:var(--medal-go)}
.arena[data-theme] .medal.go span{color:var(--gk1)}
.arena[data-theme] .medal.go b{color:var(--gk2)}
.arena[data-theme] .gbtn{background:var(--btn-bg);box-shadow:inset 0 0 0 1.5px var(--ring),0 4px 10px #0006}
.arena[data-theme] .ofan .ocnt{background:var(--log-bg);color:var(--log-ink);border-color:var(--ring)}
.arena[data-theme] .pile2 small{color:var(--soft)}
.arena[data-theme="sinh"] .pile2 small{color:#2c3e8f}
.arena[data-theme] .tprompt2{background:var(--log-bg);border-color:var(--ring)}
.arena[data-theme] .tprompt2 b{color:var(--log-ink)}
.themes{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.thb{display:flex;flex-direction:column;align-items:center;gap:6px;background:#ffffff0d;border:2px solid #ffffff22;border-radius:14px;padding:8px 10px;cursor:pointer;font:700 13px var(--f-d);color:var(--ink)}
.thb.on{border-color:var(--gold);background:#f2b6321f}
.thb i{display:block;width:96px;height:58px;border-radius:9px;box-shadow:inset 0 0 0 2px #0004}
.thb[data-v="mekong"] i{background:radial-gradient(circle at 70% 40%,#7fe0ff 0 8px,#0000 9px),linear-gradient(160deg,#0f5a73,#03141f)}

@keyframes pshake{0%,100%{transform:rotate(0)}20%{transform:rotate(-3deg) scale(1.02)}40%{transform:rotate(3deg)}60%{transform:rotate(-2deg) scale(1.03)}80%{transform:rotate(2deg)}}

/* ---------- foil booster packs ---------- */
.booster{--bink:#fff;--bsh:#000c;position:relative;width:132px;aspect-ratio:5/8;margin:4px auto;filter:drop-shadow(0 12px 18px #000a);transition:transform .2s}
.pack:hover .booster{transform:translateY(-6px) rotate(-2deg)}
.booster.pk-deck{--bink:#16245e;--bsh:#ffffffb0}
.booster.pk-gold{--bink:#4a2f04;--bsh:#fff3b0b0;filter:drop-shadow(0 12px 18px #000a) drop-shadow(0 0 14px #ffd23d55)}
.bpack{position:absolute;inset:0;width:100%;height:100%;display:block}
/* deck pack: the blank pack has a see-through window; the deck's legend sits behind it and its cutout steps out over the frame */
.bwin{position:absolute;left:11.5%;right:11.5%;top:28%;height:51%;overflow:hidden;background:#101c50}
.bwin img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.bwin::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 35% 25%,#ffffff38,transparent 40%),radial-gradient(ellipse at 50% 50%,transparent 55%,#0a144099 80%)}
.bcut{position:absolute;left:8%;width:84%;top:13%;height:62%;object-fit:contain;object-position:50% 100%;pointer-events:none;filter:drop-shadow(0 4px 6px #000a)}
/* the strip that tears off: the same picture, cut at the crimp line */
.btear{position:absolute;inset:0;background:var(--pk) 0 0/100% 100%;clip-path:inset(0 0 88% 0)}
.blogo{position:absolute;left:28%;width:44%;top:4.5%;filter:drop-shadow(0 2px 3px #0009)}
.bband{position:absolute;left:20%;right:20%;top:75.4%;height:7.6%;display:grid;place-items:center;text-align:center;color:var(--bink);text-shadow:0 1px 1px var(--bsh)}
.bband b{font:800 11px/1 var(--f-d);white-space:nowrap}
.bband small{position:absolute;left:-20%;right:-20%;top:calc(100% + 3px);font:700 9px var(--f-d);color:#fff;text-shadow:0 1px 2px #000,0 0 6px #000}
.bshine{position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,#ffffff70 50%,transparent 60%) 0 0/250% 100%;animation:bshine 3.2s ease-in-out infinite;mix-blend-mode:overlay;
  -webkit-mask:var(--pk) 0 0/100% 100%;mask:var(--pk) 0 0/100% 100%}
@keyframes bshine{0%,55%{background-position:120% 0}100%{background-position:-20% 0}}
.booster.big{width:min(240px,58vw)}
.booster.big .bband b{font-size:19px}.booster.big .bband small{font-size:13px}
/* starter-deck boxes; other decks use the blank box with their legend in the window */
.dbox{position:relative;display:block;width:100%;aspect-ratio:3/4;filter:drop-shadow(0 8px 14px #000a)}
.dbox > img{position:absolute;inset:0;width:100%;height:100%;display:block}
.dbox .dbwin{left:24.5%;top:30.5%;width:43%;height:39%;object-fit:cover;object-position:50% 18%;border-radius:46% 46% 18% 18% / 30% 30% 12% 12%;box-shadow:inset 0 0 0 2px #e2b54a}
.dbox .dblogo{left:var(--ll,24%);top:var(--lt,7%);width:var(--lw,40%);height:auto;filter:drop-shadow(0 2px 3px #0009)}
.dbox b{position:absolute;left:var(--rl);right:var(--rr);top:var(--rt);height:6%;display:grid;place-items:center;font:800 clamp(8px,6cqw,15px)/1 var(--f-d);color:#4a2f04;text-shadow:0 1px 1px #fff3b0b0;white-space:nowrap;overflow:hidden}
.dbox{container-type:inline-size}
.dpk .dbox b,.dpk .dbox .dblogo{display:none}
.shophero{display:block;width:min(300px,70%);margin:-6px auto -14px;filter:drop-shadow(0 14px 22px #000a)}
.bigwrap{cursor:pointer;animation:pshake 1s ease-in-out infinite}
.bigwrap.tearing{animation:none}
.bigwrap.tearing .btear{animation:ptear .6s ease-in forwards}
.bigwrap.tearing .bpack{clip-path:inset(12% 0 0 0)}
.bigwrap.tearing .blogo{opacity:0;transition:opacity .15s}
.bigwrap.tearing .booster{animation:pdrop .7s .2s ease-in forwards}
@keyframes ptear{to{transform:translate(40px,-120px) rotate(18deg);opacity:0}}
@keyframes pdrop{30%{transform:scale(1.06);filter:drop-shadow(0 0 40px #ffe48a)}100%{transform:translateY(60px) scale(.9);opacity:0}}
.ptip2{margin:0;font:800 16px var(--f-d);color:#f2d48a;text-shadow:0 2px 6px #000}
.freebar .fbmini{width:56px;flex:none}.freebar .fbmini .booster{width:56px;margin:0}.freebar .fbmini .bband,.freebar .fbmini .blogo{display:none}
.freebar b{flex:1}
/* ---------- decks 11-12: traps, shield, idol frame and fans ---------- */
.card.trap{--edge:linear-gradient(160deg,#9b59d0,#5b2a86 55%,#3a1660);--tag:#6b3fb0}
/* special cards get their own frames: fusion is emerald with a gold rim, ritual is pearl and sky blue with candle gold */
.card.fusion{--edge:linear-gradient(150deg,#ffe48a,#2fd08a 18%,#0f8a6a 52%,#075a46 80%,#ffe48a);--tag:#0f8a6a;box-shadow:0 0 0 1px #ffe48aaa,0 0 16px #2fd08a77,0 6px 16px #0009}

.trapsnap{position:absolute;width:min(190px,42vw);transform:translate(-50%,-50%);pointer-events:none;perspective:800px;animation:tsin 1.05s ease both}

.trapsnap .tsb,.trapsnap .tsc{position:absolute;inset:0;backface-visibility:hidden}.trapsnap .tsb .cback,.trapsnap .tsb img{display:block;width:100%;height:100%;border-radius:6%}

.trapsnap .chain{position:absolute;left:-30%;right:-30%;top:40%;height:12px;border-radius:6px;background:repeating-linear-gradient(90deg,#d9d2c3 0 14px,#6d665c 14px 17px,#b4ab9c 17px 30px,#6d665c 30px 33px);
  box-shadow:0 2px 6px #000a;transform:scaleX(0);animation:tschain .3s .38s cubic-bezier(.3,1.6,.6,1) both}

.trapsnap .snap{position:absolute;left:50%;top:-18%;transform:translateX(-50%);font:900 clamp(26px,6vw,44px)/1 var(--f-d);color:#fff;-webkit-text-stroke:3px #3a1660;paint-order:stroke fill;text-shadow:0 0 18px #b06bff;animation:tssnap .5s .4s cubic-bezier(.2,1.8,.4,1) both}

.locwipe .locedge{position:absolute;top:0;bottom:0;right:0;width:24px;background:linear-gradient(90deg,transparent,#fff,transparent);filter:blur(2px);opacity:.9}
.card .xtype{position:absolute;left:50%;top:2.2%;transform:translateX(-50%);z-index:3;white-space:nowrap;font:800 6.2cqw/1.4 var(--f-d);color:#fff;padding:0 3.5cqw;border-radius:99px;
  box-shadow:0 0 0 .6cqw #fff8,0 1cqw 2cqw #0006}

.festchip{display:flex;align-items:center;gap:8px;background:linear-gradient(100deg,#fff6dc,#ffe2a6);color:#5a3a00;border-radius:14px;padding:6px 10px;box-shadow:0 0 0 1.5px #e0a52e,0 4px 10px #0003;font:700 12px/1.35 var(--f-d);text-align:left}

function baseDeckOf(list){

  DECKS.forEach((d, i) => { let s = 0; for(const id in list) if(!NEUTRAL.has(id) && d.list[id]) s += Math.min(list[id], d.list[id]); if(s > bs){ bs = s; best = i; } });

function autoFill(list){
  let guard = 0; const goal = Math.max(RULE.min, listTotal(list));
  while(listTotal(list) < goal && guard++ < 120){
    const cands = Object.keys(C).filter(id => !addBlock(list, id)); if(!cands.length) break;
    const base = DECKS[baseDeckOf(list)].list, t = deckTribes(list), cv = costCurve(list), want = [0,2,5,5,5,4,3,4];
    const id = maxBy(cands, x => (base[x] ? 5 : 0) + (t.has(C[x].tribe) ? 3 : 0) + (NEUTRAL.has(x) ? .5 : 0) + (want[Math.min(7, C[x].cost)] - cv[Math.min(7, C[x].cost)]) * .6 + Math.random());
    list[id] = (list[id] || 0) + 1;
  }
  return list;
}

/* ---------- sound: everything is synthesized, no audio files (the music engine is below sfx) ---------- */
const SND = {ctx:null, sfx:null, mus:null, timer:null};
function audioInit(){
  if(SND.ctx){ if(SND.ctx.state === 'suspended') SND.ctx.resume(); return; }
  try{
    const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    SND.ctx = new AC(); const m = SND.ctx.createGain(); m.gain.value = .55; m.connect(SND.ctx.destination);
    SND.sfx = SND.ctx.createGain(); SND.sfx.connect(m);
    SND.mus = SND.ctx.createGain(); SND.mus.gain.value = MUS.vol; SND.mus.connect(m);
    musicBus(SND.ctx, SND.mus); audioVol();
  }catch(e){ SND.ctx = null; }
}
// the two volume sliders in the settings (0–1): the music level the ducking returns to, and the effects bus
function audioVol(){
  MUS.vol = .28 * SET.mvol; if(!SND.ctx) return; const t = SND.ctx.currentTime;
  SND.mus.gain.cancelScheduledValues(t); SND.mus.gain.setTargetAtTime(MUS.vol, t, .03); SND.sfx.gain.setTargetAtTime(SET.svol, t, .03);
}
// a sleeping tab makes no sound (and the music does not rush to catch up when it wakes)
document.addEventListener('visibilitychange', () => { if(!SND.ctx) return; if(document.hidden) SND.ctx.suspend(); else SND.ctx.resume(); });
function tone(f, dur, type, vol, dest, t0, slide){
  const c = SND.ctx, t = t0 || c.currentTime, o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if(slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol || .3, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(dest || SND.sfx); o.start(t); o.stop(t + dur + .05);
}
// a noise sweep: the filter glides from f0 to f1 while it swells and fades (paper, whooshes, wind, fizz)
function sweep(t, dur, f0, f1, type, vol, dest, q){
  const c = SND.ctx, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); src.buffer = SND.nb; src.loop = true;
  f.type = type; f.Q.value = q || 1; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * .3); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(dest); src.start(t, Math.random() * .5); src.stop(t + dur + .02);
}
// every sound is built from the same Lao instruments as the music (ໂປງລາງ, ສິ່ງ, ກອງ, ຄ້ອງ) plus noise for paper, air and water
function sfx(name){
  if(!SND.ctx || !SND.nb || !SET.sfx || (S && (S.fast || S.sim))) return;
  const c = SND.ctx, t = c.currentTime, X = SND.sfx, R = Math.random;
  try{
    switch(name){
      // buttons: a soft wooden tap
      case 'click': if(SND.lastClick != null && t - SND.lastClick < .05) break; SND.lastClick = t; iRanat(t, 1320, .1, X, 0, .07); nsrc(t, .015, 2600, 'bandpass', 2, .11, X); break;
      // cards: a paper swish to draw, a slap with a tiny sparkle to play, a flip with a note to reveal
      case 'draw': sweep(t, .2, 1800, 6500, 'bandpass', .21, X); break;
      case 'play': nsrc(t, .09, 900, 'lowpass', 0, .45, X); tone(150, .16, 'sine', .4, X, t, 60); iRanat(t + .03, pf(7, 880), .05, X, 0, .3); break;
      case 'flip': sweep(t, .12, 2500, 5000, 'bandpass', .17, X); iRanat(t + .04, pf(5, 440), .13, X, 0, .4); break;
      // the fight: a whoosh, a drum punch, a shatter into glassy sparkles
      case 'attack': sweep(t, .28, 500, 2600, 'bandpass', .75, X, 1.5); break;
      case 'hit': iKlong(t, true, .5, X); nsrc(t, .05, 2500, 'highpass', 0, .22, X); tone(90, .18, 'square', .08, X, t, 50); break;
      case 'destroy': nsrc(t, .45, 3500, 'highpass', 0, .2, X); tone(140, .3, 'sine', .35, X, t, 50); for(let i = 0; i < 7; i++) iRanat(t + .02 + i * .04 + R() * .02, 1800 + R() * 2400, .05, X, 0, .25); break;
      // magic: a rising xylophone sparkle; healing chimes; a dark wobble for curses
      case 'spell': [0, 2, 3, 5, 7].forEach((d, i) => iRanat(t + i * .045, pf(d, 880), .1, X, 0, .4)); sweep(t, .5, 3000, 9000, 'highpass', .11, X); break;
      case 'heal': [5, 7, 8, 10].forEach((d, i) => iRanat(t + i * .06, pf(d, 440), .12, X, 0, .8)); tone(1760, .6, 'sine', .03, X, t + .2); break;
      case 'curse': { const f = c.createBiquadFilter(), g = c.createGain(), l = c.createOscillator(), lg = c.createGain(); f.type = 'lowpass'; f.frequency.value = 650; l.frequency.value = 6; lg.gain.value = 9; l.connect(lg);
        g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.12, t + .08); g.gain.exponentialRampToValueAtTime(.0001, t + .9); f.connect(g); g.connect(X);
        for(const fr of [110, 117]){ const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fr; lg.connect(o.frequency); o.connect(f); o.start(t); o.stop(t + .95); } l.start(t); l.stop(t + .95);
        nsrc(t + .35, .35, 900, 'lowpass', 0, .14, X); break; }
      // a bamboo rocket fizzing up, a festival firework with crackles, lightning with rolling thunder
      case 'rocket': sweep(t, .9, 700, 3200, 'bandpass', .56, X, 2); tone(600, .9, 'sine', .1, X, t, 1800); break;
      case 'boom': tone(70, .6, 'sine', .55, X, t, 32); nsrc(t, .5, 600, 'lowpass', 0, .45, X); for(let i = 0; i < 10; i++) nsrc(t + .15 + R() * .6, .03, 3000 + R() * 3000, 'bandpass', 3, .12, X); break;
      case 'thunder': nsrc(t, .12, 2500, 'highpass', 0, .45, X); nsrc(t + .05, 1.4, 260, 'lowpass', 0, .55, X); tone(55, 1, 'sine', .3, X, t + .05, 35); break;
      // the naga's river: a big splash and drops
      case 'splash': nsrc(t, .5, 1800, 'bandpass', .8, .35, X); for(let i = 0; i < 6; i++){ const f0 = 800 + R() * 900; tone(f0, .08, 'sine', .08, X, t + .1 + R() * .4, f0 * 2); } break;
      // traps: a wooden clack, then a rattling chain
      case 'trip': iKlong(t, true, .45, X); nsrc(t, .02, 3000, 'bandpass', 2, .3, X); for(let i = 0; i < 6; i++) iChing(t + .12 + i * .05, false, .09 - i * .01, X); break;
      case 'wind': sweep(t, .6, 400, 1400, 'bandpass', .5, X, 1.2); sweep(t + .45, .7, 1400, 450, 'bandpass', .4, X, 1.2); break;
      // big moments: a legend's gong (the music steps back), a fusion's two tones rushing together, a rite's gong and temple bells, the baci's small bells
      case 'legend': if(SET.theme === 'watphou'){ musicDuck(1400); iGong(t, .22, X, 0, 110); break; } musicDuck(2400); iGong(t, .3, X, 0, 82); [65, 130].forEach(f => tone(f, 2, 'sine', .16, X, t)); tone(392, 1.5, 'triangle', .08, X, t + .1); break;
      case 'fusion': tone(220, .9, 'triangle', .16, X, t, 440); tone(880, .9, 'triangle', .11, X, t, 440); sweep(t, .9, 400, 4000, 'bandpass', .2, X, 2); break;
      case 'rite': musicDuck(2200); iGong(t, .26, X, 0, 110); [5, 7, 8, 7, 10, 8].forEach((d, i) => iRanat(t + .3 + i * .13, pf(d, 880), .05, X, 0, .9)); break;
      case 'bless': [7, 8, 10, 8, 12].forEach((d, i) => iRanat(t + i * .11, pf(d, 440), .07, X, 0, 1)); iChing(t, true, .05, X); iChing(t + .44, true, .04, X); break;
      // the turn, rewards and results
      case 'turn': [2, 3, 5].forEach((d, i) => iRanat(t + i * .08, pf(d, 440), .16, X)); iChing(t + .16, true, .05, X); break;
      case 'gem': iRanat(t, pf(10, 440), .14, X, 0, .7); iRanat(t + .07, pf(12, 440), .12, X, 0, .9); tone(3520, .5, 'sine', .03, X, t + .1); break;
      case 'coin': for(let i = 0; i < 3; i++){ iRanat(t + i * .06, 2600 + i * 300, .12, X, 0, .2); iChing(t + i * .06, false, .1, X); } break;
      case 'pack': sweep(t, .35, 1500, 5000, 'bandpass', .4, X, 1.5); [0, 2, 3, 5, 7, 10].forEach((d, i) => iRanat(t + .3 + i * .05, pf(d, 880), .09, X, 0, .5)); break;
      case 'reveal': iGong(t, .25, X, 0, 131); [5, 7, 8, 10, 12].forEach((d, i) => iRanat(t + .05 + i * .06, pf(d, 440), .09, X, 0, .7)); tone(3520, .8, 'sine', .03, X, t + .2); break;
      case 'win': [0, 2, 3, 4, 5, 7].forEach((d, i) => iRanat(t + i * .08, pf(d, 440), .18, X)); break;
      case 'lose': [4, 3, 2, 0].forEach((d, i) => iRanat(t + i * .16, pf(d, 440), .14, X, 0, .6)); break;
    }
  }catch(e){}
}
/* ---------- music (phase H): Lao instruments built from oscillators, and a score that follows the match ----------
   ແຄນ chords and drone, ພິນ and ໂປງລາງ melodies, ສິ່ງ cymbals, ກອງ drums and a ຄ້ອງ gong, with a little room reverb.
   menu 76 BPM · battle, winning and losing share 100 BPM and A minor pentatonic (A C D E G), so the mood changes on
   the next bar line without a seam · start, victory and defeat are short pieces played once. */
const MUS = {vol:.28, want:'menu', mood:null, step:0, bar:0, next:0, hold:0, intro:false};
function musicBus(c, out){
  const comp = c.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3; comp.attack.value = .01; comp.release.value = .25; comp.connect(out);
  SND.mbus = c.createGain(); SND.mbus.connect(comp);
  const n = Math.floor(c.sampleRate * 2.2), ir = c.createBuffer(2, n, c.sampleRate);
  for(let ch = 0; ch < 2; ch++){ const d = ir.getChannelData(ch); for(let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3.2); }
  SND.rev = c.createConvolver(); SND.rev.buffer = ir; SND.rev.connect(comp);
  const nb = c.createBuffer(1, c.sampleRate, c.sampleRate), nd = nb.getChannelData(0); for(let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1; SND.nb = nb;
}
// an instrument's output: straight to its bus, plus a share sent to the reverb when it plays in the music
function busTo(dest, wet){ const g = SND.ctx.createGain(); g.connect(dest); if(wet && SND.rev && dest === SND.mbus){ const w = SND.ctx.createGain(); w.gain.value = wet; g.connect(w); w.connect(SND.rev); } return g; }
// a short burst of filtered noise from the shared buffer
function nsrc(t, dur, freq, type, q, vol, dest){
  const c = SND.ctx, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); src.buffer = SND.nb; src.loop = true;
  f.type = type; f.frequency.value = freq; if(q) f.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(dest); src.start(t, Math.random() * .5); src.stop(t + dur + .02);
}
// ແຄນ: a reedy chord, two slightly detuned saws per note through a soft filter, breathing gently
function iKhaen(t, freqs, dur, vol, dest, wet){
  const c = SND.ctx, out = busTo(dest, wet), f = c.createBiquadFilter(), g = c.createGain(), a = Math.min(.12, dur * .25);
  f.type = 'lowpass'; f.frequency.value = 1700; f.Q.value = .8;
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol, t + a); g.gain.setValueAtTime(vol, t + Math.max(a, dur - .12)); g.gain.linearRampToValueAtTime(.0001, t + dur);
  const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 5.2; lg.gain.value = vol * .18; lfo.connect(lg); lg.connect(g.gain);
  f.connect(g); g.connect(out);
  for(const fr of freqs) for(const d of [-5, 5]){ const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fr; o.detune.value = d; o.connect(f); o.start(t); o.stop(t + dur + .05); }
  lfo.start(t); lfo.stop(t + dur + .05);
}
// ພິນ: a plucked lute, bright at the pluck and darkening fast, with a tiny pitch drop
function iPhin(t, fr, vol, dest, wet, len){
  const c = SND.ctx, out = busTo(dest, wet), o = c.createOscillator(), o2 = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain(), g2 = c.createGain(), L = len || .6;
  o.type = 'sawtooth'; o.frequency.setValueAtTime(fr * 1.012, t); o.frequency.exponentialRampToValueAtTime(fr, t + .04); o2.type = 'triangle'; o2.frequency.value = fr * 2; g2.gain.value = .25;
  f.type = 'lowpass'; f.Q.value = 2; f.frequency.setValueAtTime(5200, t); f.frequency.exponentialRampToValueAtTime(fr * 1.6, t + .25);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .006); g.gain.exponentialRampToValueAtTime(vol * .3, t + .12); g.gain.exponentialRampToValueAtTime(.0001, t + L);
  o.connect(f); o2.connect(g2); g2.connect(f); f.connect(g); g.connect(out); for(const x of [o, o2]){ x.start(t); x.stop(t + L + .05); }
}
// ໂປງລາງ / ຄ້ອງວົງ: a struck wooden bar, a sine with the bar's high partials and the mallet's click
function iRanat(t, fr, vol, dest, wet, len){
  const c = SND.ctx, out = busTo(dest, wet), L = len || .45;
  for(const [m, v, d] of [[1, 1, L], [3.93, .28, L * .35], [9.2, .08, L * .15]]){ const o = c.createOscillator(), g = c.createGain(); o.frequency.value = fr * m;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol * v, t + .003); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(out); o.start(t); o.stop(t + d + .03); }
  nsrc(t, .02, 3000, 'bandpass', 1, vol * .25, out);
}
// ສິ່ງ: the small cymbals, an open "ching" that rings or a closed "chap" tick
function iChing(t, open, vol, dest, wet){
  const c = SND.ctx, out = busTo(dest, wet), d = open ? .45 : .06;
  nsrc(t, d, 7800, 'bandpass', 6, vol, out);
  for(const fr of [2960, 4110]){ const o = c.createOscillator(), g = c.createGain(); o.type = 'square'; o.frequency.value = fr; g.gain.setValueAtTime(vol * .06, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(out); o.start(t); o.stop(t + d + .02); }
}
// ກອງ: a barrel drum, a falling sine for the body and a soft thump for the skin
function iKlong(t, hi, vol, dest, wet){
  const c = SND.ctx, out = busTo(dest, wet), o = c.createOscillator(), g = c.createGain(), f0 = hi ? 210 : 120, f1 = hi ? 120 : 52, d = hi ? .22 : .42;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + d * .6);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .004); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + d + .03);
  nsrc(t, .05, hi ? 1800 : 700, 'lowpass', 0, vol * .35, out);
}
// ຄ້ອງ: a big gong, low partials beating slowly against each other and ringing for seconds
function iGong(t, vol, dest, wet, base){
  const c = SND.ctx, out = busTo(dest, wet), b = base || 98;
  for(const [m, v, d] of [[1, 1, 3.2], [1.006, .7, 3], [1.49, .45, 2.2], [2.02, .35, 1.6], [2.76, .18, 1.1], [4.1, .08, .6]]){ const o = c.createOscillator(), g = c.createGain(); o.frequency.value = b * m;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol * v, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(out); o.start(t); o.stop(t + d + .05); }
  nsrc(t, .25, 500, 'lowpass', 0, vol * .4, out);
}
// strings under the band (trembling when the match turns tense)
function iPad(t, freqs, dur, vol, dest, wet, bright, trem){
  const c = SND.ctx, out = busTo(dest, wet), f = c.createBiquadFilter(), g = c.createGain(), a = Math.min(.5, dur * .4);
  f.type = 'lowpass'; f.frequency.value = bright ? 2600 : 1100;
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol, t + a); g.gain.setValueAtTime(vol, t + Math.max(a, dur - .2)); g.gain.linearRampToValueAtTime(.0001, t + dur);
  if(trem){ const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = 7; lg.gain.value = vol * .5; l.connect(lg); lg.connect(g.gain); l.start(t); l.stop(t + dur + .05); }
  f.connect(g); g.connect(out);
  for(const fr of freqs) for(const d of [-7, 7]){ const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fr; o.detune.value = d; o.connect(f); o.start(t); o.stop(t + dur + .05); }
}
// a soft brass note whose filter opens as it swells
function iBrass(t, fr, dur, vol, dest, wet){
  const c = SND.ctx, out = busTo(dest, wet), o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
  o.type = 'sawtooth'; o.frequency.value = fr; f.type = 'lowpass'; f.Q.value = 1; f.frequency.setValueAtTime(fr * 1.5, t); f.frequency.linearRampToValueAtTime(fr * 5, t + .08); f.frequency.linearRampToValueAtTime(fr * 3, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol, t + .05); g.gain.setValueAtTime(vol * .8, t + Math.max(.05, dur - .08)); g.gain.linearRampToValueAtTime(.0001, t + dur);
  o.connect(f); f.connect(g); g.connect(out); o.start(t); o.stop(t + dur + .05);
}
// degree n of A minor pentatonic above a base (220 = A3); a fifth above a root is 3 degrees up
const PENTA = [0, 3, 5, 7, 10];
const pf = (n, base) => { const o = Math.floor(n / 5), i = ((n % 5) + 5) % 5; return (base || 220) * Math.pow(2, o + PENTA[i] / 12); };
const chord = (r, base) => [pf(r, base), pf(r + 3, base), pf(r + 5, base)];
// a melody bar is 8 eighth notes: '=' and '-' are the two degrees below the base, '0'–'9' then 'x', 'y' go up, '.' is a rest;
// a note rings until the next one
const MD = '=-0123456789xy';
function mel(line, s, t, B, fn){ const ch = line[s]; if(!ch || ch === '.') return; let n = 1; while(s + n < line.length && line[s + n] === '.') n++; fn(MD.indexOf(ch) - 2, t, n * B); }
const BAT = {a:['0.234.32', '0.-02...', '4.543.23', '2.0.0...'], b:['5457.43.', '43234...', '23454320', '1.2.0...'], ra:[0, -1, 1, 0], rb:[2, 1, -1, 0]};
const LOSE = {a:['0..10.-.', '0...=...', '2..32.0.', '1...0...'], b:['3..43.2.', '2...1...', '0.1.2.3.', '2...0...'], ra:[0, 0, -1, 0], rb:[1, -1, 0, 0]};
const MENU = {m:['2...3.4.', '3.......', '4.5.4.32', '2.......', '0...2.3.', '2...1...', '-.0.2.10', '0.......'], r:[0, 0, 1, 1, -1, -1, 0, 0]};
// the battle: phin sings the A phrase, the xylophone answers with B, then both together; winning adds strings, brass, gongs and busier drums
function batStep(t, s, bar, B, mood){
  const D = SND.mbus, win = mood === 'winning', sec = Math.floor(bar / 4) % 4, k = bar % 4, isB = sec % 2 === 1, line = (isB ? BAT.b : BAT.a)[k], r = (isB ? BAT.rb : BAT.ra)[k];
  if(s === 0){ iKhaen(t, chord(r, 110), B * 8, win ? .034 : .028, D, .25);
    if(win){ iPad(t, chord(r, 220), B * 8, .016, D, .3, true); if(k === 0 && !isB) iGong(t, .2, D, .4); } }
  if(s === 0 || s === 4) iKlong(t, false, .5, D, .1);
  if(s === 3 || s === 6 || (win && (s === 1 || s === 5)) || (k === 3 && s === 7)) iKlong(t, true, .28, D, .1);
  if(s === 2 || s === 6) iChing(t, true, .07, D, .15); else if(s % 2) iChing(t, false, .04, D, .1);
  if(s === 0 || s === 4) iPhin(t, pf(r, 110), .12, D, .1, B * 2); else if(s === 6) iPhin(t, pf(r + 3, 110), .09, D, .1, B * 2);
  mel(line, s, t, B, (d, tt, len) => {
    if(!isB || sec === 3) iPhin(tt, pf(d, 440), .16, D, .25, Math.min(1.2, len + .25));

function musicStart(){
  if(!SND.ctx || !SET.music || SND.timer || !SND.mbus) return;

  SND.timer = setInterval(musicTick, 90); mfLoad();
}
// schedule a little ahead of the clock; the mood (and the piece) only changes on a bar line
function musicTick(){
  const c = SND.ctx; if(!c) return;
  if(MUS.next < c.currentTime) MUS.next = c.currentTime + .05;
  while(MUS.next < c.currentTime + .35){
    if(MUS.next < MUS.hold){ MUS.next = MUS.hold; MUS.step = 0; continue; }
    if(MUS.step % 8 === 0 && musicBar()) continue;
    const sc = SCORE[MUS.mood];
    if(!sc || MF.buf[MUS.mood]){ MUS.next += .3; MUS.step = 0; continue; }   // the end screen (quiet until the menu), or a recorded song plays
    const B = 30 / sc.bpm;
    sc.step(MUS.next, MUS.step % 8, MUS.bar, B, MUS.mood);
    MUS.next += B; MUS.step++; if(MUS.step % 8 === 0) MUS.bar++;

// a new bar: take up the wanted mood; true when a piece played once now holds the floor
function musicBar(){
  if(MUS.want === MUS.mood) return false;
  const from = MUS.mood, to = MUS.want, bpm = m => SCORE[m] ? SCORE[m].bpm : 0; MUS.mood = to;
  if(bpm(from) !== bpm(to)) MUS.bar = 0;   // battle, winning and losing go on in the same bar; anything else starts at its top
  if(to !== 'end' && to !== 'menu' && MUS.intro){ MUS.intro = false; MUS.bar = 0;
    if(to === 'watphou'){ mfFade(.5); return false; }
    if(MF.buf.start){ mfFade(.3); MUS.hold = MUS.next + mfOnce('start', MUS.next); return true; }
    if(MF.buf[to]) return false;   // no recorded opening, but a recorded battle song: it has its own build-up
    MUS.hold = MUS.next + STING.start(MUS.next); return true; }
  return false;
}
// what the music should be doing now: called on every render
function musicWant(){
  if(S && S.fast) return;

  if(S){ m = S.over ? 'end' : 'battle';
    if(!S.over){ const me = S.p[0], op = S.p[1]; if(me.life <= 6 && me.life <= op.life) m = 'losing'; else if(op.life <= 6 && me.life > op.life) m = 'winning'; } }

   Each loop file carries .5 s of music before loopStart and after loopEnd, so the jump back crossfades over XF inside real

  losing:{bpm:120.19, a:.5, b:80.357}, start:{once:true}, victory:{once:true}, defeat:{once:true}};

function mfLoad(){

  shuffle(deck);
  return {name, bot, di, level, life:20, maxLife:20, maxMana:0, mana:0, penalty:0, deck, hand:[], field:[], loc:null, grave:[], tales:talesOf(list || DECKS[di].list), extra:fusionsOf(list || DECKS[di].list), rites:Object.keys(RITES).filter(r => (list || DECKS[di].list)[r]), fused:[], ...mechOf(list || DECKS[di].list)};

document.addEventListener('error', e => {
  const im = e.target; if(!(im instanceof HTMLImageElement)) return;
  const src = im.getAttribute('src') || ''; if(!src.startsWith(ART)) return;
  // no WebP copy yet (new art not run through tools/webp.sh): use the JPEG master

  if(!/^(localhost|127\.0\.0\.1)$|github\.io$|laolegendwars\.com$/.test(location.hostname) && !im.dataset.gh){ im.dataset.gh = 1; im.src = SITE + src.split('?')[0]; return; }

  if(ALT[h.id] && (mine ? (col().alts[h.id] || Math.random() < ALT_CHANCE * .4) : Math.random() < ALT_CHANCE)){

// Every fresh character gets its printed starting state, including revivals and summons.
function freshChar(id, alt){
  const d = C[id], c = {uid:++U, id, alt, sick:!d.kw.rush, atk:0, items:[], mods:[]};
  if(d.kw.shield) c.shield = true;
  if(d.kw.hide) c.hid = true;
  if(d.cd) c.cd = d.cd;
  return c;
}
