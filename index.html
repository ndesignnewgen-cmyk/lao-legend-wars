  return new Promise(resolve => { S.targeting = {list, prompt, resolve}; S.sel = selUid || null; render(); });
}
function promptOf(id){
  const d = C[id];
  if(d.type === 'item') return 'ເລືອກຕົວລະຄອນ ທີ່ຈະຕິດ «' + d.name + '»';
  if(id === 'phikrasue') return 'ເລືອກຕົວລະຄອນຄູ່ແຂ່ງ ໃຫ້ພະລັງ -2';
  if(id === 'kumphan') return 'ເລືອກຕົວລະຄອນ ທີ່ຈະສົ່ງກັບຄືນມື';
  if(id === 'naktanu') return 'ເລືອກເປົ້າໝາຍ ທີ່ນັກທະນູຈະຍິງ';
  if(id === 'santhaman') return 'ເລືອກຕົວລະຄອນຂອງເຈົ້າ 1 ໃບ ໃຫ້ຍັກສັນທະມານທຳລາຍ (ແລ້ວຈົ່ວກາດ 2 ໃບ)';
  return 'ເລືອກເປົ້າໝາຍ ຂອງ «' + d.name + '»';
}
async function tryPlay(uid){
  const p = S.p[0]; const h = p.hand.find(x => x.uid === uid); if(!h) return;
  S.modal = null;
  const why = playBlock(p, h); if(why){ toast(why); render(); return; }
  let t = null; const tl = targetsFor(p, h.id);
  if(tl && tl.length){ t = await pickTarget(tl, promptOf(h.id)); if(t === undefined){ render(); return; } }
  if(S.secure)return secureMove({t:'play',uid:h.uid,tk:netKey(t)});
  netSend({t:'play', uid:h.uid, tk:netKey(t)});
  S.busy = true; await localAct(() => playCard(p, h, t)); if(!S || S.over) return; S.busy = false; render(); tutEvent('play');
}
async function tryTribute(uid){
  const p = S.p[0], h = p.hand.find(x => x.uid === uid); if(!h || !canTribute(p, h)) return;
  S.modal = null; const picked = [];
  for(let k = 1; k <= 2; k++){
    const list = p.field.filter(c => !c.hacked && !picked.includes(c)).map(c => ({kind:'char', owner:p, c}));
    const t = await pickTarget(list, '🙏 ເລືອກຕົວລະຄອນ ' + k + '/2 ທີ່ຈະຖວາຍພະລັງ'); if(!t){ render(); return; }
    picked.push(t.c);
  }
  if(S.secure)return secureMove({t:'trib',uid:h.uid,a:picked[0].uid,b:picked[1].uid});
  netSend({t:'trib', uid:h.uid, a:picked[0].uid, b:picked[1].uid});
  S.busy = true; await localAct(() => playCard(p, h, null, picked)); if(!S || S.over) return; S.busy = false; render();
}
async function attackFlow(c){
  const p = S.p[0]; const ts = attackTargets(p, c);
  if(!ts.length){ toast('ບໍ່ມີເປົ້າໝາຍທີ່ໂຈມຕີໄດ້'); return; }
  const t = await pickTarget(ts, '«' + C[c.id].name + '» ຈະໂຈມຕີໃຜ?', c.uid);
  if(!t){ render(); return; }
  if(S.secure)return secureMove({t:'atk',uid:c.uid,tk:netKey(t)});
  netSend({t:'atk', uid:c.uid, tk:netKey(t)});
  S.busy = true; await localAct(() => attack(p, c, t)); if(!S || S.over) return; S.busy = false; render(); tutEvent('attack');
}

/* ---------- rendering ---------- */
function fmtSkill(t){
  // highlight game words the way printed TCG cards do: trigger chips, keyword chips, coloured numbers
  const RULES = [
    [/«[^»]+»/g, 'kn'],
    [/ເມື່ອລົງສະໜາມ|ທຸກຕາ|ຢູ່ສະໜາມ|ເມື່ອໃບນີ້ຖືກທຳລາຍ|ເມື່ອທຳລາຍຕົວລະຄອນຂອງຄູ່ແຂ່ງໄດ້|ໃຊ້ຕອນຄູ່ແຂ່ງໂຈມຕີ|ເວລາໂຈມຕີ|ຕິດໃສ່ຕົວລະຄອນ(?:ເຜົ່າຍັກ)? 1 ໃບ/g, 'kt'],
    [/ກັນໄພ|ບິນ|ຮວມພົນ|ຄືນຊີບ|ປົກປັກ|ປ່ຽນຮ່າງ|ນ້ຳຂຶ້ນ|ນ້ຳຖ້ວມ|ແຮັກ|ກັບດັກ|ໂລ່ທິບ|ອັງກໍ/g, 'kk'],
    [/ເຜົ່າ(?:ນາກ|ຍັກ|ຜີ|ວິລະບຸລຸດ|ຫິມະພານ|ນັກປາດ|ເທວະດາ|ຊາວບ້ານ|ນັກຮົບ|ຜູ້ປົກປັກ|ໄຊບອກ|ສັດປ່າ|ນັກສະແດງ)/g, 'tr'],
    [/ແຟນ \+\d+/g, 'hp'], [/ຕໍ່ເນື່ອງ \d+/g, 'kk'], [/ດູດຂວັນ|ສະສົມພະລັງ|ພິດ|ສະກັດ/g, 'kk'],
    [/ພະລັງ \+\d+/g, 'up'], [/ພະລັງ -\d+/g, 'dn'], [/ຟື້ນຂວັນ \+\d+/g, 'hp'],
    [/ຈົ່ວກາດ \d+ ໃບ/g, 'dr'], [/ໂຈມຕີໄດ້ 2 ເທື່ອ(?:ຕໍ່ຕາ)?|ໂຈມຕີ \d+/g, 'dm']
  ];
  const bits = [];
  let s = String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  for(const [re, cls] of RULES) s = s.replace(re, m => { bits.push('<span class="kw-' + cls + '">' + m + '</span>'); return '\u0001' + (bits.length - 1) + '\u0002'; });
  return s.replace(/\u0001(\d+)\u0002/g, (m, i) => bits[+i]);
}
function cardHTML(id, cs, alt, pv, form){
  const d = C[id]; const isAlt = !!(alt && ALT[id]); const cls = (d.legend ? 'legend' : (d.type === 'char' ? 'hero' : 'spell')) + (isAlt ? ' alt' : '') + (d.cy ? ' cy' : '') + (d.idf ? ' idf' : '') + (d.type === 'trap' ? ' trap' : '') + (d.fusion ? ' fusion' : '') + (d.ritual || RITES[id] ? ' ritual' : '');
  const cost = cs != null ? cs : d.cost;
  return '<div class="card ' + cls + '"><div class="face"><div class="art">' + (d.ph && !isAlt ? '<span class="phart">' + d.ph + '<small>ຮູບກຳລັງມາ</small></span>' : '<img src="' + PIC((isAlt ? ((form && d.tf && d.tf.altImg) || ALT[id]) : (form && d.tf && d.tf.img) || d.img)) + '" alt=""' + (S ? '' : ' loading="lazy"') + '>') + '</div>' + (isAlt ? '<span class="altbadge">✦ ອາດພິເສດ</span>' : '') +
    '<div class="cost"><span class="lbl">ບຸນ</span><span class="num">' + cost + '</span></div>' +
    (d.fusion ? '<span class="xtype">🤝 ຮ່ວມຮ່າງ</span>' : d.ritual ? '<span class="xtype">🕯️ ກາດພິທີ</span>' : RITES[id] ? '<span class="xtype">🕯️ ຄາຖາພິທີ</span>' : '') +
    '<div class="sym">' + SYM[d.type === 'char' ? d.tribe : 'spell'] + '</div>' +
    '<div class="panel"><span class="tag">' + d.tag + '</span><p class="skill">' + fmtSkill(d.skill) + '</p></div>' +
    '<div class="bottom">' + (d.type === 'char' ? '<div class="power"><span class="lbl">ພະລັງ</span><span class="num' + (pv == null || pv === d.power ? '' : (pv > d.power ? ' up' : ' down')) + '">' + (pv == null ? d.power : pv) + '</span></div>' : '') +
    '<div class="namebox">' + ((form && d.tf && d.tf.name) || d.name) + '</div></div></div></div>';
}
function render(){
  if(S && S.fast) return;
  $app.dataset.theme = (S || ui.screen === 'shop') ? SET.theme : '';
  musicWant();
  const sc = scrollSave();
  if(!S && loginShown()){ $app.innerHTML = loginHTML() + menuModalHTML() + settingsHTML(); scrollRestore(sc); return; }
  if(!S){ $app.innerHTML = (ui.screen === 'book' ? bookHTML() : ui.screen === 'builder' ? builderHTML() : ui.screen === 'shop' && typeof shopHTML === 'function' ? shopHTML() : menuHTML()) + menuModalHTML() + settingsHTML(); scrollRestore(sc); return; }
  $app.innerHTML = boardHTML() + modalHTML() + graveHTML() + settingsHTML() + tutHTML();
  scrollRestore(sc); tutHighlight();
}
// a full redraw replaces every element, so each scrolling list keeps its place: picking a card, or opening one and closing it,
// no longer jumps back to the top. A list inside a popup belongs to that popup (a new popup still opens at the top).
const SCROLLERS = '.book,.bgrid2,.bdin,.shop,.home,.h2scroll,.login,.showgrid,.slist,.advmap,.loglist,.dpanel,.wp-panel-body,.ggrid,.gbody,.modal';
const popKey = () => ui.mmodal ? ui.mmodal.type + '/' + (ui.mmodal.step || '') + '/' + (ui.mmodal.tab || '') : S && S.modal ? 'g/' + S.modal.type : '';
function scrollKeys(){
  const n = {}, pk = popKey();
  return [...document.querySelectorAll(SCROLLERS)].map(e => { const c = e.classList[0]; n[c] = (n[c] || 0) + 1; return [e, c + '#' + n[c] + (e.closest('.modal') ? '@' + pk : '') + '/' + (ui.screen || '')]; });
}
function scrollSave(){ const m = new Map(); for(const [e, k] of scrollKeys()) if(e.scrollTop) m.set(k, e.scrollTop); return m; }
function scrollRestore(m){ if(m.size) for(const [e, k] of scrollKeys()) if(m.has(k)) e.scrollTop = m.get(k); }
const escH = t => String(t).replace(/[&<>"]/g, ch => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[ch]));

function deckPickHTML(){

const PACKS = {
  basic:{name:'ຊອງທຳມະດາ', cost:100, desc:'5 ໃບ ຈາກທຸກເດັກ · ຫາຍາກຂຶ້ນໄປ ຢ່າງໜ້ອຍ 1 ໃບ', legend:.08, alt:.01},

};
const DUST_GET = {common:5, rare:20, legend:100, alt:200}, DUST_MAKE = {common:40, rare:100, legend:400};
const PITY = 10;
// the odds behind PACKS, per pack, so the shop can print them honestly
function packOdds(kind){ const k = PACKS[kind], l = 1 - (1 - k.legend) * (1 - k.legend); return {legend:Math.round(l * 100), alt:Math.round((1 - Math.pow(1 - k.alt, 5)) * 100)}; }
function rollPack(kind, di){
  const c = col(), k = PACKS[kind];
  let pool = Object.keys(C).filter(id => !C[id].fusion && !C[id].ritual && !C[id].token);
  if(kind === 'deck'){ const L = DECKS[di].list; pool = pool.filter(id => L[id] || NEUTRAL.has(id)); }
  const by = r => pool.filter(id => rarityOf(id) === r);
  const pickOf = r => {
    let ids = by(r); if(!ids.length) ids = by('rare').length ? by('rare') : pool;
    if(r === 'legend'){ const fresh = ids.filter(id => !owned(id)); if(fresh.length) ids = fresh; }   // no repeat legend until you have them all
    const w = ids.map(id => owned(id) >= RULE.copies ? 1 : (owned(id) ? 2 : 3));                    // cards you lack come up more often
    let t = Math.random() * w.reduce((a, b) => a + b, 0);
    for(let i = 0; i < ids.length; i++){ t -= w[i]; if(t <= 0) return ids[i]; } return ids[ids.length - 1];
  };
  const out = []; let gotLegend = false;
  for(let slot = 0; slot < 5; slot++){
    let r;
    if(slot === 3 || (kind === 'gold' && slot === 4)) r = Math.random() < k.legend ? 'legend' : 'rare';
    else if(slot === 4) r = Math.random() < k.legend ? 'legend' : (Math.random() < .35 ? 'rare' : 'common');
    else r = Math.random() < .15 ? 'rare' : 'common';
    if(slot === 3 && !gotLegend && c.pity >= PITY - 1 && !out.some(x => x.r === 'legend')) r = 'legend';
    const id = pickOf(r); if(rarityOf(id) === 'legend') gotLegend = true;
    out.push({id, r:rarityOf(id), alt:!!(ALT[id] && Math.random() < k.alt)});
  }
  c.pity = gotLegend ? 0 : c.pity + 1; c.packs++;
  for(const x of out){
    x.isNew = !owned(x.id);
    if(owned(x.id) < RULE.copies) c.cards[x.id] = owned(x.id) + 1; else { x.dust = DUST_GET[x.r]; c.dust += x.dust; }
    if(x.alt){ if(c.alts[x.id]){ c.dust += DUST_GET.alt; x.dust = (x.dust || 0) + DUST_GET.alt; } else { c.alts[x.id] = true; markAltSeen(x.id); x.isNew = true; } }
  }
  if(typeof questEvent === 'function') questEvent('pack', 1);
  saveCol(); return out;
}

async function premiumLoad(force){
  if(!ACCT.user || !ACCT.eco) return;
  if(PM.uid!==ACCT.user.id){PM.uid=ACCT.user.id;PM.state=null;PM.error='';PM.loading=false;}
  if(PM.loading || (!force&&PM.state))return;
  const still=accountGuard();PM.loading=true;PM.error='';
  try{const {data,error}=await secureWait(SB.rpc('premium_state'),15000);if(!still())return;if(error)throw error;PM.state=data;}
  catch(e){if(still())PM.error=pmErr(e);}
  finally{if(still()){PM.loading=false;render();}}
}
// Keep retry keys across a reload until a definitive response. Unknown network outcomes never become a fresh debit.
async function premiumCall(name,args,key){
  if(PM.busy||!ACCT.user||!ACCT.eco)return null;
  const still=accountGuard(),uid=ACCT.user.id,storageKey='lao-legend-premium-requests:'+uid;
  let pending=loadJ(storageKey,{});if(!pending||typeof pending!=='object'||Array.isArray(pending))pending={};
  if(key){pending[key]=pending[key]||crypto.randomUUID();saveJ(storageKey,pending);args={...args,request_key:pending[key]};}
  PM.busy=true;PM.error='';render();
  try{
    const {data,error}=await secureWait(SB.rpc(name,args),15000);if(!still())return null;if(error)throw error;
    if(data?.premium){PM.uid=uid;PM.state=data.premium;}if(data?.state)ecoApply(data.state);
    if(key){delete pending[key];saveJ(storageKey,pending);}return data;
  }catch(e){if(still()){PM.error=pmErr(e);if(key&&['P0004','P0017','P0018','P0019','P0020','P0021','P0022','P0023','42501','23505','PGRST202'].includes(e?.code)){delete pending[key];saveJ(storageKey,pending);}}return null;}
  finally{if(still()){PM.busy=false;render();}}
}

async function premiumAdminSave(m){
 if(PM.busy||!m)return;
 const receiver=document.getElementById('pm-receiver')?.value.trim()||'',enabled=!!document.getElementById('pm-enabled')?.checked;
 let file=document.getElementById('pm-qrfile')?.files[0],path=m.data?.config?.qr_path||'',amountQrs={...(m.data?.config?.amount_qrs||{})};
 const preset=!file&&!path,packs=m.data?.packs||PM_MERCHANT.amounts.map(n=>({amount_lak:n}));
 const files=Object.fromEntries(packs.map(p=>[p.amount_lak,document.getElementById('pm-qr-'+p.amount_lak)?.files[0]]));
 if(file)amountQrs={};
 if(enabled&&packs.some(p=>!files[p.amount_lak]&&!amountQrs[p.amount_lak]&&!(preset&&PM_MERCHANT.amountQrs[p.amount_lak]))){toast(pmErr({code:'P0023'}));return;}
 const still=accountGuard();PM.busy=true;PM.error='';render();
 const localFile=async src=>{const r=await fetch(src);if(!r.ok)throw {code:'P0018'};return new File([await r.blob()],'merchant-qr.png',{type:'image/png'});};
 const upload=async f=>{
  const ext={'image/png':'png','image/jpeg':'jpg','image/webp':'webp'}[f.type];if(!ext||f.size>2097152)throw {code:'P0018'};
  if(!still())throw {code:'42501'};
  const name='qr/'+crypto.randomUUID()+'.'+ext,{error}=await SB.storage.from('merchant-qr').upload(name,f,{contentType:f.type,upsert:false});if(error)throw error;return name;
 };
 try{
  if(preset)file=await localFile(PM_MERCHANT.qr);
  if(file)path=await upload(file);
  for(const p of packs){const n=p.amount_lak;let f=files[n];if(!f&&!amountQrs[n]&&preset&&PM_MERCHANT.amountQrs[n])f=await localFile(PM_MERCHANT.amountQrs[n]);if(f)amountQrs[n]=await upload(f);}

}

async function openPack(kind, free){
  const c = col();
  if(ACCT.eco){
    if(free ? !c.freePacks : c.gems < PACKS[kind].cost){ toast('ເພັດບໍ່ພໍ'); return; }
    if(ui.packBusy) return; ui.packBusy = true;
    const di = ui.shopDeck != null ? ui.shopDeck : 1, still = accountGuard();
    try{
      const {data, error} = await SB.rpc('eco_pack', {kind, di, free:!!free}); if(!still()) return; if(error) throw error;
      ecoApply(data.state); for(const x of data.cards) if(x.alt && x.isNew) markAltSeen(x.id);
      questEvent('pack', 1);
      ui.open = {kind, di, cards:data.cards, flip:{}, torn:false}; sfx('pack'); render();
    }catch(e){ if(still()) toast(ecoErr(e)); }
    finally{ if(still()) ui.packBusy = false; }
    return;
  }
  if(free){ if(!c.freePacks) return; c.freePacks--; }
  else { if(c.gems < PACKS[kind].cost){ toast('ເພັດບໍ່ພໍ'); return; } c.gems -= PACKS[kind].cost; }
  const di = ui.shopDeck != null ? ui.shopDeck : 1;
  ui.open = {kind, di, cards:rollPack(kind, di), flip:{}, torn:false}; sfx('pack'); render();
}
function flipCard(i){
  const o = ui.open; if(!o || o.flip[i]) return; o.flip[i] = true; o.last = i; const x = o.cards[i];
  sfx(x.r === 'legend' || x.alt ? 'reveal' : (x.r === 'rare' ? 'spell' : 'flip'));
  render();
}
function shopClick(a, v){
  if(a.startsWith('pm')){ premiumAction(a,v).catch(() => { PM.error='ຕໍ່ຮ້ານບໍ່ໄດ້ ລອງໃໝ່'; render(); }); return true; }
  if(a === 'shop'){ ui.screen = 'shop'; ui.open = null; premiumLoad(); render(); return true; }
  if(ui.screen !== 'shop') return false;
  if(ui.open){
    if(a === 'packtear'){ const o = ui.open; if(o.tearing) return true; o.tearing = true; sfx('boom'); render(); setTimeout(() => { if(ui.open === o){ o.torn = true; render(); } }, 700); }
    else if(a === 'flip') flipCard(+v);
    else if(a === 'flipall'){ ui.open.cards.forEach((_, i) => ui.open.flip[i] = true); ui.open.last = 'all'; sfx(ui.open.cards.some(x => x.r === 'legend' || x.alt) ? 'reveal' : 'flip'); render(); }
    else if(a === 'opendone'){ ui.open = null; render(); }
    else if(a === 'buy'){ ui.open = null; openPack(v); }
    return true;
  }
  if(a === 'craftdo'){
    const id = v, cost = DUST_MAKE[rarityOf(id)], c = col();
    if(owned(id) >= RULE.copies || c.dust < cost){ toast('ຜົງແກ້ວບໍ່ພໍ'); return true; }
    if(ACCT.eco){ const still = accountGuard(); SB.rpc('eco_craft', {card:id}).then(({data, error}) => { if(!still()) return; if(error) throw error; ecoApply(data); ui.mmodal = null; sfx('win'); render(); toast('ສ້າງ «' + C[id].name + '» ແລ້ວ'); }).catch(e => { if(still()) toast(ecoErr(e)); }); return true; }
    c.dust -= cost; c.cards[id] = owned(id) + 1; saveCol(); ui.mmodal = null; sfx('win'); render(); toast('ສ້າງ «' + C[id].name + '» ແລ້ວ'); return true;
  }
  if(ui.mmodal) return false;
  if(a === 'shopback'){ ui.screen = null; render(); return true; }
  if(a === 'shoptab'){ ui.shopTab = v; premiumLoad(); render(); return true; }
  if(a === 'crafttab'){ ui.craftTab = v; render(); return true; }
  if(a === 'shopdeck'){ ui.shopDeck = +v; render(); return true; }
  if(a === 'buy'){ openPack(v); return true; }
  if(a === 'freeopen'){ openPack('basic', true); return true; }
  if(a === 'craftsel'){ ui.mmodal = {type:'craft', id:v}; render(); return true; }
  return true;

function accountScope(id, replace = false){

  ACCT.quiet = true;
  try{
    const snap = Object.fromEntries(SCOPE_KEYS.map(k => [k, loadJ(k, null)]));

    localStorage.setItem(SCOPE_PREFIX + (old || 'guest'), JSON.stringify(snap));
    const adoptGuest = id !== 'guest' && !replace && (old == null || old === 'guest');
    if(!adoptGuest && old !== id){
      const saved = loadJ(SCOPE_PREFIX + id, {});
      for(const k of SCOPE_KEYS){ if(saved[k] == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(saved[k])); }

async function cloudPush(){

async function cloudPull(){

function mailErr(e){

  if(/exists|already been registered|email_exists/i.test(t)) return 'ອີເມວນີ້ຜູກກັບບັນຊີອື່ນແລ້ວ';
  if(/signups? not allowed|otp_disabled|user_not_found/i.test(t)) return 'ບໍ່ພົບບັນຊີຂອງອີເມວນີ້';
  if(/expired|invalid|otp/i.test(t)) return 'ລະຫັດບໍ່ຖືກ ຫຼື ໝົດອາຍຸ ລອງໃໝ່';
  if(/smtp|sending|email/i.test(t)) return 'ສົ່ງອີເມວບໍ່ໄດ້ (ເຊີບເວີອີເມວຍັງບໍ່ພ້ອມ)';
  return 'ບໍ່ສຳເລັດ ລອງໃໝ່';
}
async function mailStep(kind){
  const m = ui.mmodal, val = id => ((document.getElementById(id) || {}).value || '').trim();

    if(!EMAIL_RE.test(email)){ m.err = 'ອີເມວບໍ່ຖືກຕ້ອງ'; render(); return; }
    m.email = email;
  }

        toast(ACCT.prof ? 'ສະບາຍດີ ' + ACCT.prof.name + '! ໂຫຼດຂໍ້ມູນຈາກ cloud ແລ້ວ ☁️' : 'ເຂົ້າບັນຊີແລ້ວ');

}

const PASS_ON = true;
function passErr(e){
  const t = String(e && (e.code || e.message) || '');
  if(/otp|token.*(expired|invalid)|expired|invalid.*token/i.test(t)) return 'ລະຫັດບໍ່ຖືກ ຫຼື ໝົດອາຍຸແລ້ວ · ກົດ «ສົ່ງລະຫັດໃໝ່»';

  if(/not authorized|address not authorized/i.test(t)) return 'ເຊີບເວີສົ່ງອີເມວຍັງບໍ່ພ້ອມ ລອງໃໝ່ພາຍຫຼັງ';
  if(/not.?confirmed/i.test(t)) return 'ອີເມວນີ້ຍັງບໍ່ໄດ້ຢືນຢັນ · ເປີດອີເມວ ກົດລິ້ງຢືນຢັນກ່ອນ';
  if(/same.?password|different from the old/i.test(t)) return 'ລະຫັດໃໝ່ ຕ້ອງບໍ່ຄືລະຫັດເກົ່າ';
  if(/weak|password should|at least/i.test(t)) return 'ລະຫັດຜ່ານອ່ອນໂພດ · ໃຫ້ຍາວຂຶ້ນ ແລະ ມີຕົວເລກ';
  if(/exists|already been registered|already registered|email_exists/i.test(t)) return 'ອີເມວນີ້ມີບັນຊີແລ້ວ · ລອງ «ເຂົ້າດ້ວຍອີເມວ + ລະຫັດຜ່ານ» ແທນ';
  if(/rate|429|seconds/i.test(t) || (e && e.status === 429)) return 'ລອງຖີ່ເກີນ ລໍຖ້າ 1 ນາທີ ແລ້ວລອງໃໝ່';
  if(/smtp|sending|confirmation/i.test(t)) return 'ເຊີບເວີສົ່ງອີເມວຢືນຢັນບໍ່ໄດ້ · ຜູ້ດູແລຕ້ອງປິດ «Confirm email» ໃນ Supabase';
  if(/provider.*disabled|signups? not allowed|email_provider_disabled/i.test(t)) return 'ເຊີບເວີຍັງບໍ່ເປີດການເຂົ້າດ້ວຍອີເມວ';
  return 'ບໍ່ສຳເລັດ ລອງໃໝ່';

async function passStep(kind, m = ui.mmodal, given){
  const val = id => given && id in given ? given[id] : (document.getElementById(id) || {}).value || '';
  const typed = ['link', 'login', 'forgot'].includes(kind), email = typed ? val('pmail').trim().toLowerCase() : m.email, pw = val('ppw'), pw2 = val('ppw2');
  const code = val('pcode').replace(/\D/g, '');
  m.email = email;   // kept for the box when a check below fails and the screen is drawn again
  if(typed && !EMAIL_RE.test(email)){ m.err = 'ອີເມວບໍ່ຖືກຕ້ອງ'; render(); return; }
  if((kind === 'verify' || kind === 'reset') && code.length !== 6){ m.err = 'ໃສ່ລະຫັດ 6 ຕົວ ທີ່ໄດ້ຮັບທາງອີເມວ'; render(); return; }
  if(!['done', 'verify', 'forgot', 'resend'].includes(kind) && pw.length < 8){ m.err = 'ລະຫັດຜ່ານຢ່າງໜ້ອຍ 8 ຕົວ'; render(); return; }
  if(['link', 'pass', 'reset'].includes(kind) && pw !== pw2){ m.err = 'ລະຫັດຜ່ານທັງສອງ ບໍ່ຄືກັນ'; render(); return; }
  if(kind === 'link') m.pw = pw; else if((kind === 'done' || kind === 'verify') && pw) m.pw = pw;
  m.busy = true; m.err = ''; render();
  try{
    await sbLoad();
    if(kind === 'login'){
      const {data, error} = await SB.auth.signInWithPassword({email, password:pw}); if(error) throw error;
      // this device now opens that account: its cloud copy replaces what is here
      ACCT.user = data.user; await acctLoad({replace:true});
      toast(ACCT.prof ? 'ສະບາຍດີ ' + ACCT.prof.name + '! ໂຫຼດຂໍ້ມູນຈາກ cloud ແລ້ວ ☁️' : 'ເຂົ້າບັນຊີແລ້ວ');
      m.step = null; m.edit = false; if(m === ui.login) ui.login = null;
    } else if(kind === 'pass'){
      const {data, error} = await SB.auth.updateUser({password:pw}); if(error) throw error;
      ACCT.user = data.user || ACCT.user; m.step = null; toast('ປ່ຽນລະຫັດຜ່ານແລ້ວ ✅');
    } else if(kind === 'forgot' || (kind === 'resend' && m.step === 'preset')){
      // a code to reset the password goes to that email (Supabase says nothing about whether an account has it)
      const {error} = await SB.auth.resetPasswordForEmail(email); if(error) throw error;
      m.step = 'preset'; toast('ສົ່ງລະຫັດໄປທີ່ອີເມວແລ້ວ 📨');
    } else if(kind === 'reset'){
      // the code signs this device in to that account, then the new password is set and the cloud copy comes down
      const {data, error} = await SB.auth.verifyOtp({email, token:code, type:'recovery'}); if(error) throw error;
      ACCT.user = data.user || (await SB.auth.getUser()).data.user;
      const r = await SB.auth.updateUser({password:pw}); if(r.error) throw r.error;
      await acctLoad({replace:true}); m.step = null; m.edit = false; if(m === ui.login) ui.login = null;
      toast(ACCT.prof ? 'ຕັ້ງລະຫັດຜ່ານໃໝ່ແລ້ວ ✅ ສະບາຍດີ ' + ACCT.prof.name : 'ຕັ້ງລະຫັດຜ່ານໃໝ່ແລ້ວ ✅');
    } else if(kind === 'resend'){
      // the email change again, for a fresh code
      const {error} = await SB.auth.updateUser({email}); if(error) throw error; toast('ສົ່ງລະຫັດໃໝ່ແລ້ວ 📨');
    } else {
      // first the email (Supabase may send a confirmation link and wait), then the password once the email is on the account
      let user;
      if(kind === 'link'){ const {data, error} = await SB.auth.updateUser({email}); if(error) throw error; user = data.user; }
      else if(kind === 'verify'){ const {data, error} = await SB.auth.verifyOtp({email, token:code, type:'email_change'}); if(error) throw error; user = data.user || (await SB.auth.getUser()).data.user; }
      else { const {data, error} = await SB.auth.getUser(); if(error) throw error; user = data.user; }
      if(!user || (user.email || '').toLowerCase() !== email){ m.step = 'pwait'; return; }
      if(!m.pw){ m.step = 'pwait'; m.err = 'ໃສ່ລະຫັດຜ່ານອີກເທື່ອ'; return; }
      const {data, error} = await SB.auth.updateUser({password:m.pw}); if(error) throw error;
      ACCT.user = data.user || user; m.pw = null; m.step = null;
      if(m === ui.login) ui.login = null;   // signing up from the login page: into the game
      toast('ຕັ້ງອີເມວ ແລະ ລະຫັດຜ່ານແລ້ວ ✅ ເຂົ້າຫຼິ້ນເຄື່ອງອື່ນໄດ້');
    }
  }catch(e){ m.err = passErr(e); window.__errs.push('pass: ' + (e && (e.code || e.message) || e)); }

}

/* ---------- online play, part 2 (phase F3): the turn clock, a friend who drops out, picking a game back up, and emotes ----------

function onlineTick(){

  const left = S.turnAt ? Math.max(0, Math.ceil(TURN_SEC - (now - S.turnAt) / 1000)) : TURN_SEC;
  const el = document.querySelector('.tclock'); if(el){ el.textContent = S.turnAt ? '⏱ ' + left : ''; el.classList.toggle('low', !!S.turnAt && left <= 10); }

  if(asking){ S.askAt = S.askAt || now; if(now - S.askAt > ANSWER_SEC * 1000){ const r = m.resolve, v = ASK_DEFAULT[m.type](m); S.modal = null; S.askAt = 0; render(); r(v); } }

async function snapSoon(){

function applySnap(m){

    log:['🔄 ຕໍ່ເກມຄືນແລ້ວ'], online:{...st.online, me}});
  S.busy = S.turn !== 0; S.p[0].remote = false; S.p[1].remote = true; S.p[0].name = 'ເຈົ້າ'; S.p[1].name = them.name || 'ໝູ່';
