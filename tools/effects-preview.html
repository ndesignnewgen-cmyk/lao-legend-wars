<!doctype html><html lang="lo"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ເບິ່ງເອັບເຟັກໃນເກມ</title>
<style>body{margin:0;background:#0c1726;color:#fff;font:16px system-ui}header{height:66px;display:flex;align-items:center;gap:10px;padding:0 16px;flex-wrap:wrap}select,button{font:inherit;color:#fff;background:#23364e;border:1px solid #aa975d;border-radius:8px;padding:7px 10px}button.on{background:#876423}iframe{display:block;width:100%;height:calc(100vh - 66px);border:0}small{color:#ddce9d}@media(max-width:700px){header{height:120px}iframe{height:calc(100vh - 120px)}}</style>
<header><b>ເບິ່ງເອັບເຟັກ</b><select id="deck" aria-label="ເລືອກເດັກ"></select><button id="hold">ຄ້າງຮູບ</button><button id="play">ເບິ່ງອີກ</button><button id="loop" class="on">ຫຼິ້ນຊ້ຳ: ເປີດ</button><small id="note">ກຳລັງເປີດເກມ…</small></header><iframe id="game" title="ສາກໃນເກມ"></iframe><script type="module" src="effects-preview.js"></script></html>
