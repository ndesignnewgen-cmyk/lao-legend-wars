<!doctype html>
<html lang="lo"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}body{margin:0;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr);background:#332b21;color:#fff1ce;font:15px system-ui}header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid #b69055}header b{margin-right:auto}button,select{font:inherit;color:#fff1ce;background:#5b472d;border:1px solid #c9a66c;border-radius:9px;padding:8px 12px;cursor:pointer}button:disabled{opacity:.5}small{display:block;color:#d1bc95;font-size:11px}iframe{display:block;border:0;width:100%;height:100%;min-height:0}@media(max-width:760px){header{gap:6px;padding:8px}header b{width:100%}button,select{font-size:12px;padding:6px 8px}}
