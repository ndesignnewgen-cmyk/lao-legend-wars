<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<base href="../">
<title>ຕົວຢ່າງກາດສວມໃສ່ · ຕຳນານລາວ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao+Looped:wght@400;500;700;800&family=Noto+Sans+Lao:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{height:auto;min-height:100%;overflow:auto}body{margin:0;background:#101923;color:#f7ecd8;font:15px/1.8 'Noto Sans Lao',sans-serif}body::before{display:none}
main{width:min(1180px,100%);margin:auto;padding:22px 24px 40px}h1{font-size:26px;line-height:1.6;margin:0 0 4px}main>p{color:#a9b8c7;margin:0 0 20px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.opt{padding:16px 16px 12px;border:1px solid #394958;border-radius:16px;background:linear-gradient(145deg,#1c2c3a,#17232f)}.opt.best{border-color:#dfc18a;background:linear-gradient(145deg,#2a3238,#1b2834)}
.opt h2{font-size:18px;line-height:1.7;margin:0}.opt h2 small{font:700 12px 'Noto Sans Lao',sans-serif;color:#17232e;background:#dfc18a;border-radius:99px;padding:2px 10px;margin-left:8px}.opt>p{font-size:13px;color:#aabbc9;margin:2px 0 0}
.lane2{display:flex;justify-content:center;gap:26px;padding:44px 8px 30px;margin-top:10px;border-radius:12px;background:#21384a}
.lane2 .mini{--w:150px;cursor:default}
.lane2 .mini.can,.lane2 .mini:hover{transform:none}
@media(max-width:1020px){.opts{grid-template-columns:1fr}}
@media(max-width:560px){main{padding:16px}.lane2{gap:12px}.lane2 .mini{--w:96px}}

/* A · socketed medallions: round item pictures set into the card's right edge; empty sockets show how many it can wear */
.a-eq{position:absolute;right:calc(var(--w)*-.055);top:calc(var(--w)*.34);display:flex;flex-direction:column;gap:calc(var(--w)*.02);z-index:4}
.a-eq i{display:block;width:calc(var(--w)*.2);height:calc(var(--w)*.2);border-radius:50%;background:#14202d center 12%/cover;border:calc(var(--w)*.014) solid #e2c078;box-shadow:0 1px 4px #000a,inset 0 0 0 1px #0007}
.a-eq i.e{width:calc(var(--w)*.13);height:calc(var(--w)*.13);margin-left:calc(var(--w)*.07);background:#10182366;border-style:dashed;border-color:#e2c078aa;box-shadow:none}

/* B · fan: the real item cards tilt out from behind the card's top right, like cards held in a hand */
.b-eq{position:absolute;inset:0;z-index:-1}
.b-eq .card{position:absolute;inset:0;transform-origin:50% 100%;transform:rotate(calc(var(--i)*8deg)) translateX(calc(var(--i)*var(--w)*.07))}
.b-eq .panel,.b-eq .bottom,.b-eq .xtype,.b-eq .cost{display:none}

/* C · belt: one gold plate hangs under the card with small item pictures in a row; it never grows taller */
.c-eq{position:absolute;left:10%;right:10%;top:calc(100% - var(--w)*.015);height:calc(var(--w)*.19);padding:0 calc(var(--w)*.03);display:flex;align-items:center;justify-content:center;gap:calc(var(--w)*.025);z-index:-1;background:linear-gradient(180deg,#8a6a2e,#e5c578 30%,#ad8239);border-radius:0 0 calc(var(--w)*.06) calc(var(--w)*.06);box-shadow:0 3px 6px #0009}
.c-eq i{display:block;width:calc(var(--w)*.15);height:calc(var(--w)*.15);border-radius:calc(var(--w)*.03);background:#14202d center 12%/cover;box-shadow:0 0 0 1px #4a3612}
.c-eq i.e{background:#4a361266;box-shadow:inset 0 0 0 1px #4a361288}

/* D · side tabs: small item cards stick out from behind the right side, showing their picture */
.d-eq{position:absolute;right:calc(var(--w)*-.13);top:calc(var(--w)*.2);display:flex;flex-direction:column;gap:calc(var(--w)*.03);z-index:-1}
.d-eq i{display:block;width:calc(var(--w)*.34);height:calc(var(--w)*.36);border-radius:calc(var(--w)*.03);background:#14202d center 12%/cover;border:calc(var(--w)*.016) solid #bb904b;box-shadow:0 2px 5px #0009;transform:rotate(3deg)}
</style>
</head>
<body>
<main>
  <h1>ຈະສະແດງກາດສວມໃສ່ແນວໃດດີ?</h1>
  <p>ຕົວຢ່າງ 4 ແບບ ດ້ວຍກາດຈິງ. ແຕ່ລະແຖວ: ບໍ່ສວມ · ສວມ 1 ໃບ · ສວມ 2–3 ໃບ. ແຕະກາດໃນເກມຈະເຫັນຊື່ຄົບຢູ່ແຜງຂ້າງ.</p>
  <div class="opts" id="opts">ກຳລັງໂຫຼດ…</div>
</main>
<script src="tools/card-design-v3.js?v=12"></script>
<script>
const items=['dapmai','dapngoen','chippower','chipfly','sonsin','lowai'];
const pic=id=>'art/w/'+id+'.webp';
const sets=[['babynaga',[],2,1],['champathong',['dapmai'],2,11],['mechyak',['chippower','chipfly','sonsin'],3,5]];
const OPTS=[
 {k:'a',best:1,t:'A · ເມັດຮູບຝັງຂອບກາດ',d:'ຮູບກົມນ້ອຍຝັງຢູ່ຂອບຂວາ ຄືເພັດຝັງດາບ · ຊ່ອງຫວ່າງບອກວ່າສວມໄດ້ອີກຈັກໃບ · ບໍ່ກິນບ່ອນ ຮູບກາດບໍ່ຖືກບັງຫຼາຍ',
  f:(its,max)=>'<div class="a-eq">'+its.map(id=>'<i style="background-image:url('+pic(id)+')"></i>').join('')+'<i class="e"></i>'.repeat(Math.max(0,max-its.length))+'</div>'},
 {k:'b',t:'B · ພັດກາດທາງຫຼັງ',d:'ກາດຈິງຫັນອອກຈາກທາງຫຼັງ ຄືຖືກາດໄວ້ໃນມື · ເຫັນວ່າເປັນກາດແທ້ · ກິນບ່ອນຂ້າງໆ ກາດອາດທັບກັນຕອນມີ 5 ໃບ',
  f:(its,max,faces)=>'<div class="b-eq">'+its.map((id,i)=>'<div class="card spell" data-kind="item" style="--i:'+(i+1)+';z-index:'+(-1-i)+'"><div class="face"><div class="art"><img src="'+pic(id)+'" alt=""></div></div></div>').join('')+'</div>'},
 {k:'c',t:'C · ເຂັມຂັດຄຳໃຕ້ກາດ',d:'ແຖບຄຳແຜ່ນດຽວຫ້ອຍໃຕ້ກາດ ມີຮູບນ້ອຍລຽງກັນ · ຮູບກາດບໍ່ຖືກບັງເລີຍ · ບໍ່ສູງຂຶ້ນຕາມຈຳນວນ',
  f:(its,max)=>max?'<div class="c-eq">'+its.map(id=>'<i style="background-image:url('+pic(id)+')"></i>').join('')+'<i class="e"></i>'.repeat(Math.max(0,max-its.length))+'</div>':''},
 {k:'d',t:'D · ແຖບກາດຂ້າງກາດ',d:'ກາດນ້ອຍຍື່ນອອກຈາກຂ້າງຂວາ ເຫັນຮູບຊັດກວ່າແບບ A · ກິນບ່ອນຂ້າງໆໜ້ອຍໜຶ່ງ',
  f:(its,max)=>'<div class="d-eq">'+its.map(id=>'<i style="background-image:url('+pic(id)+')"></i>').join('')+'</div>'}
];
(async()=>{
 const [text,data]=await Promise.all([fetch('index.html?equip-design=1',{cache:'reload'}).then(r=>r.text()),fetch('tools/card-design-samples.json?v=8').then(r=>r.json())]);
 const doc=new DOMParser().parseFromString(text,'text/html'),st=document.createElement('style');
 st.textContent=[...doc.querySelectorAll('style')].map(s=>s.textContent).join('\n');
 document.head.insertBefore(st,document.head.querySelector('style'));
 const face=id=>{const b=document.createElement('div');b.innerHTML=data.faces[id].normal;CardDesign.decorate(b.firstElementChild,data.cards[id]);b.querySelector('.art img').loading='eager';return b.innerHTML;};
 document.getElementById('opts').innerHTML=OPTS.map(o=>'<section class="opt'+(o.best?' best':'')+'"><h2>'+o.t+(o.best?'<small>ແນະນຳ</small>':'')+'</h2><p>'+o.d+'</p><div class="lane2">'+sets.map(([id,its,max,pw])=>'<div class="mini">'+face(id)+'<div class="pwtop">'+pw+'</div>'+o.f(its,max)+'</div>').join('')+'</div></section>').join('');
})().catch(e=>{document.getElementById('opts').textContent='ໂຫຼດບໍ່ສຳເລັດ';console.error(e);});
</script>
</body></html>
