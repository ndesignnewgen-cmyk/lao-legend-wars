<!doctype html><html lang="lo"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ລອງກົດຈັດເດັກໃໝ່</title><style>*{box-sizing:border-box}body{margin:0;background:#101924;color:#f7ecd3;font:16px/1.6 system-ui,sans-serif}header{padding:14px 20px;border-bottom:1px solid #b59a624d;background:linear-gradient(120deg,#20314a,#121d2a)}h1{font-size:21px;margin:0 0 5px}p{margin:4px 0;color:#d3c4a7;font-size:13px}nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}button,a{font:700 14px system-ui;padding:9px 14px;border-radius:24px;background:#283b50;border:1px solid #b59a6266;color:#f7ecd3;text-decoration:none;cursor:pointer}button.on{background:#e9c779;color:#1c2936}iframe{display:block;width:100%;height:calc(100dvh - 175px);min-height:520px;border:0}#status{min-height:22px}@media(max-width:600px){iframe{height:calc(100dvh - 240px)}header{padding:12px}h1{font-size:18px}}</style><header><h1>✦ ຈັດເດັກຫຼາກຫຼາຍຂຶ້ນ</h1><p>15 ກາດສອງເຜົ່າ · ສວມໃສ່ 2 ຊ່ອງ · ຕົວຢ່າງເດັກປະສົມ 3 ແບບ</p><nav><button data-view="tribes" class="on">ເບິ່ງສອງເຜົ່າ</button><button data-view="mix">ຈັດເດັກປະສົມ</button><button data-view="equip">ລອງປ່ຽນຂອງ</button><a href="../">ເຂົ້າເກມ</a></nav><p id="status">ກຳລັງໂຫຼດ…</p></header><iframe id="game" src="../?rules-preview=31" title="ເກມລອງກົດໃໝ່"></iframe><script>
const frame=document.getElementById('game'),status=document.getElementById('status');let selected='tribes';
function show(view){const w=frame.contentWindow,D=w.__dbg;if(!D){status.textContent='ເບິ່ງໜ້າລອງໄດ້ໃນເຄື່ອງ; ກົດເຂົ້າເກມເພື່ອໃຊ້ກົດໃໝ່.';return;}selected=view;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===view));const guest=w.document.querySelector('[data-a="lguest"]');if(guest)guest.click();D.dino.set(null);D.ui.mmodal=null;D.ui.detail=null;D.ui.screen='builder';D.ui.ed={cid:null,list:D.rules.recipe(2),name:'ນາກ + ໄຊບອກ',del:false};D.ui.edView='pool';D.ui.bf={v2:true,own:false,deck:'',tribe:view==='tribes'?'cyborg':'',type:'',role:'',cost:0,q:''};
if(view==='equip'){const p=D.dino.make('ເຈົ້າ',0,false,1),q=D.dino.make('ບອດ',1,true,1),g={screen:'game',p:[p,q],turn:0,T:1,level:1,log:[],over:null,fast:false,auto:false,sim:true,busy:false,modal:null,targeting:null};D.dino.set(g);p.mana=10;p.maxMana=10;p.deck=Array(20).fill('babynaga');p.hand=[{uid:99101,id:'sonsin'},{uid:99102,id:'dokchampa'}];q.deck=Array(20).fill('lukyak');const c=D.dino.fresh('babynaga');c.items=['lowai','wao'];c.sick=false;p.field=[c];D.ui.screen=null;status.textContent='ແຕະກາດໃນມື → ລົງກາດ → ເລືອກນາກນ້ອຍ → ເລືອກຂອງທີ່ຈະຖອດ. ນີ້ແມ່ນເກມລອງ ບໍ່ໄດ້ລາງວັນ.';}else status.textContent=view==='mix'?'ກົດຕົວຢ່າງເດັກດ້ານເທິງ ຫຼືກັ່ນຕອງຕາມບົດບາດ. ໃສ່ໄດ້ສະເພາະກາດທີ່ມີ.':'ເບິ່ງໄອຄອນ 2 ເຜົ່າມຸມຂວາເທິງຂອງກາດ. ສອງເຜົ່າ ຍັງນັບເປັນກາດ 1 ໃບ.';D.render();}
frame.onload=()=>show(selected);document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));
</script></html>
