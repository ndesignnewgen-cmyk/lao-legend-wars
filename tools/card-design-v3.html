<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<base href="../">
<title>ຕົວຢ່າງກາດ · ແນວ BOT</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao+Looped:wght@400;500;700;800&family=Noto+Sans+Lao:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tools/card-design-v3.css?v=8">
<style id="preview-style">
*{box-sizing:border-box}html,body{height:auto;min-height:100%;overflow:auto}body{margin:0;background:#101923;color:#f7ecd8;font:15px/1.7 'Noto Sans Lao',sans-serif}body::before{display:none}header{max-width:1600px;margin:auto;padding:24px 28px 16px;display:flex;align-items:center;justify-content:space-between;gap:20px}.eyebrow{color:#c9a86a;font:500 10px/1.5 system-ui;letter-spacing:3px;margin:0 0 8px}h1{font-size:24px;margin:0;line-height:1.6}header p{margin:3px 0 0;font-size:13px;color:#a9b8c7}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,select{font:700 13px 'Noto Sans Lao',sans-serif;border:1px solid #526071;border-radius:12px;padding:9px 13px;color:#eadcc3;background:#223143;cursor:pointer}button[aria-pressed=true]{border-color:#d4b273;background:#d4b273;color:#1b2632}.preview-grid{max-width:1600px;margin:auto;padding:6px 28px 24px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.example{padding:16px;border:1px solid #384859;border-radius:18px;background:linear-gradient(145deg,#1e2d3c,#172330);min-width:0}.example.refined{border-color:#ac8b51;background:linear-gradient(150deg,#2a343b,#192b35)}.example h2{font:700 15px/1.6 'Noto Sans Lao',sans-serif;margin:0 0 12px;display:flex;align-items:center;gap:9px}.example h2 b{font:700 9px/1.5 system-ui;color:#e7c482;border:1px solid #bda06b77;border-radius:5px;padding:2px 5px;letter-spacing:1px}.card-wrap{max-width:330px;margin:auto}.example .card{width:100%;margin:auto;animation:none}.example .card::after{display:none}.example .card img{display:block}.example .caption{color:#9daebe;font-size:11px;line-height:1.7;margin:13px 0 0;min-height:38px}.example.refined .caption{color:#d3c4a8}.mini-example{display:none;border-top:1px solid #ffffff19;margin-top:14px;padding-top:15px}.mini-example .card{width:112px;margin:auto}.mini-example small{display:block;text-align:center;color:#a9b8c7;font-size:11px;margin:7px 0 0}.small-cards .mini-example{display:block}.new-only .example.old{display:none}.new-only .preview-grid{grid-template-columns:repeat(2,minmax(0,1fr));max-width:1020px}.new-only .card-wrap{max-width:340px}footer{padding:0 28px 22px;max-width:1600px;margin:auto;color:#a9b8c7;font-size:12px}#status{color:#e1c58d;margin:0 0 8px}#game{position:absolute;left:-2000px;top:0;width:1000px;height:700px;visibility:hidden}a{color:#e1c58d}
@media(max-width:900px){header{align-items:flex-start;flex-direction:column;gap:12px;padding:20px}.preview-grid{padding:4px 20px 20px;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.example{padding:13px}h1{font-size:22px}.example h2{font-size:14px}.example .caption{min-height:0}.card-wrap{max-width:310px}}
@media(max-width:720px){.new-only .preview-grid{grid-template-columns:1fr;max-width:440px}.new-only .card-wrap{max-width:350px}}
@media(max-width:480px){header{padding:16px}.preview-grid{padding:0 12px 18px;gap:10px}.example{padding:9px;border-radius:12px}.example h2{font-size:11px;gap:4px;margin-bottom:9px}.example h2 b{font-size:8px;padding:1px 3px}.example .caption{font-size:10px}select,button{font-size:12px;padding:7px 10px}.toolbar{gap:6px}.new-only .preview-grid{grid-template-columns:1fr;max-width:390px}.new-only .example h2{font-size:15px}.mini-example .card{width:94px}footer{padding:0 16px 20px}}
</style>
</head>
<body>
<header><div><div class="eyebrow">LAO LEGEND WARS · CARD STUDY</div><h1>ກາດແນວ BOT · ຕຳນານລາວ</h1><p>ກ່ອງບຸນ/ພະລັງ/ຊື່ແບບດຽວກັນ · ປ້າຍນ້ອຍຂ້າງບຸນ</p></div><div class="toolbar"><select id="character" aria-label="ເລືອກກາດ"><option value="mechyak">ຍັກຈັກກົນ</option><option value="nagax">ນາກາ-X · ຕຳນານ</option><option value="champathong">ເທວີດາບຈຳປາທອງ · ຊື່ຍາວ</option><option value="babynaga">ນາກນ້ອຍ · ເຜົ່າດຽວ</option></select><button id="new-only" aria-pressed="false">ເບິ່ງແຕ່ແບບໃໝ່</button><button id="small-cards" aria-pressed="false">ລອງກາດນ້ອຍ</button></div></header>
<p style="max-width:1600px;margin:0 auto 12px;padding:0 28px"><a href="tools/card-types-preview.html">ເບິ່ງກາດຄົບປະເພດ →</a></p>
<main class="preview-grid" id="grid"></main>
<footer><p id="status">ກຳລັງໂຫຼດກາດ…</p>ຕົວຢ່າງສຳລັບທຽບແບບ · ໜ້າກາດໃນເກມຫຼັກຍັງໃຊ້ແບບເດີມ</footer>

<script src="tools/card-design-v3.js?v=8"></script>
<script>
const grid=document.getElementById('grid'),status=document.getElementById('status');let D=null;const params=new URLSearchParams(location.search);if([...document.getElementById('character').options].some(o=>o.value===params.get('card')))document.getElementById('character').value=params.get('card');if(params.get('view')==='new'){document.body.classList.add('new-only');document.getElementById('new-only').setAttribute('aria-pressed','true');}
function face(id,alt,refined){const box=document.createElement('div');box.innerHTML=D.dino.cardHTML(id,null,alt,null,null,true);if(refined)CardDesign.decorate(box.firstElementChild,D.C[id]);return box.innerHTML;}
function render(){if(!D)return;const id=document.getElementById('character').value,hasAlt=D.deck.hasAltArt(id);const rows=[[false,false,'ປົກກະຕິ · ແບບເດີມ','ໂລ້ເຜົ່ານ້ອຍທີ່ເຈົ້າເລືອກ'],[false,true,'ປົກກະຕິ · ແບບໃໝ່','ສະກິນແບບເກົ່າ · ປ້າຍຊື່ຂອບຄຳ'],[hasAlt,false,(hasAlt?'ອາດພິເສດ':'ປົກກະຕິ')+' · ແບບເດີມ','ຂໍ້ຄວາມວາງເທິງຮູບກາດ'],[hasAlt,true,(hasAlt?'ອາດພິເສດ':'ປົກກະຕິ')+' · ແບບໃໝ່','ສະກິນແບບເກົ່າ · ຮູບເກືອບເຕັມຂອບ · ປ້າຍຊື່ຄຳ']];grid.innerHTML=(hasAlt?rows:rows.slice(0,2)).map(([alt,newDesign,title,caption])=>'<section class="example '+(newDesign?'refined':'old')+'"><h2>'+title+(newDesign?'<b>ໃໝ່</b>':'')+'</h2><div class="card-wrap">'+face(id,alt,newDesign)+'</div><p class="caption">'+caption+'</p><div class="mini-example">'+face(id,alt,newDesign)+'<small>ຂະໜາດກາດໃນມື</small></div></section>').join('');status.textContent='ໃຊ້ຮູບ ແລະຄວາມສາມາດໃບດຽວກັນທຽບກ່ອນ–ຫຼັງ';}
// The samples use the game's actual cardHTML output; this page changes presentation only.
async function init(){try{const [text,data]=await Promise.all([fetch('index.html?card-design=types6',{cache:'reload'}).then(r=>r.text()),fetch('tools/card-design-samples.json?v=8').then(r=>r.json())]);D={C:data.cards,deck:{hasAltArt:id=>!!data.faces[id].alt},dino:{cardHTML:(id,cost,alt)=>data.faces[id][alt?'alt':'normal']}};const doc=new DOMParser().parseFromString(text,'text/html'),style=document.createElement('style');style.textContent=[...doc.querySelectorAll('style')].map(s=>s.textContent).join('\n');document.head.insertBefore(style,document.querySelector('link[href^="tools/card-design-v3.css"]'));render();}catch(e){status.textContent='ໂຫຼດກາດບໍ່ສຳເລັດ · ລອງໂຫຼດໜ້າຄືນ';console.error(e);}}init();
document.getElementById('character').onchange=render;for(const id of ['new-only','small-cards'])document.getElementById(id).onclick=e=>{const on=document.body.classList.toggle(id);e.currentTarget.setAttribute('aria-pressed',String(on));};
</script>
</body></html>
