<!doctype html>
<html lang="lo">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ເດັກ 14 · ນັກດາບສາວແບບໃໝ່</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101b26;color:#fff0d3;font:16px system-ui,sans-serif}header{padding:22px max(18px,4vw);background:linear-gradient(120deg,#293b40,#162331 70%);border-bottom:1px solid #b79759}h1{font-size:clamp(22px,3vw,34px);margin:0 0 8px}p{margin:5px 0;color:#dbcdb1;line-height:1.7}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin-top:16px}button,select,a.pill{font:inherit;border:1px solid #c8a66a;border-radius:22px;padding:9px 17px;background:#203540;color:#ffebc0;cursor:pointer;text-decoration:none}button.primary{background:#e9c47b;color:#1c2427;font-weight:700}button:hover,a.pill:hover{filter:brightness(1.15)}button:disabled{opacity:.5}select{max-width:280px}#status{font-size:14px;margin-top:13px}main{padding:24px max(18px,4vw)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:24px;max-width:1600px;margin:auto}.tile{margin:0;background:#1c2b35;border:1px solid #6a624e;border-radius:14px;overflow:hidden;box-shadow:0 8px 25px #0004}.tile button{padding:0;border:0;border-radius:0;width:100%;background:none;display:block}.tile img{display:block;width:100%;aspect-ratio:5/7;object-fit:cover}.tile figcaption{padding:13px 15px;min-height:72px;line-height:1.6;overflow-wrap:anywhere}.tile small{display:block;color:#cdb477;font-size:12px}#play{display:none}#play.active{display:block}iframe{display:block;width:100%;height:78dvh;min-height:550px;border:0;background:#152a28}#gallery.hidden{display:none}#viewer{position:fixed;inset:0;margin:auto;max-width:96vw;max-height:92dvh;width:min(1000px,96vw);height:92dvh;border:1px solid #c8a66a;border-radius:14px;background:#1c2b35;color:#fff0d3;padding:20px;z-index:4}#viewer[open]{display:flex;flex-direction:column;align-items:center;gap:12px}#viewer img{flex:1;min-height:0;max-width:100%;max-height:calc(100dvh - 90px);object-fit:contain}#viewer::backdrop{background:transparent}#viewer button{position:absolute;right:18px;top:15px;background:#243641}footer{padding:18px;text-align:center;color:#b7b3a4;font-size:13px}@media(max-width:550px){header{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}main{padding:15px}.tile figcaption{padding:10px;font-size:14px}.actions button,.actions select{font-size:14px;padding:8px 12px}iframe{height:82dvh;min-height:650px}}
</style>
<header><h1>⚔ ເດັກ 14 · ນັກດາບສາວມໍປາຍ</h1><p>ຊົມລົມດາບໃນໂຮງຮຽນລາວຍຸກປະຈຸບັນ · ພາບລະອຽດແບບນາງຕານີ</p>
<div class="actions"><button class="primary" id="viewGallery">ເບິ່ງຮູບທັງໝົດ</button><button id="viewBoard">ເບິ່ງໃນເກມ</button><button id="playBot">ລອງກັບບອດ</button><select id="character" aria-label="ເລືອກຕົວລະຄອນ"></select><button id="entrance">ເບິ່ງສາກອອກໂຕ</button><button id="specialEntrance">✦ ລອງອາດພິເສດ</button><button id="fusion">ລອງກາດລອຍຮ່ວມຮ່າງ</button><select id="cue" aria-label="ເລືອກເອັບເຟັກ"></select><button id="testCue">ລອງເອັບເຟັກ + ສຽງ</button><a class="pill" href="../prompts/deck-14-voices.html">ບົດພາກລາວ</a><a class="pill" href="deck-14-sfx.html">ຟັງ SFX ທັງໝົດ</a></div><p id="status">ກຳລັງໂຫຼດ…</p></header>
<section id="play"><iframe id="game" src="../?deck14-preview=1" allow="autoplay"></iframe></section>
<main id="gallery"><div class="grid" id="grid"></div></main>
<footer>ກົດຮູບເພື່ອເບິ່ງໃຫຍ່</footer>
<dialog id="viewer"><button id="closeViewer">ປິດ ✕</button><img alt="" id="large"><span id="largeName"></span></dialog>
<script>
const cards=[['dappi1','ນັກດາບປີ 1'],['daphangma','ນັກດາບຫາງມ້າ'],['dapkhu','ສາວຟ້ອນດາບຄູ່'],['dapjaidi','ນັກດາບໃຈດີ'],['dapwaen','ສາວແວ່ນນັກວິເຄາະ'],['daphuana','ຫົວໜ້າຊົມລົມດາບ'],['dapolo','ນັກດາບໂລ່ໄມ້'],['ajandap','ອາຈານສອນດາບ'],['dapsongmue','ສາວດາບສອງມື'],['nangchampa','ນາງຈຳປາ · ດາບດອກໄມ້'],['dapmai','ດາບໄມ້ຊ້ອມ'],['dapngoen','ດາບເງິນລາຍກະໜົກ'],['fondap','ຟ້ອນດາບຕ້ອນຮັບ'],['tatlom','ທ່າຕັດລົມ'],['hofuek','ຫໍຝຶກດາບ'],['khudapphen','ຄູ່ດາບເດືອນເພັງ'],['champathong','ເທວີດາບຈຳປາທອງ'],['alt-champathong','ເທວີດາບຈຳປາທອງ · ອາດພິເສດ']];
const $=id=>document.getElementById(id),frame=$('game'),get=()=>frame.contentWindow.__dbg;
$('grid').innerHTML=cards.map(([id,name],i)=>'<figure class="tile"><button data-open="'+id+'" aria-label="'+name+'"><img src="../art/w2/'+id+'.webp?blade14=1" alt="'+name+'" loading="'+(i<4?'eager':'lazy')+'"></button><figcaption>'+name+'<small>'+(id.startsWith('alt-')?'✦ ອາດພິເສດ':i>14?'🤝 ຮ່າງຮ່ວມ':'⚔ ຮູບໃໝ່')+'</small></figcaption></figure>').join('');
$('grid').onclick=e=>{const b=e.target.closest('[data-open]');if(!b)return;const row=cards.find(c=>c[0]===b.dataset.open);$('large').src='../art/w2/'+row[0]+'.webp?blade14=1';$('large').alt=row[1];$('largeName').textContent=row[1];$('viewer').showModal();};$('closeViewer').onclick=()=>$('viewer').close();
function view(board){$('gallery').classList.toggle('hidden',board);$('play').classList.toggle('active',board);$('viewGallery').classList.toggle('primary',!board);$('viewBoard').classList.toggle('primary',board);}
function demo(){const D=get();if(!D){$('status').textContent='ສ່ວນລອງເກມໃຊ້ໄດ້ໃນເຄື່ອງເທົ່ານັ້ນ';return;}const K=D.dino;D.style.set({theme:'watphou'});K.set(null);const g={screen:'game',p:[K.make('ເຈົ້າ',13,false,1),K.make('ບອດ',13,true,1)],turn:0,T:8,level:1,log:[],over:null,fast:false,auto:false,busy:false,targeting:null,sel:null,modal:null,fest:null};K.set(g);for(const p of g.p)Object.assign(p,{mana:10,maxMana:10,mulled:true,tales:[],deck:Array(24).fill('dappi1')});const add=(id,side)=>{const c=K.fresh(id);c.sick=false;g.p[side].field.push(c);};['daphangma','dapkhu','daphuana'].forEach(id=>add(id,1));['nangchampa','dapsongmue','ajandap'].forEach(id=>add(id,0));g.p[0].hand=['dappi1','dapwaen','dapolo','fondap','dapngoen'].map((id,i)=>({id,uid:700000+i}));D.render();$('status').textContent='ກາດໃໝ່ໃນສະໜາມ · ລອງກົດເບິ່ງໄດ້';}
$('viewGallery').onclick=()=>view(false);$('viewBoard').onclick=()=>{view(true);demo();};$('playBot').onclick=()=>{const D=get();if(!D)return;view(true);D.dino.set(null);D.style.set({theme:'watphou'});D.dino.newGame(13,1,{first:0});$('status').textContent='ຫຼິ້ນເດັກ 14 ກັບບອດກາງ';};
async function effect(fn){const D=get();if(!D)return;view(true);if(!D.S||D.S.screen!=='game')demo();if(D.S.busy)return;const g=D.S;g.busy=true;const buttons=[...document.querySelectorAll('button,select')];buttons.forEach(b=>b.disabled=true);try{D.dino.audio();await D.blade.preload();frame.scrollIntoView({block:'start'});await fn(D);}finally{if(D.S===g){g.busy=false;D.render();}buttons.forEach(b=>b.disabled=false);}}
$('entrance').onclick=()=>effect(D=>{const id=$('character').value;return D.fx.show(id.replace(/^alt-/,''),id.startsWith('alt-'));});$('fusion').onclick=()=>effect(D=>runFusion(D,$('character').value==='khudapphen'?'khudapphen':'champathong'));
$('specialEntrance').onclick=()=>{$('character').value='alt-champathong';return effect(D=>D.fx.show('champathong',true));};
async function runFusion(D,f){
 const g=D.S,p=g.p[0],auto=g.auto;p.field=D.C[f].fusion.map(id=>{const c=D.dino.fresh(id);c.sick=false;return c;});p.mana=10;p.blade=0;p.fused=(p.fused||[]).filter(x=>x!==f);g.turn=0;g.auto=true;D.render();
 try{if(D.blade.canFuse(f))await D.blade.fuse(f);}finally{g.auto=auto;D.render();}
}
const cueNames={draw:'ຊັກດາບ',slash:'ຟັນດາບເງິນ',double:'ດາບຄູ່',guard:'ໂລ້ຈຳປາ',heal:'ກີບຈຳປາຮັກສາ',focus:'ລວມຈິດດາບ',training:'ຝຶກດາບໄມ້',legend:'ນາງຈຳປາອອກໂຕ',dance:'ຟ້ອນດາບດອກຈຳປາ',fusion:'ຄູ່ດາບເດືອນເພັງ',ultimate:'ເທວີດາບຈຳປາທອງ'};
for(const [key,name]of Object.entries(cueNames)){$('cue').add(new Option(name,key));}
$('testCue').onclick=()=>effect(D=>{const k=$('cue').value;if(k==='legend')return D.fx.show('nangchampa');if(k==='fusion'||k==='ultimate')return runFusion(D,k==='fusion'?'khudapphen':'champathong');return D.blade.cue('c:'+D.S.p[0].field[0].uid,k,'nangchampa',['slash','double','dance'].includes(k)?'c:'+D.S.p[1].field[0].uid:null);});
frame.onload=()=>{const D=get();if(!D){$('status').textContent='ເບິ່ງຮູບທັງໝົດໄດ້; ສ່ວນລອງເກມໃຊ້ໃນເຄື່ອງ';return;}for(const id of ['nangchampa','dapsongmue','ajandap','khudapphen','champathong','alt-champathong']){const o=document.createElement('option');o.value=id;o.textContent=cards.find(c=>c[0]===id)[1];$('character').append(o);}$('status').textContent='ພ້ອມແລ້ວ · 25 ຮູບ + ຮູບເອັບເຟັກ 6 + SFX 11';const q=new URLSearchParams(location.search);if(q.has('card')&&cards.some(c=>c[0]===q.get('card')))$('character').value=q.get('card');if(q.has('cue')||q.has('card')){if(q.has('cue'))$('cue').value=q.get('cue');view(true);demo();}};
</script>
</html>
